name: Waitlist

# The site's only conversion mechanism, checked from outside, every day.
#
# This exists because of a two day outage that nothing noticed. api/ was never
# passed to the publish step, so every deploy uploaded a site with no API and
# the platform removed the managed function; every path under /api answered 500
# from 29 August, www/lib/waitlist.ts turned that into "Something went wrong on
# our side", and every person who typed their address into the form believed
# they were on a list that did not have them. CI was green throughout. The
# deploy was green throughout. Nothing was wrong with any file in the
# repository. The only thing that could have told anybody was a request.
#
# Separate from CI and on a schedule for the same reason as links.yml: this is
# a property of the live site rather than of a change, and a pull request must
# not be refused because Azure is having a bad afternoon.
#
# THE POINT IS THE SECOND POST. A 200 is not evidence, because a 200 from an
# endpoint that writes nowhere looks exactly like a 200 from one that works,
# and that is precisely the state this was in. So the check signs the same
# address up twice. `alreadyJoined` is not computed from the request: the
# endpoint reads the row back out of the table to answer it. It can only be
# true on the second attempt if the first attempt's write actually landed in
# storage and a later read found it. That is an end to end proof of the whole
# path, from outside, with no credential and no access to the store.
#
# One fixed address rather than one per run, so this leaves a single permanent
# row that is obviously not a person instead of a growing pile of them. The
# endpoint is idempotent on the address by design, which is the property being
# exercised. api/README.md names the address so nobody counts it as a lead.

on:
  schedule:
    # 07:00 UTC daily, an hour after the link check so two scheduled jobs are
    # not competing for the same runner minute.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Two runs signing up the same address at once would race on which of them
  # sees alreadyJoined false, and the loser would fail for no reason.
  group: waitlist-probe
  cancel-in-progress: false

jobs:
  probe:
    name: a signup reaches the store
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Same guard as deploy.yml. A fork running this on a schedule would post to
    # somebody else's production site.
    if: ${{ github.repository == 'antifailure/antifailure' }}

    steps:
      - name: The API is answering at all
        run: |
          set -uo pipefail
          site=https://antifailure.dev

          index=$(curl -sS -m 20 -o /tmp/index.json -w '%{http_code}' "$site/api" || echo 000)
          if [ "$index" != "200" ]; then
            echo "::error::GET /api returned $index. The managed function is not answering."
            head -c 500 /tmp/index.json || true
            exit 1
          fi
          if ! grep -q '/api/waitlist' /tmp/index.json; then
            echo "::error::GET /api answered 200 but does not list the waitlist endpoint."
            head -c 500 /tmp/index.json
            exit 1
          fi

          reject=$(curl -sS -m 20 -o /tmp/reject.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            -d '{"email":"not-an-address","source":"probe"}' \
            "$site/api/waitlist" || echo 000)
          if [ "$reject" != "400" ]; then
            echo "::error::POST /api/waitlist with an invalid address returned $reject, expected 400."
            head -c 500 /tmp/reject.json || true
            exit 1
          fi
          echo "GET /api is 200 and lists the waitlist; junk is rejected with 400"

      - name: A signup actually lands in the table
        run: |
          set -uo pipefail
          site=https://antifailure.dev
          address=waitlist-probe@antifailure.dev

          post() {
            curl -sS -m 20 -o "$1" -w '%{http_code}' \
              -X POST -H 'content-type: application/json' \
              -d "{\"email\":\"$address\",\"source\":\"probe\"}" \
              "$site/api/waitlist" || echo 000
          }

          first=$(post /tmp/first.json)
          if [ "$first" != "200" ]; then
            echo "::error::the first signup returned $first, expected 200."
            head -c 500 /tmp/first.json || true
            exit 1
          fi

          # A moment between them, because the write and the read behind
          # alreadyJoined are two round trips to storage and asking
          # immediately would be testing the store's write latency rather
          # than whether the row exists.
          sleep 5

          second=$(post /tmp/second.json)
          if [ "$second" != "200" ]; then
            echo "::error::the second signup returned $second, expected 200."
            head -c 500 /tmp/second.json || true
            exit 1
          fi

          if ! grep -q '"alreadyJoined":true' /tmp/second.json; then
            echo "::error::THE WAITLIST IS DROPPING SIGNUPS. Both attempts answered 200, and the second"
            echo "::error::did not report alreadyJoined. That value is read back out of the table, so a"
            echo "::error::false here means the first write did not land. Every address typed into the"
            echo "::error::form on antifailure.dev is going nowhere while this is true."
            echo "second response: $(cat /tmp/second.json)"
            exit 1
          fi

          echo "a signup reached the table and was read back out of it"
