name: Keyrings

# The two platforms this development loop cannot reach.
#
# The macOS keychain is tested on the machine that writes the code, against the
# real keychain, so it needs nothing here. Linux and Windows do not have that:
# there is no Windows machine in this loop at all, and a macOS machine has no
# freedesktop Secret Service. Without this job the Windows Credential Manager
# implementation would be code nobody had ever executed, which is a claim about
# behaviour rather than a report of it.
#
# Separate from ci.yml on purpose. These runners are slower and rarer than
# ubuntu-latest, this runs only when the code it covers changes, and mixing it
# into the main gate would make every unrelated pull request wait for a Windows
# runner.

on:
  push:
    branches: [main]
    paths:
      - 'engine/internal/secrets/**'
      - '.github/workflows/keyring.yml'
  pull_request:
    paths:
      - 'engine/internal/secrets/**'
      - '.github/workflows/keyring.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run on main is the verdict a tag and a deploy are read against, so it
  # is never cancelled. On a branch the saving is real and nothing depends
  # on the superseded answer, so cancelling stays.
  #
  # Six merges landed inside one run's length on 2026-09-02 and each cancelled
  # the one before it, so main went from 09:07 to past 12:30 with no COMPLETED
  # run at all. Cancelled is not red, but it is not a verdict either, and
  # `release.yml` had no gate of its own, so the only thing standing between
  # an unverified commit and published binaries was somebody holding merges
  # by hand.
  #
  # There is no clause for tags here because this workflow does not run on
  # one. The `on:` block above is a push to main and a pull request, and
  # nothing else, so `refs/tags/` is a ref this expression is never evaluated
  # against. The first version of this line excluded tags anyway, which read
  # as protection and was a condition that could not be true.
  #
  # What this does NOT buy, so nobody reads more into it than it does: a run
  # that has already STARTED is never cancelled, and that is the whole of it.
  # GitHub still cancels a run that is merely PENDING when a newer one queues
  # behind the same in progress run. So the newest commit always reaches a
  # verdict, which is what a tag and a deploy are read against, and commits in
  # between a burst of merges still get skipped. Every commit reaching a
  # verdict needs a merge queue, not a bigger timeout.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read, and only read. Every action is pinned to a commit rather than a tag,
# because a tag is mutable and pinning is what makes the reviewed thing the run
# thing.
permissions:
  contents: read

jobs:
  windows:
    name: Windows Credential Manager
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      # Scoped to the keyring tests rather than the whole package. This job
      # exists to prove one thing, against the real Credential Manager, and a
      # broad run here would be a second and much slower copy of a gate that
      # already runs on Linux for everything that is not platform specific.
      #
      # CGO_ENABLED=0, because that is how the binary ships: the implementation
      # reaches advapi32 through LazyDLL precisely so it needs no cgo, and a job
      # that proved it works WITH cgo would be proving the wrong thing.
      - name: The real Credential Manager
        working-directory: engine
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: >
          go test ./internal/secrets/ -count=1 -v
          -run 'SystemKeyringRoundTrips|AValueWithAwkwardCharactersSurvives|NonASCIIAndAstral|AMultiLineValueAndTrailingNewline|AValueAtTheLimit|ARealisticallyLongValue|AnEmptyValueIsPresent'

  linux:
    name: Linux Secret Service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      # The real daemon and the real client, not a stand-in for either.
      # dbus-run-session gives them a session bus without an X server or a login
      # session, which is what makes this runnable on a runner at all.
      - name: A real keyring daemon
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11

      # The password guards a keyring that exists for the length of one job and
      # holds nothing but the test's own values, so it is a literal here rather
      # than a secret. A passphrase that guards nothing is not a secret, and
      # generating one would only make the step harder to read.
      #
      # The whole run is inside dbus-run-session because every part of it needs
      # the same bus: a step that started its own would talk to a different
      # daemon than the one that was unlocked.
      - name: The real Secret Service
        working-directory: engine
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            eval "$(printf test | gnome-keyring-daemon --unlock --components=secrets)"
            export GNOME_KEYRING_CONTROL
            # The harness proves itself first. Without this, a broken daemon
            # makes every Go test skip and the job reports success having
            # verified nothing, which is the exact failure this whole file
            # exists to prevent.
            printf harness | secret-tool store --label=harness service af-harness account probe
            test "$(secret-tool lookup service af-harness account probe)" = harness
            secret-tool clear service af-harness account probe
            # No -race. The race detector needs cgo and this job runs with
            # CGO_ENABLED=0 deliberately, because that is how the binary ships
            # and it is the configuration the keyring implementations exist to
            # work under. The engine job already runs the whole tree under the
            # race detector on a normal build.
            go test ./internal/secrets/... -count=1
          '
