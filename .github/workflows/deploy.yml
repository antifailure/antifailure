name: Deploy

# The site is a manual snapshot until this runs.
#
# `az staticwebapp show -n af-site -g af-web` reports provider SwaCli, and both
# repositoryUrl and branch are null. There is no repository connection: the live
# site is whatever somebody last pushed from their own machine with the SWA CLI.
# So every documentation change sits on main, green, and invisible. The 78 link
# fixes in 0c69add are on main right now and antifailure.dev still serves the
# broken ones.
#
# Worse than being stale is that nothing says so. A deploy that never happens
# produces no red check, no failed run, nothing to notice. This makes shipping
# the site look like shipping the code: a push moves it, and a failure is
# visible.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # INERT UNTIL THE TOKEN EXISTS, on purpose.
    #
    # Adding a workflow that fails until somebody sets a secret would turn main
    # red for eleven other branches over something none of them did, and a red
    # main that everybody has learned to ignore is worse than no check at all.
    # This skips cleanly and starts working the moment the secret is set:
    #
    #   az staticwebapp secrets list -n af-site -g af-web \
    #     --query "properties.apiKey" -o tsv | gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN
    #
    # That command is for a person to run. Nothing here reads the token, and no
    # step prints it.
    if: ${{ github.repository == 'antifailure/antifailure' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # www/lib/lastmod.ts asks git when the files behind each route last
          # changed, and writes that into the sitemap. The default shallow
          # fetch leaves every file looking like it was created in one commit,
          # which collapses every lastmod to the same value and turns a
          # freshness signal into noise.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            www/package-lock.json
            docs/package-lock.json

      - name: Build the marketing site
        # next.config.ts sets output: "export", so this writes static files and
        # needs no server.
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: www

      - name: Install the site API
        # The waitlist function. This step is the whole reason the sign-up form
        # on antifailure.dev worked for two days and then stopped: the publish
        # below passed neither api_location nor an api build, so every deploy
        # from here uploaded a site with no API, and Static Web Apps removed
        # the managed function the first hand deploy had put there. Every path
        # under /api answered 500 from that moment, and www/lib/waitlist.ts
        # turns a 500 into "Something went wrong on our side", so every address
        # anybody typed went nowhere and the form said so in a way that read
        # like our fault, which it was.
        #
        # npm ci rather than letting the platform's builder run npm install:
        # the lockfile is the point, and the same install runs in CI.
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: api

      - name: Check the SEO and GEO surfaces
        # Every one of these was missing from production when the check was
        # written: no sitemap, no robots.txt, no canonical, no OpenGraph, no
        # structured data, and an og:image that had 404'd since the day the
        # documentation site first referenced it. None of it broke a build.
        # That is exactly why it needs a check rather than a habit.
        run: npm run check:seo
        working-directory: www

      - name: Build the documentation
        # astro.config.mjs sets base: /docs, and that is load bearing rather
        # than cosmetic: every error the engine prints ends with
        # antifailure.dev/docs/<the catalog's docs field>, so a page's URL has
        # to be its path under src/content/docs exactly.
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: docs

      - name: Assemble one site
        # tools/site/assemble.sh, which CI runs too. This layout used to live
        # here and again in ci.yml, and two copies of a thing is one more than
        # anybody keeps true: they had already drifted, and neither copy ever
        # placed /install.sh or the schemas the product hard-codes.
        run: tools/site/assemble.sh

      - name: Check the assembled site before publishing it
        # The defect that prompted all of this was 78 links pointing outside
        # the site, so the built output is checked for the same thing rather
        # than trusting that the source fix survived the build.
        run: |
          set -euo pipefail
          bad=$(grep -rhoE 'href="/(concepts|guides|reference|providers|self-hosting|enterprise)/' site/docs 2>/dev/null | sort -u || true)
          if [ -n "$bad" ]; then
            echo "the built documentation links outside the site, which 404s for a reader:"
            echo "$bad"
            exit 1
          fi
          echo "no documentation link escapes the /docs base"

      - name: Publish
        # Skipped, with the job still green, until somebody sets the token.
        # A skipped publish is honest; a failing one teaches people to ignore
        # a red main.
        if: ${{ env.TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          # Relative to the repository root, not to app_location. The runtime
          # to start it on is platform.apiRuntime in the configuration
          # tools/site/assemble.sh writes, which skip_api_build makes required
          # rather than optional.
          api_location: api
          skip_app_build: true
          skip_api_build: true

      - name: The API answers
        # A publish is not a working endpoint, and this is the one part of the
        # site that can be deployed, report success, and still be dead: a
        # static file either exists or 404s, but a function app can be present
        # and refuse every request. That is exactly what happened here for two
        # days, with a green deploy every time.
        #
        # Two requests, and neither one writes anything. GET /api must return
        # the index, which proves the function app started. POST /api/waitlist
        # with a body that is not an address must return 400, which proves the
        # route reaches the waitlist function and that it validates before it
        # touches storage. A real address would put a row in the real table.
        if: ${{ env.TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -uo pipefail
          site=https://antifailure.dev

          # The CDN needs a moment to pick up a new function app, and a deploy
          # that is merely slow must not read as a deploy that is broken.
          for attempt in $(seq 1 15); do
            index=$(curl -sS -m 15 -o /tmp/api-index.json -w '%{http_code}' "$site/api" || echo 000)
            [ "$index" = "200" ] && break
            echo "attempt $attempt: GET /api returned $index"
            sleep 10
          done

          if [ "$index" != "200" ]; then
            echo "::error::GET /api returned $index after 15 attempts. The managed function is not answering."
            head -c 500 /tmp/api-index.json || true
            exit 1
          fi

          if ! grep -q '/api/waitlist' /tmp/api-index.json; then
            echo "::error::GET /api answered 200 but does not list the waitlist endpoint."
            head -c 500 /tmp/api-index.json
            exit 1
          fi

          reject=$(curl -sS -m 15 -o /tmp/api-reject.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            -d '{"email":"not-an-address","source":"deploy-check"}' \
            "$site/api/waitlist" || echo 000)
          if [ "$reject" != "400" ]; then
            echo "::error::POST /api/waitlist with an invalid address returned $reject, expected 400."
            head -c 500 /tmp/api-reject.json || true
            exit 1
          fi

          echo "GET /api is 200 and lists the waitlist; POST /api/waitlist rejects junk with 400"

      - name: The machine-readable surfaces answer, and describe this revision
        # The other half of "a publish is not a working endpoint", for the two
        # documents an agent fetches instead of reading the site.
        #
        # Both are generated at build time and committed, so the question is not
        # whether they are valid, CI already refused the push otherwise. It is
        # whether the CDN is serving THESE bytes rather than the previous
        # revision's, which a 200 alone cannot tell you: a stale document is a
        # perfectly healthy 200 that describes an API this revision does not
        # serve.
        #
        # The drift check afterwards is the honest part of the design decision
        # in web/apps/api/scripts/openapi.ts. The site deploys on every push to
        # main; the production control plane moves on a release promotion. So
        # this document can be ahead of what app.antifailure.dev serves. That is
        # tolerable while the API VERSION agrees, because the paths are additive
        # and a caller reading an operation that is not there yet gets a 404.
        # It stops being tolerable the moment the versions differ, and that is
        # the one case this fails on.
        if: ${{ env.TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -uo pipefail
          site=https://antifailure.dev
          control=https://app.antifailure.dev

          for name in openapi.json errors.v1.json; do
            for attempt in $(seq 1 15); do
              code=$(curl -sS -m 20 -o "/tmp/$name" -w '%{http_code}' "$site/$name" || echo 000)
              [ "$code" = "200" ] && break
              echo "attempt $attempt: GET /$name returned $code"
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "::error::GET $site/$name returned $code after 15 attempts."
              head -c 400 "/tmp/$name" || true
              exit 1
            fi
            # Byte for byte against what this run built. Nothing else proves the
            # CDN moved: the previous revision's document is also valid JSON,
            # also 200, and also parses.
            if ! cmp -s "/tmp/$name" "site/$name"; then
              echo "::error::$site/$name is not the document this revision built."
              echo "  served  $(shasum -a 256 < "/tmp/$name" | cut -c1-16)"
              echo "  built   $(shasum -a 256 < "site/$name" | cut -c1-16)"
              exit 1
            fi
            echo "$site/$name is 200 and matches this revision"
          done

          node -e '
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync("/tmp/openapi.json", "utf8"));
            if (doc.openapi !== "3.1.0") throw new Error(`openapi is ${doc.openapi}`);
            const paths = Object.keys(doc.paths ?? {});
            if (paths.length === 0) throw new Error("the published document has no paths");
            const ids = Object.values(doc.paths).flatMap((item) =>
              Object.values(item).map((op) => op.operationId));
            if (ids.some((id) => !id)) throw new Error("an operation has no operationId");
            console.log(`the published document has ${paths.length} paths and ${ids.length} operation ids`);
          '

          catalog=$(node -e '
            const c = JSON.parse(require("fs").readFileSync("/tmp/errors.v1.json", "utf8"));
            if (c.schemaVersion !== 1) throw new Error(`schemaVersion ${c.schemaVersion}`);
            if (!c.errors.some((e) => e.code === "AF-CP-003"))
              throw new Error("the code the control plane 500 returns is not in the published catalog");
            console.log(c.errors.length);
          ')
          echo "the published error catalog resolves $catalog codes"

          # Drift, fatal only when the two API versions actually disagree.
          #
          # An unreachable control plane is NOT a disagreement, and failing on it
          # would redden a site deploy over somebody else's blip, which is how a
          # check gets ignored. Retried a few times first, then reported and
          # skipped: an unknown is an unknown.
          published=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/openapi.json","utf8")).info.version')
          served=unknown
          for attempt in $(seq 1 5); do
            served=$(curl -sS -m 20 "$control/openapi.json" \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).info.version' 2>/dev/null || echo unknown)
            [ "$served" != "unknown" ] && break
            sleep 5
          done
          if [ "$served" = "unknown" ]; then
            echo "::warning::$control did not serve a readable OpenAPI document, so the API"
            echo "version the apex publishes ($published) could not be compared against it."
          elif [ "$served" != "$published" ]; then
            echo "::error::the apex publishes API version $published and $control serves $served."
            echo "Promote the control plane, or hold this document back. A caller reading one"
            echo "version of the contract and calling the other is the failure this catches."
            exit 1
          else
            echo "apex and control plane agree on API version $published"
          fi

          # Live, not documented. A path in the document that the host does not
          # answer is the drift that actually costs a caller something, and the
          # two unauthenticated ones can be asked directly.
          for route in /health /readyz; do
            code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$control$route" || echo 000)
            case "$code" in
              200|503) echo "$control$route answers $code" ;;
              *) echo "::error::$control$route is published in the document and answered $code"; exit 1 ;;
            esac
          done

      - name: Tell Bing what changed
        # Only after a real publish, because IndexNow is a claim that a URL is
        # live and fetchable. Submitting before the deploy asks a crawler to
        # look at something that is not there yet, which is how a key gets
        # distrusted.
        #
        # This matters beyond Bing's own results: Bing's index is the retrieval
        # layer behind ChatGPT search and Copilot, so a page it has not indexed
        # cannot be cited there regardless of how it ranks on Google.
        #
        # The script exits 0 on a rejected submission. The site is already
        # published at this point and a crawler will find it anyway; failing
        # the deploy over a notification would be the wrong trade.
        if: ${{ env.TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        # --submit, because the script prints and stops without it. A script
        # that POSTs to somebody else's service when run with no arguments is
        # a footgun, and it went off once already.
        run: node scripts/indexnow.mjs --submit
        working-directory: www

      - name: Say so when it was not published
        if: ${{ env.TOKEN == '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          echo "Built and checked, but NOT published: AZURE_STATIC_WEB_APPS_API_TOKEN is not set."
          echo "The live site is a manual snapshot until it is. To wire it up:"
          echo "  az staticwebapp secrets list -n af-site -g af-web --query properties.apiKey -o tsv \\"
          echo "    | gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN"
