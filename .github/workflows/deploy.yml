name: Deploy

# The site is a manual snapshot until this runs.
#
# `az staticwebapp show -n af-site -g af-web` reports provider SwaCli, and both
# repositoryUrl and branch are null. There is no repository connection: the live
# site is whatever somebody last pushed from their own machine with the SWA CLI.
# So every documentation change sits on main, green, and invisible. The 78 link
# fixes in 0c69add are on main right now and antifailure.dev still serves the
# broken ones.
#
# Worse than being stale is that nothing says so. A deploy that never happens
# produces no red check, no failed run, nothing to notice. This makes shipping
# the site look like shipping the code: a push moves it, and a failure is
# visible.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # Queue, do not cancel. Every other workflow here cancels a superseded run
  # because a stale answer to "is this commit good" is worth nothing. This one
  # is not answering a question, it is uploading to production, and the steps
  # after the upload are the ones that check the upload worked.
  #
  # Cancelling caught a publish in flight. Run 33598095533, head 8fd7fedf:
  # "Assemble one site" and "Check the assembled site before publishing it"
  # both succeeded, "Publish" was CANCELLED part way through, and the four
  # steps after it were skipped. So a partial upload reached the live site and
  # nothing checked the result. "The API answers" and "The machine-readable
  # surfaces answer, and describe this revision" are exactly the checks that
  # exist because a publish is not a working endpoint, and they are the first
  # things cancellation takes away.
  #
  # The step named "Say so when it was not published" is skipped too, so this
  # failure is silent by construction: the alarm is inside the blast radius.
  #
  # Queueing costs a few minutes of latency when merges land back to back. That
  # is the correct trade against a half-uploaded site nobody was told about.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # INERT UNTIL THE TOKEN EXISTS, on purpose.
    #
    # Adding a workflow that fails until somebody sets a secret would turn main
    # red for eleven other branches over something none of them did, and a red
    # main that everybody has learned to ignore is worse than no check at all.
    # This skips cleanly and starts working the moment the secret is set:
    #
    #   az staticwebapp secrets list -n af-site -g af-web \
    #     --query "properties.apiKey" -o tsv | gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN
    #
    # That command is for a person to run. Nothing here reads the token, and no
    # step prints it.
    if: ${{ github.repository == 'antifailure/antifailure' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # www/lib/lastmod.ts asks git when the files behind each route last
          # changed, and writes that into the sitemap. The default shallow
          # fetch leaves every file looking like it was created in one commit,
          # which collapses every lastmod to the same value and turns a
          # freshness signal into noise.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            www/package-lock.json
            docs/package-lock.json

      # For routecheck below, which is the last thing standing between a site
      # that calls a route and a control plane that does not serve it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Build the marketing site
        # next.config.ts sets output: "export", so this writes static files and
        # needs no server.
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: www

      - name: Install the site API
        # This step is the whole reason /api on antifailure.dev worked for two
        # days and then stopped: the publish below passed neither api_location
        # nor an api build, so every deploy from here uploaded a site with no
        # API, and Static Web Apps removed the managed function the first hand
        # deploy had put there. Every path under /api answered 500 from that
        # moment, the sign-up form of the day turned that into "Something went
        # wrong on our side", and every address anybody typed went nowhere while
        # the page said so in a way that read like our fault, which it was.
        #
        # The form is gone and the function is not. It answers /api and every
        # path under it, which is how somebody pointing a machine at this host
        # is told where the product's API actually lives.
        #
        # npm ci rather than letting the platform's builder run npm install:
        # the lockfile is the point, and the same install runs in CI.
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: api

      - name: Check the SEO and GEO surfaces
        # Every one of these was missing from production when the check was
        # written: no sitemap, no robots.txt, no canonical, no OpenGraph, no
        # structured data, and an og:image that had 404'd since the day the
        # documentation site first referenced it. None of it broke a build.
        # That is exactly why it needs a check rather than a habit.
        run: npm run check:seo
        working-directory: www

      - name: Build the documentation
        # astro.config.mjs sets base: /docs, and that is load bearing rather
        # than cosmetic: every error the engine prints ends with
        # antifailure.dev/docs/<the catalog's docs field>, so a page's URL has
        # to be its path under src/content/docs exactly.
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: docs

      - name: Assemble one site
        # tools/site/assemble.sh, which CI runs too. This layout used to live
        # here and again in ci.yml, and two copies of a thing is one more than
        # anybody keeps true: they had already drifted, and neither copy ever
        # placed /install.sh or the schemas the product hard-codes.
        run: tools/site/assemble.sh

      - name: Check the assembled site before publishing it
        # The defect that prompted all of this was 78 links pointing outside
        # the site, so the built output is checked for the same thing rather
        # than trusting that the source fix survived the build.
        run: |
          set -euo pipefail
          bad=$(grep -rhoE 'href="/(concepts|guides|reference|providers|self-hosting|enterprise)/' site/docs 2>/dev/null | sort -u || true)
          if [ -n "$bad" ]; then
            echo "the built documentation links outside the site, which 404s for a reader:"
            echo "$bad"
            exit 1
          fi
          echo "no documentation link escapes the /docs base"

      - name: The control plane this site is about to call actually serves it
        # THE FAILURE. Somebody filled in the careers form on antifailure.dev
        # and was told "Could not reach the server". The form was correct, the
        # route was correct, and this is what production answered:
        #
        #   POST https://app.antifailure.dev/v1/applications  ->  404
        #   POST https://app.antifailure.dev/v1/leads         ->  400
        #
        # The site publishes on every merge to main; the control plane only
        # moves when a `v*` tag is promoted. The careers page went live the
        # instant its pull request merged, in front of an API twenty two commits
        # behind it that had never heard of the route it posts to.
        #
        # The step below on the machine-readable surfaces already wrote this
        # split down and decided it was tolerable, "because the paths are
        # additive and a caller reading an operation that is not there yet gets
        # a 404". That is right about openapi.json, which somebody READS. It is
        # wrong about this site, which is a CALLER, and for a caller a 404 is a
        # form that does not work.
        #
        # It runs HERE rather than in ci.yml because the question is not what
        # main declares. It is what the origin this build is about to point
        # browsers at will answer them, and that can change between the merge
        # and the publish without a commit. It fails closed: an origin that
        # cannot be reached, that answers 5xx, or whose reply did not come from
        # the control plane at all is reported as undetermined and fails, never
        # as a pass it did not earn.
        #
        # -allow-write-probes sends the one probe the inventory declares as
        # writing something: GET /auth/github creates one oauth_states row,
        # exactly as a person who clicks "Continue with GitHub" and closes the
        # tab does. There is no request that proves that route is present
        # without it, so it is declared and paid for rather than skipped.
        #
        # WHAT THAT ROW ACTUALLY COSTS, so this flag is not authorised by a
        # sentence nobody re-reads. The row is unusable after ten minutes and
        # it is never DELETED: completeSignIn removes a state on redemption and
        # nothing sweeps the table, so one row per publish accumulates forever.
        # That is a debt with an expiry date, not a free probe. It is not this
        # gate's debt alone, because every abandoned real sign-in leaves the
        # same row, and the retirement is a sweeper for oauth_states of the
        # shape migrations 0016 and 0024 already use for devices and sessions.
        # If that sweeper lands, this comment is the thing to come back and
        # delete. If a cheaper presence probe is ever added to the control
        # plane instead, note that it cannot help on the day it is needed: the
        # gate exists precisely for a DEPLOYED image older than the commit that
        # would have added it.
        if: ${{ env.TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -euo pipefail
          control="${NEXT_PUBLIC_CONTROL_PLANE_URL:-https://app.antifailure.dev}"

          # The origin checked has to be the origin the bundle calls. Nothing
          # here sets NEXT_PUBLIC_CONTROL_PLANE_URL, so the build baked in the
          # default above, and this proves that rather than assuming it. A gate
          # that probed a different origin than the one shipped would be a
          # green tick over the same class of failure.
          if ! grep -rqF "$control" site/_next 2>/dev/null; then
            echo "::error::the built site does not contain $control, so routecheck would probe an origin the bundle does not call."
            exit 1
          fi

          go run ./tools/routecheck -root . -origin "$control" -allow-write-probes

      - name: Publish
        # Skipped, with the job still green, until somebody sets the token.
        # A skipped publish is honest; a failing one teaches people to ignore
        # a red main.
        if: ${{ env.TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          # Relative to the repository root, not to app_location. The runtime
          # to start it on is platform.apiRuntime in the configuration
          # tools/site/assemble.sh writes, which skip_api_build makes required
          # rather than optional.
          api_location: api
          skip_app_build: true
          skip_api_build: true

      - name: The API answers
        # A publish is not a working endpoint, and this is the one part of the
        # site that can be deployed, report success, and still be dead: a
        # static file either exists or 404s, but a function app can be present
        # and refuse every request. That is exactly what happened here for two
        # days, with a green deploy every time.
        #
        # Two requests, and neither one writes anything. GET /api must return
        # the index, which proves the function app started. A path under it
        # that nothing serves must return this app's own 404 body rather than
        # the platform's, which proves the request reached our code: a managed
        # function that is missing entirely produces a 404 too, from the CDN,
        # and the two are indistinguishable from the status line alone.
        if: ${{ env.TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -uo pipefail
          site=https://antifailure.dev

          # The CDN needs a moment to pick up a new function app, and a deploy
          # that is merely slow must not read as a deploy that is broken.
          for attempt in $(seq 1 15); do
            index=$(curl -sS -m 15 -o /tmp/api-index.json -w '%{http_code}' "$site/api" || echo 000)
            [ "$index" = "200" ] && break
            echo "attempt $attempt: GET /api returned $index"
            sleep 10
          done

          if [ "$index" != "200" ]; then
            echo "::error::GET /api returned $index after 15 attempts. The managed function is not answering."
            head -c 500 /tmp/api-index.json || true
            exit 1
          fi

          if ! grep -q 'app.antifailure.dev' /tmp/api-index.json; then
            echo "::error::GET /api answered 200 without naming the product API's origin, so this"
            echo "::error::is not the body api/index/index.js serves."
            head -c 500 /tmp/api-index.json
            exit 1
          fi

          missing=$(curl -sS -m 15 -o /tmp/api-404.json -w '%{http_code}' \
            "$site/api/nothing-serves-this" || echo 000)
          if [ "$missing" != "404" ]; then
            echo "::error::GET /api/nothing-serves-this returned $missing, expected 404."
            head -c 500 /tmp/api-404.json || true
            exit 1
          fi
          # Read the field, do not pattern match the serialization.
          #
          # This was `grep -q '"code":"endpoint_not_found"'` and it could never
          # match, because the function pretty prints and the body carries
          # `"code": "endpoint_not_found"` with a space after the colon. So the
          # step failed on a deploy where the function was answering correctly,
          # and the sentence it printed described a missing function app. An
          # assertion that cannot succeed is indistinguishable from a real
          # failure, and this one turned main red while telling whoever read it
          # to go and look at the wrong thing.
          #
          # `jq -e` still fails on a body that is not JSON, on one with no
          # `code`, and on one whose code is a different value, so nothing is
          # weakened by no longer caring where the whitespace falls. Checked
          # both ways against the live body before this was written: the old
          # pattern matched zero times, and `jq` reported true for the real
          # value and false for a wrong one.
          if ! jq -e '.code == "endpoint_not_found"' /tmp/api-404.json >/dev/null 2>&1; then
            echo "::error::the 404 under /api did not come from this function app. A managed function"
            echo "::error::that is missing altogether also 404s, from the CDN, with an empty body, so"
            echo "::error::the status line alone cannot tell a working app from an absent one."
            head -c 500 /tmp/api-404.json || true
            exit 1
          fi

          echo "GET /api is 200 and names the product API; an unrouted path is this app's own 404"

      - name: Every hostname presents a valid certificate
        # A publish is not a reachable site, and this is the part of the site
        # that can be perfectly deployed and still be unreachable for a reader.
        #
        # antifailure.dev and www.antifailure.dev are two custom domains on this
        # one Static Web App, and Azure provisions and renews a separate managed
        # certificate for each. The apex certificate carries SAN
        # DNS:antifailure.dev alone and the www certificate carries SAN
        # DNS:www.antifailure.dev alone, so they are two independent renewal
        # lifecycles and nothing here noticed if one of them lapsed. Anyone who
        # typed the apex would see a completely healthy site while www failed.
        #
        # It is a hard failure rather than a warning because .dev is an HSTS
        # preloaded top level domain: the rule is compiled into the browser, it
        # applies on a cold profile, and a certificate fault on either name is
        # an ERR_SSL_PROTOCOL_ERROR with no "proceed anyway" to click.
        #
        # The limit of the check, stated because it would otherwise be read as
        # a stronger claim than it is: one handshake from one runner proves one
        # edge node answered one client. It catches a lapsed certificate within
        # a deploy cycle. It cannot see a fault that only some clients hit.
        if: ${{ env.TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: tools/site/check-tls.sh

      - name: The machine-readable surfaces answer, and describe this revision
        # The other half of "a publish is not a working endpoint", for the two
        # documents an agent fetches instead of reading the site.
        #
        # Both are generated at build time and committed, so the question is not
        # whether they are valid, CI already refused the push otherwise. It is
        # whether the CDN is serving THESE bytes rather than the previous
        # revision's, which a 200 alone cannot tell you: a stale document is a
        # perfectly healthy 200 that describes an API this revision does not
        # serve.
        #
        # The drift check afterwards is the honest part of the design decision
        # in web/apps/api/scripts/openapi.ts. The site deploys on every push to
        # main; the production control plane moves on a release promotion. So
        # this document can be ahead of what app.antifailure.dev serves. That is
        # tolerable while the API VERSION agrees, because the paths are additive
        # and a caller reading an operation that is not there yet gets a 404.
        # It stops being tolerable the moment the versions differ, and that is
        # the one case this fails on.
        if: ${{ env.TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -uo pipefail
          site=https://antifailure.dev
          control=https://app.antifailure.dev

          for name in openapi.json errors.v1.json; do
            for attempt in $(seq 1 15); do
              code=$(curl -sS -m 20 -o "/tmp/$name" -w '%{http_code}' "$site/$name" || echo 000)
              [ "$code" = "200" ] && break
              echo "attempt $attempt: GET /$name returned $code"
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "::error::GET $site/$name returned $code after 15 attempts."
              head -c 400 "/tmp/$name" || true
              exit 1
            fi
            # Byte for byte against what this run built. Nothing else proves the
            # CDN moved: the previous revision's document is also valid JSON,
            # also 200, and also parses.
            if ! cmp -s "/tmp/$name" "site/$name"; then
              echo "::error::$site/$name is not the document this revision built."
              echo "  served  $(shasum -a 256 < "/tmp/$name" | cut -c1-16)"
              echo "  built   $(shasum -a 256 < "site/$name" | cut -c1-16)"
              exit 1
            fi
            echo "$site/$name is 200 and matches this revision"
          done

          node -e '
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync("/tmp/openapi.json", "utf8"));
            if (doc.openapi !== "3.1.0") throw new Error(`openapi is ${doc.openapi}`);
            const paths = Object.keys(doc.paths ?? {});
            if (paths.length === 0) throw new Error("the published document has no paths");
            const ids = Object.values(doc.paths).flatMap((item) =>
              Object.values(item).map((op) => op.operationId));
            if (ids.some((id) => !id)) throw new Error("an operation has no operationId");
            console.log(`the published document has ${paths.length} paths and ${ids.length} operation ids`);
          '

          catalog=$(node -e '
            const c = JSON.parse(require("fs").readFileSync("/tmp/errors.v1.json", "utf8"));
            if (c.schemaVersion !== 1) throw new Error(`schemaVersion ${c.schemaVersion}`);
            if (!c.errors.some((e) => e.code === "AF-CP-003"))
              throw new Error("the code the control plane 500 returns is not in the published catalog");
            console.log(c.errors.length);
          ')
          echo "the published error catalog resolves $catalog codes"

          # Drift, fatal only when the two API versions actually disagree.
          #
          # An unreachable control plane is NOT a disagreement, and failing on it
          # would redden a site deploy over somebody else's blip, which is how a
          # check gets ignored. Retried a few times first, then reported and
          # skipped: an unknown is an unknown.
          published=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/openapi.json","utf8")).info.version')
          served=unknown
          for attempt in $(seq 1 5); do
            served=$(curl -sS -m 20 "$control/openapi.json" \
              | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).info.version' 2>/dev/null || echo unknown)
            [ "$served" != "unknown" ] && break
            sleep 5
          done
          if [ "$served" = "unknown" ]; then
            echo "::warning::$control did not serve a readable OpenAPI document, so the API"
            echo "version the apex publishes ($published) could not be compared against it."
          elif [ "$served" != "$published" ]; then
            echo "::error::the apex publishes API version $published and $control serves $served."
            echo "Promote the control plane, or hold this document back. A caller reading one"
            echo "version of the contract and calling the other is the failure this catches."
            exit 1
          else
            echo "apex and control plane agree on API version $published"
          fi

          # Live, not documented. A path in the document that the host does not
          # answer is the drift that actually costs a caller something, and the
          # two unauthenticated ones can be asked directly.
          for route in /health /readyz; do
            code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$control$route" || echo 000)
            case "$code" in
              200|503) echo "$control$route answers $code" ;;
              *) echo "::error::$control$route is published in the document and answered $code"; exit 1 ;;
            esac
          done

      - name: Tell Bing what changed
        # Only after a real publish, because IndexNow is a claim that a URL is
        # live and fetchable. Submitting before the deploy asks a crawler to
        # look at something that is not there yet, which is how a key gets
        # distrusted.
        #
        # This matters beyond Bing's own results: Bing's index is the retrieval
        # layer behind ChatGPT search and Copilot, so a page it has not indexed
        # cannot be cited there regardless of how it ranks on Google.
        #
        # The script exits 0 on a rejected submission. The site is already
        # published at this point and a crawler will find it anyway; failing
        # the deploy over a notification would be the wrong trade.
        if: ${{ env.TOKEN != '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        # --submit, because the script prints and stops without it. A script
        # that POSTs to somebody else's service when run with no arguments is
        # a footgun, and it went off once already.
        run: node scripts/indexnow.mjs --submit
        working-directory: www

      - name: Say so when it was not published
        if: ${{ env.TOKEN == '' }}
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          echo "Built and checked, but NOT published: AZURE_STATIC_WEB_APPS_API_TOKEN is not set."
          echo "The live site is a manual snapshot until it is. To wire it up:"
          echo "  az staticwebapp secrets list -n af-site -g af-web --query properties.apiKey -o tsv \\"
          echo "    | gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN"

  # ---------------------------------------------------------------------------
  # Every hostname the site is served on is one the control plane will answer.
  #
  # A SEPARATE JOB, and the separation is the point. This is the only thing here
  # that needs Azure credentials, and the publishing job above holds a Static Web
  # Apps deployment token and nothing else. Giving that job an Azure federated
  # identity so one step could list custom domains would widen what a compromised
  # site build can reach, for a check that does not need to run inside it.
  #
  # WHAT IT ASKS THAT `just gate` CANNOT. The gate compares two files in this
  # repository. This asks Azure which custom domains are really bound to af-site,
  # and asks the deployed control plane to answer a real CORS preflight from each
  # of them. A hostname somebody binds in the portal never touches this
  # repository, so a check that read only the tree would go green over it forever,
  # which is the same bug wearing a different hat.
  #
  # THE FAILURE. antifailure.dev and www.antifailure.dev are two custom domains on
  # this one Static Web App, both Ready, both serving every page, and neither
  # redirects to the other because a route rule matches on PATH and the
  # configuration schema has no hostname condition. site_origin held one value,
  # the apex, so the control plane refused every call a page on www made: the
  # beacon silently, the enterprise contact form as "Could not reach the server",
  # the careers form on something somebody had just filled in. Found on a phone.
  #
  # IT EXITS 2 RATHER THAN 0 WHEN IT CANNOT TELL. A run that could not reach Azure
  # has not established anything, and reporting that as a pass is how the next
  # hostname becomes invisible. `continue-on-error` is deliberately absent.
  #
  # EXPECT THIS RED ON THE MERGE THAT ADDS IT, AND THAT IS THE CORRECT ANSWER.
  # Merging to main deploys the site and the STAGING control plane. Production
  # moves only when a v* tag is pushed. So on the commit that first configures
  # the second origin, the deployed production plane still refuses www and this
  # job says so by name. It goes green when somebody tags, which is the whole
  # point: the alternative is a green check on a merge that fixed nothing a
  # visitor can see yet.
  # ---------------------------------------------------------------------------
  origins:
    name: origins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: site
    if: ${{ github.repository == 'antifailure/antifailure' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: tools/go.sum

      - name: Azure serves no hostname the control plane refuses
        run: go run ./tools/origincheck all --api https://app.antifailure.dev
