name: Dogfood

# Antifailure checking Antifailure's own pull requests, with Antifailure.
#
# Everything this finds is something a customer would have found first. That is
# the entire argument for the file: the control plane is a web application with
# a Postgres schema, row level security, migrations and an audit chain, which is
# exactly the shape of application this product is sold to check. Running it
# against ourselves is the only test of the product that nobody can grade
# generously.
#
# It is separate from ci.yml on purpose. ci.yml is the gate: it decides whether
# a change may merge, it runs on every push, and it must never be slow or
# flaky. This one needs a container runtime, a database to copy, and twenty
# minutes, and its failures are a report about the product rather than a
# verdict on the diff.
on:
  pull_request:
  schedule:
    # Nightly, after the existing security scan, so two jobs are not competing
    # for the same runners.
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read, and only read, for everything that runs untrusted code. The two jobs
# that need more declare it for themselves and nothing else, which is narrower
# than granting it here and hoping: the comment job takes
# `pull-requests: write`, and the job below takes `id-token: write`, which is
# not a write to this repository at all. It lets the job ask GitHub to sign a
# statement about itself, which is what it trades for a credential good for
# this one commit on the control plane.
permissions:
  contents: read

jobs:
  dogfood:
    # One job, not a matrix. On a pull request the question is whether this
    # change broke the product, and the control plane answers it against the
    # largest real schema we have: nineteen tables, row level security,
    # partitions, an audit chain, and migrations. The examples answer a
    # different question, which is whether the product still works on somebody
    # else's shape, and that answer does not change between two commits an hour
    # apart. They run on the schedule below.
    name: control plane
    runs-on: ubuntu-latest

    # `id-token: write` is the whole reason this check reported nothing for as
    # long as it has existed. Without it the runner sets neither
    # ACTIONS_ID_TOKEN_REQUEST_URL nor _TOKEN, the job cannot prove what it is,
    # and every route to the control plane is closed: the two steps below skip
    # and the engine's own event sink finds no identity to exchange. The job
    # then exits zero having posted a comment, and the App, hearing nothing,
    # says "Nothing was verified" on every pull request this repository has.
    #
    # It is not a write to the repository. GitHub mints a short lived signed
    # statement about this job, and it withholds it from a fork's pull request,
    # which is the fork case working rather than failing.
    permissions:
      contents: read
      id-token: write
    # Larger than the budgets inside it, deliberately. The harness fails a step
    # that runs over its budget and writes a report saying which one and by how
    # much; a runner timeout kills the job and writes nothing, so a budget that
    # cannot fire before the timeout is a budget replaced by a blank. The whole
    # check budgets 40 minutes and the golden refresh 12 before it, so this has
    # to leave room for both to be exceeded and reported rather than cut off.
    timeout-minutes: 75

    # The database the golden is copied from. A real Postgres, because
    # everything under test is what Postgres enforces: row level security, the
    # policies the masking plan has to preserve, the partitions the rules have
    # to follow, and the roles pg_dump does not carry.
    services:
      staging:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: staging
          POSTGRES_DB: antifailure
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The hosted control plane this repository is connected to, and the one
      # whose App posts the `Antifailure` check on every pull request here.
      #
      # A literal rather than `vars.AF_CONTROL_PLANE`, which is what
      # examples/github-workflow.yml tells a customer to set. A customer's
      # address is their own and belongs in a variable; this repository's is
      # this repository's own product at its published address, and a variable
      # that has to be set by hand before the check can work is a variable
      # somebody will not set. It was not set here, which is the second of the
      # two reasons nothing was ever reported.
      AF_CONTROL_PLANE: https://app.antifailure.dev
      # The source the masking rules are written against. Synthesised rather
      # than restored from production: a control plane that copies a real
      # customer's database into a public CI runner would be the single worst
      # thing this repository could do, and the shape is what the rules are
      # about, not the rows.
      AF_STAGING_DATABASE_URL: postgres://postgres:staging@127.0.0.1:5433/antifailure

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # BEFORE THE WORK, NOT AFTER IT, AND THE ORDER IS THE POINT.
      #
      # This tells the control plane which of this repository's workflow runs
      # is the one checking this commit. Until a run says so the control plane
      # is guessing, and it used to guess by binding the first `workflow_run`
      # delivery it saw for the commit, which on this repository is whichever
      # of seventeen workflows GitHub happened to start first. On ada5644 that
      # was `Security`, green in fifty seconds, and its completion ended the
      # generation as "Nothing was verified" while this job was still building
      # its database. That guess is gone from the control plane now, and this
      # step is the half that replaces it.
      #
      # Claiming here rather than beside the report below also means the check
      # reads "Building the environment and running the agents" for the twenty
      # minutes that is true, and that a job which dies at minute ten is a run
      # the control plane can name, cancel, and tear the environment down for.
      #
      # The credential is good for one hour and for this commit alone. It is
      # not a secret in the repository: there is nothing here to steal when the
      # job is not running.
      - name: Tell the control plane this run is the one checking this commit
        id: claim
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # EVERY FAILURE HERE IS SURVIVED, AND THAT IS THE SHAPE OF THIS
          # SCRIPT. The observability of a run is not the run: a control plane
          # that is down, or a repository nobody has connected, must not turn a
          # working check into a red job.
          #
          # `:-` on both runner variables rather than a bare read. Under
          # `set -u` a bare read of an unset one ends the step, and on a pull
          # request from a FORK GitHub sets NEITHER of them. That would make the
          # one case this has to handle gracefully, an outside contributor who
          # can fix nothing, the one case that goes red.
          request_token="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          if [ -z "$request_token" ] || [ -z "$request_url" ]; then
            echo "This job was granted no workflow identity, so it cannot introduce itself."
            echo "On a pull request from a fork GitHub withholds one, which is deliberate."
            exit 0
          fi

          # The audience matters. Without one GitHub mints an identity for the
          # repository owner's URL, which every workflow in the organization
          # can obtain, and a credential any workflow can get is not a
          # credential.
          # `|| true` on the pipeline, because `set -o pipefail` would
          # otherwise end the job on a curl that could not connect.
          identity=$(curl -sS -H "Authorization: Bearer $request_token" \
            "${request_url}&audience=antifailure-control-plane" |
            jq -r '.value // empty' || true)
          if [ -z "$identity" ]; then
            echo "GitHub would not mint a workflow identity for this job."
            exit 0
          fi
          token=$(curl -sS -X POST "${AF_CONTROL_PLANE}/v1/pr/callback-token" \
            -H "Authorization: Bearer ${identity}" \
            -H 'content-type: application/json' \
            -d "{\"head_sha\":\"${HEAD_SHA}\"}" |
            jq -r '.token // empty' || true)
          if [ -z "$token" ]; then
            echo "The control plane issued no callback credential for ${HEAD_SHA}."
            echo "That is not a failure of this run: it reports through the comment below."
            exit 0
          fi
          # Masked so that no later step can print it into a public log, and
          # written to the step output rather than to a file the artifact
          # upload would then publish.
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "The control plane is expecting a report from this run."

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the binary under test
        # The binary from this commit, not a release. The whole point is to
        # find out what this change did to the product.
        run: go build -o bin/af ./engine/cmd/af

      - run: npm ci --no-audit --no-fund
        working-directory: web

      - name: A pg_dump new enough to read that Postgres
        # The service above is a Postgres 17 and the runner ships a 16 client.
        # pg_dump refuses outright to read a server newer than itself, so a
        # golden refresh cannot copy the source at all.
        #
        # This is the same step ci.yml carries in two jobs, for the same
        # reason, and it is here rather than shared because a composite action
        # for six lines is a worse trade than six lines. What made it worth
        # writing down is that the engine already handled this correctly: it
        # detected the mismatch and refused by name, printing the apt command
        # that fixes it. The pipeline still failed, because a good error
        # message is not a working environment, and the run that found it was
        # the first one to get far enough to copy anything.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Proof, not hope: the version that will actually be chosen.
          pg_dump --version
          test -x /usr/lib/postgresql/17/bin/pg_dump

      - name: Install the runner and its browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
        working-directory: runner

      - name: Shape the staging database
        # Migrations and then a deterministic seed, both from one script: the
        # seeder applies the migrations itself, because a seed against a schema
        # it did not create is a seed that fails on the first column somebody
        # added.
        #
        # Deterministic so that a masking plan, a verification scan and an
        # insights report are the same two days running, which is what makes a
        # difference between two runs mean something.
        #
        # Synthetic rather than restored from production. A control plane that
        # copied a real customer's database into a public runner would be the
        # single worst thing this repository could do, and what the masking
        # rules are about is the shape rather than the rows.
        run: npm run seed --workspace @antifailure/db
        working-directory: web
        env:
          AF_MIGRATION_DATABASE_URL: ${{ env.AF_STAGING_DATABASE_URL }}

      - name: The masking plan is readable and every column has an answer
        # WHAT THIS ACTUALLY CHECKS, corrected. It used to say `af mask plan`
        # refuses a column no rule names, and it does not: the command exits 0
        # for an unclassified column of any type. Every refusal keys on
        # Problems, and Runnable() is len(Problems) == 0, so a column with no
        # transform cannot make the plan unrunnable because checkFeasible
        # returns before assigning a Problem when the transform is empty.
        #
        # So this step fails on a plan that cannot be BUILT or cannot be RUN:
        # a rule naming a transform that does not exist, a transform that would
        # break a unique constraint, nullify on a NOT NULL column, or a schema
        # it cannot read. Those are the ones that would leave a table half
        # masked, and catching them here is worth the step.
        #
        # It does NOT fail on a column nobody classified. That column is listed
        # under "Columns no rule covers" in the output above, with what the
        # default did to it, and the output is where somebody has to look.
        # Making the step refuse instead would fail the next migration that
        # adds a text column before anybody has written a rule for it, which is
        # a deliberate product decision nobody has taken.
        run: ./bin/af -C . mask plan

      - name: Refresh the golden, with the attestation required
        # Copy, mask, verify, publish. Verification is not a flag here: an
        # unverified version cannot be branched, so a golden that reaches the
        # next step is a golden whose attestation was signed.
        run: ./bin/af -C . golden refresh

      - name: The whole check, the way a customer runs it
        # tools/dogfood runs `af ci` and nothing else of substance. What it
        # adds is a budget per step, taken from the environment's own event
        # stream, and a JSON record of the run, which is what a ten green
        # streak is a claim about.
        env:
          # What the engine's own event sink reports to, which is a different
          # thing from the report below and needs saying. The report is one
          # verdict about one commit, posted by the step at the end; this is
          # forty event types streamed while the run happens, and the console's
          # run view is built out of them. `attachControlPlane` reads this
          # variable and this variable only, and mints its own credential from
          # the same workflow identity the claim above used. Unset, it does not
          # even try, which is right for a laptop and was wrong here.
          AF_CONTROL_PLANE_URL: ${{ env.AF_CONTROL_PLANE }}
        run: |
          go run ./tools/dogfood \
            -C . \
            --af "$GITHUB_WORKSPACE/bin/af" \
            --mode pr \
            --report "$GITHUB_WORKSPACE/dogfood-report.md" \
            --report-json "$GITHUB_WORKSPACE/dogfood-report.json" \
            --record "$GITHUB_WORKSPACE/dogfood-record.json"

      # The verdict, to the check the App posts on this pull request.
      #
      # `always()`, because the report of a failing run is the one worth
      # reading, and because a run that fails is exactly the run whose check
      # must not stay amber.
      #
      # Skipped without a credential, which is the fork case and the case where
      # the control plane refused the claim, and in both of those the comment
      # below is the whole answer. It is NOT skipped when the report is
      # missing: a run that produced no report still has to say so, because a
      # check that hears nothing is the state this whole change is about.
      - name: Tell the control plane what this commit did
        if: always() && steps.claim.outputs.token != ''
        env:
          TOKEN: ${{ steps.claim.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # jq rather than a hand built string. A report carries quotes,
          # newlines and backslashes, and a body pasted together in the shell
          # is malformed on the first interesting run.
          if [ -f "$GITHUB_WORKSPACE/dogfood-report.json" ]; then
            markdown="$GITHUB_WORKSPACE/dogfood-report.md"
            [ -f "$markdown" ] || printf '' > "$markdown"
            jq -n --arg sha "$HEAD_SHA" \
                  --rawfile markdown "$markdown" \
                  --slurpfile report "$GITHUB_WORKSPACE/dogfood-report.json" \
                  '{head_sha: $sha, markdown: $markdown, report: $report[0]}' > payload.json
          else
            # No report at all. Sent rather than skipped, and sent as a report
            # with no workflows in it, which the control plane reads as
            # unverified because a run that evaluated nothing verified nothing.
            # Saying it here rather than leaving the check to the deadline is
            # the difference between a reader learning this in ten seconds and
            # learning it in forty five minutes.
            jq -n --arg sha "$HEAD_SHA" \
                  --arg url "$RUN_URL" \
                  '{head_sha: $sha,
                    markdown: ("## Dogfood\n\nThis run produced no report, so nothing about the change itself was checked. That is a failure of the pipeline rather than a verdict on the diff.\n\n[What happened](" + $url + ")"),
                    report: {Workflows: [], Invariants: []}}' > payload.json
          fi

          code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "${AF_CONTROL_PLANE}/v1/pr/report" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'content-type: application/json' \
            --data-binary @payload.json)
          cat response.json
          echo
          # A refused report is a red step. The reason this defect lived so
          # long is that every route to the control plane failed quietly, and a
          # publish step that swallows its own answer is that same failure
          # rebuilt one layer up.
          if [ "$code" != "200" ]; then
            echo "::error::the control plane refused this run's report with HTTP $code"
            exit 1
          fi

      # There was a step here called "What the database noticed about this
      # change", running `af insights || true`. It was removed rather than
      # repaired, for two reasons that both had to be true.
      #
      # It could not work. It read the branch after `af ci` had already torn
      # the branch down, so every run of it printed
      # "AF-DB-014 No database branch exists" and exited non zero, and the
      # `|| true` turned that into a green step named after something it had
      # never once examined.
      #
      # And it was not needed. `af ci` runs the same rehearsal and the same
      # insights inside the environment while it is still up, and writes them
      # into the report this job uploads, which is where the last run's
      # migration lint findings and its pg_stat_statements note actually came
      # from.

      - name: Nothing was left behind
        # The claim this product makes about itself. Asserted here as well as
        # inside the tool, because the tool could be the thing that is broken.
        if: always()
        run: |
          left=$(docker ps -aq --filter label=dev.antifailure.managed | wc -l | tr -d ' ')
          nets=$(docker network ls -q --filter label=dev.antifailure.managed | wc -l | tr -d ' ')
          echo "containers: $left, networks: $nets"
          if [ "$left" != "0" ] || [ "$nets" != "0" ]; then
            docker ps -a --filter label=dev.antifailure.managed
            echo "::error::the dogfood run leaked resources"
            exit 1
          fi

      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-report
          path: |
            dogfood-report.md
            dogfood-report.json
            dogfood-record.json
            .antifailure/logs
          retention-days: 30
          # Two reasons the event log was never in this artifact, and fixing
          # either alone would have left it empty. The path said
          # .antifailure/events and the engine writes .antifailure/logs, and
          # the action skips dotted paths unless told otherwise. What made it
          # invisible is if-no-files-found: warn, which is right for the report
          # on a run that died early and is also why "2 files uploaded" against
          # three paths never read as a problem.
          include-hidden-files: true
          if-no-files-found: warn

  comment:
    name: post the comment
    needs: dogfood
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The one write in this file, and the only job that has it. A fork's pull
    # request does not reach here at all: the condition above requires the head
    # to be this repository, because a token that can write a comment is a
    # token that must never be handed to code somebody else pushed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      # Allowed to find nothing. A run that fails before `af ci` writes
      # anything uploads no artifact at all, and this step is a hard error on a
      # missing one, so the job died here and the pull request got silence. The
      # guard for exactly that case was one step below, never reached.
      - id: fetch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: dogfood-report
          path: report

      - name: Post it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Silence is the one answer this must never give. A reviewer who sees
          # no comment cannot tell whether the check passed, failed, or never
          # ran, and the first dogfood run in CI gave exactly that: it fell over
          # on the seeder and said nothing here at all. So a run with no report
          # posts the fact that it has no report.
          if [ ! -f report/dogfood-report.md ]; then
            mkdir -p report
            {
              echo "## Dogfood"
              echo
              echo "This pull request's preview environment did not get far enough to"
              echo "produce a report, so there is nothing here about the change itself."
              echo "That is a failure of the pipeline rather than a verdict on the diff."
              echo
              echo "[What happened]($RUN_URL)"
            } > report/dogfood-report.md
          fi

          # Edited rather than appended. A pull request that is pushed to six
          # times should carry one comment that is current, not six that
          # disagree, and the marker is how the right one is found again.
          marker='<!-- antifailure-dogfood -->'
          { echo "$marker"; cat report/dogfood-report.md; } > body.md

          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq "[.[] | select(.body | startswith(\"$marker\")) | .id] | first // empty")
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@body.md > /dev/null
            echo "updated comment $existing"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -F body=@body.md > /dev/null
            echo "posted a new comment"
          fi

  nightly:
    name: nightly, the whole corpus
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      # Every example in examples/ that carries a manifest, and nothing that
      # does not. The list said examples/orders-api and examples/rails-shop
      # until the first scheduled run: neither directory has ever existed,
      # examples/django-api and examples/next-app were missing, and the one
      # real name here was reachable only because the directory is called
      # go-api while the manifest inside it is named orders-api.
      #
      # '.' is the repository's own manifest and it is FIRST on purpose. Before
      # the matrix was read at all, every leg ran './antifailure.yaml' because
      # the guard and the -C both named the root, so the one thing this job was
      # really covering was the control plane dogfooding itself, three times in
      # parallel under three example names. Reading the matrix correctly and
      # nothing else would have deleted that coverage while turning the job
      # green, which is a worse outcome than the red it replaces. So the root
      # stays, named rather than accidental.
      #
      # Kept honest by TestTheNightlyCorpusIsEveryExample in tools/dogfood,
      # which fails on a name here with no manifest behind it, on an example on
      # disk that this list leaves out, and on the root going missing.
      matrix:
        manifest: ['.', examples/django-api, examples/go-api, examples/next-app]

    # The database the '.' leg copies its golden from.
    #
    # The same service the control plane job above carries, for the same
    # reason and with the same limit on what it may hold. Synthesised rather
    # than restored from production: a control plane that copies a real
    # customer's database into a public CI runner would be the single worst
    # thing this repository could do, and what the masking rules are about is
    # the shape rather than the rows.
    #
    # It is here and not only there because a job level `env:` does not reach
    # another job. The nightly had neither the service nor the variable, so its
    # '.' leg ran the repository's own manifest, which names
    # AF_STAGING_DATABASE_URL as its source, against nothing at all: the golden
    # refresh refused with AF-DB-016 and `af ci` then had no golden to branch,
    # so the one leg that exists to prove this control plane dogfoods itself
    # had never once done it.
    #
    # The three example legs need none of this. Not one of them sets
    # database.source_url_env, so their goldens are built with no source, which
    # the engine does without complaint and reports as "from no production
    # database, so it holds no rows". Giving them a source they never ask for
    # would be cargo cult. Kept honest by
    # TestEveryLegCanReachTheSourceItsManifestNames in tools/dogfood, which
    # reads the manifests rather than this list and so narrows or widens with
    # them.
    services:
      staging:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: staging
          POSTGRES_DB: antifailure
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AF_STAGING_DATABASE_URL: postgres://postgres:staging@127.0.0.1:5433/antifailure

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: go build -o bin/af ./engine/cmd/af

      - name: A pg_dump new enough to read that Postgres
        # The service above is a Postgres 17 and the runner ships a 16 client.
        # pg_dump refuses outright to read a server newer than itself, so a
        # golden refresh cannot copy the source at all.
        #
        # This is the same step ci.yml carries in two jobs, for the same
        # reason, and it is here rather than shared because a composite action
        # for six lines is a worse trade than six lines. What made it worth
        # writing down is that the engine already handled this correctly: it
        # detected the mismatch and refused by name, printing the apt command
        # that fixes it. The pipeline still failed, because a good error
        # message is not a working environment, and the run that found it was
        # the first one to get far enough to copy anything.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Proof, not hope: the version that will actually be chosen.
          pg_dump --version
          test -x /usr/lib/postgresql/17/bin/pg_dump

      - name: Install the runner and its browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
        working-directory: runner

      - name: The manifest this leg is named after is there
        # A hard failure, not a skip. The skip this replaces read the repository
        # root instead of the matrix value, so every leg checked the same file,
        # found the control plane's own manifest, and ran the control plane
        # three times under three example names. Had it read the matrix value it
        # would have been worse: two of the three names were directories that do
        # not exist, so two legs would have skipped and gone green having run
        # nothing, under a job title claiming they had run an example.
        #
        # A name in the corpus with no manifest behind it is a defect in the
        # corpus. Saying so out loud is the only version of this step that
        # cannot report success over a subject it never looked at.
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          if [ ! -f "$MANIFEST/antifailure.yaml" ]; then
            echo "::error::$MANIFEST/antifailure.yaml does not exist, so this leg has nothing to run"
            exit 1
          fi

      - name: Does this leg copy a source database
        # Asked of the manifest rather than of the matrix, so that the two
        # steps below narrow and widen with the corpus instead of with a name
        # somebody remembered to update. Today exactly one leg answers yes.
        #
        # A leg that names a source and never seeds it is the quiet version of
        # the failure this whole change is about: the refresh would find the
        # service, copy an empty schema, publish a golden with nothing in it
        # and exit 0, and the workflows that read the golden would fail with no
        # sign of why. So the answer here decides both the install and the
        # seed, and neither is keyed on a manifest path.
        id: source
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          set -euo pipefail
          if grep -qE '^[[:space:]]*source_url_env:' "$MANIFEST/antifailure.yaml"; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            echo "$MANIFEST names a source database, so it gets one"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo "$MANIFEST names no source, so its golden is built from nothing and holds no rows"
          fi

      - name: Install what shapes the staging database
        if: steps.source.outputs.needed == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Shape the staging database
        # The same script the control plane job runs, for the same reason:
        # migrations and then a deterministic seed, both from one script,
        # because a seed against a schema it did not create fails on the first
        # column somebody added.
        #
        # Without it the service is an empty Postgres and the golden copied
        # from it is an empty golden, which is worse than the AF-DB-016 this
        # replaces: that one at least said so.
        if: steps.source.outputs.needed == 'true'
        run: npm run seed --workspace @antifailure/db
        working-directory: web
        env:
          AF_MIGRATION_DATABASE_URL: ${{ env.AF_STAGING_DATABASE_URL }}

      - name: The pipeline, with load
        # --refresh-golden, because there is no golden here to find otherwise.
        # The control plane job above refreshes one in its own step and this
        # one never did, so the first scheduled run reached `af ci` and got
        # AF-DB-012, correctly. The flag has existed since the harness was
        # written, described as "as the nightly does", with no caller anywhere.
        #
        # It goes through the harness rather than a separate `af golden
        # refresh` step so the refresh is timed against its budget and lands in
        # the run record with everything else.
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          go run ./tools/dogfood \
            -C "$MANIFEST" \
            --af "$GITHUB_WORKSPACE/bin/af" \
            --mode nightly \
            --refresh-golden \
            --record "$GITHUB_WORKSPACE/dogfood-record.json"

      - name: Nothing was left behind
        if: always()
        run: |
          left=$(docker ps -aq --filter label=dev.antifailure.managed | wc -l | tr -d ' ')
          if [ "$left" != "0" ]; then
            docker ps -a --filter label=dev.antifailure.managed
            echo "::error::the nightly run leaked resources"
            exit 1
          fi

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # By index rather than by manifest: an artifact name cannot hold a
          # slash, and every entry in the matrix but the root has one. The
          # index is the matrix order, so leg 0 is the repository itself and
          # the rest follow the list above.
          name: nightly-${{ strategy.job-index }}
          path: |
            dogfood-record.json
            ${{ matrix.manifest }}/.antifailure/logs
          retention-days: 30
          # Same reason as the control plane job above: without this the log is
          # a dotted path and the action skips it silently.
          include-hidden-files: true
          if-no-files-found: warn
