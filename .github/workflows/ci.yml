name: CI

# Every push and every pull request. A check that only runs on main is a check
# that tells you after the fact.
on:
  push:
    branches: [main]
  pull_request:

# A second push cancels the first run on the same branch, because the answer
# about the older commit stopped mattering the moment the newer one arrived.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read, and only read. No job in this workflow writes anything back, and a
# token that could is a token an action pulled from the internet could use.
# Every action below is pinned to a commit rather than a tag for the same
# reason: a tag is mutable, so `@v4` is a promise the publisher can change
# after review, and pinning is what makes the reviewed thing the run thing.
permissions:
  contents: read

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Generated files are current
        # The error catalog and the sidecar's packaged source are generated and
        # checked in. A drift between the generator and what is committed is
        # invisible until somebody wonders why their change did nothing.
        #
        # The policy vectors belong here for the same reason. The control plane
        # reimplements the egress decision in TypeScript and proves it matches
        # this engine against that corpus, so a stale corpus means the two have
        # quietly stopped being compared.
        #
        # The schema reference pages and the event envelope belong here too.
        # Both are rendered from the schemas, and a page that has drifted from
        # the contract it documents is worse than no page: it is a wrong answer
        # that looks authoritative.
        run: |
          go run ./tools/errgen
          go run ./tools/proxysrc
          go run ./tools/schemadoc .
          (cd engine && go test ./internal/policy -update-vectors)
          (cd engine && go test ./internal/cli -update-reference)
          (cd engine && go test ./internal/events -update-schema)
          (cd engine && go test ./internal/masking -update-transforms)
          (cd engine && go test ./internal/hud -update-frames)
          git diff --exit-code

      - name: The engine's parsers survive arbitrary input
        # The manifest is a file from the repository under test, and the
        # detection engine reads that repository's contents, so both parse
        # bytes somebody else wrote. C.7 says the customer's repository is data
        # and never code, and a parser that panics on a crafted file is the
        # cheapest way to break that promise.
        #
        # Both targets existed before this step and neither was ever fuzzed.
        # `go test ./...` runs a fuzz target against its committed seed corpus
        # and nothing else, which passes while exploring no input at all.
        run: |
          cd engine
          go test ./internal/manifest -run FuzzParse -fuzz FuzzParse -fuzztime 60s
          go test ./internal/detect -run FuzzAnalyzers -fuzz FuzzAnalyzers -fuzztime 60s

      - name: The release stamps a version that exists
        # The linker accepts -X for a symbol it cannot find and says nothing.
        # v0.1.0 shipped with every version flag pointing at main, where the
        # variables are not, so four platforms built green and every one of
        # them reported itself as "dev". No stage of the pipeline could have
        # caught it: each did exactly what it was asked.
        run: go run ./tools/ldcheck .

      - name: The one command runs what this workflow runs
        # CONTRIBUTING.md promises that a green `just gate` means a green CI.
        # Nothing watched that, so a job added here would quietly stop being
        # covered locally and nobody would find out until a pull request that
        # passed locally failed here, which is the moment the promise was
        # supposed to prevent.
        run: go run ./tools/gatecheck .

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        # For the examples that are not Go. Pinned to the same major the
        # runtime images use, so the version that builds an example here is the
        # version that builds it in the Dockerfile a user copies.
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/*/package-lock.json

      - name: The examples still compile and their manifests are valid
        # An example that does not compile is worse than no example: it is the
        # first thing a user copies. They are separate modules, outside the
        # workspace so their dependencies never enter the engine's module
        # graph, which means nothing else in this job would build them.
        #
        # All three languages, because checking only the compiled ones would
        # leave the other two examples unchecked by the gate whose whole point
        # is this sentence. Go builds, JavaScript builds, and Python runs the
        # framework's own check, which loads the settings, the URL conf and
        # every model.
        run: |
          set -euo pipefail
          for dir in examples/*/; do
            [ -f "$dir/go.mod" ] || continue
            (cd "$dir" && GOWORK=off go build -o /dev/null ./... && GOWORK=off go vet ./...)
          done
          for dir in examples/*/; do
            [ -f "$dir/package.json" ] || continue
            (cd "$dir" && npm ci --no-audit --no-fund --silent && npm run build)
          done
          for dir in examples/*/; do
            [ -f "$dir/requirements.txt" ] || continue
            (
              cd "$dir"
              python3 -m venv .venv-gate
              ./.venv-gate/bin/pip install -q --disable-pip-version-check -r requirements.txt
              ./.venv-gate/bin/python -m compileall -q . -x '\.venv-gate'
              if [ -f manage.py ]; then
                DATABASE_URL="postgres://gate:gate@127.0.0.1:5432/gate" \
                  ./.venv-gate/bin/python manage.py check
              fi
              rm -rf .venv-gate
            )
          done
          go build -o /tmp/af-examples ./engine/cmd/af
          for dir in examples/*/; do
            [ -f "$dir/antifailure.yaml" ] || continue
            (cd "$dir" && /tmp/af-examples explain > /dev/null)
          done
          echo "every example builds and every manifest is valid"

      - name: The prose stays readable
        # A regression guard rather than a style rule. The hardest page today
        # averages 23 words a sentence and the limit is 28, so this fires on a
        # page that drifted rather than on a page whose subject needs long
        # sentences.
        run: go run ./tools/readability . --max 28

      - name: No forbidden tokens in the documentation
        # The G8 scan. Documentation is a product surface, and these are the
        # tokens that say a page was never finished: a note to the author, a
        # slot nobody filled, a name belonging to a person or a customer, an
        # address that resolves only inside somebody's network, or an
        # identifier that names a real cloud tenant.
        run: ./tools/docs/forbidden.sh

      - name: The error catalog and the code agree
        # The reference page promises that a code with no entry fails the build
        # and an entry nothing returns fails it too. It promised that for a
        # while before anything enforced it, which is how a claim in
        # documentation quietly stops being true.
        run: go run ./tools/errcheck .

      - name: Vet
        run: cd engine && go vet ./...

      - name: Lint
        # The linter set CONTRIBUTING describes, and it is a gate rather than
        # advice: the engine is at zero findings, and the way it stays there is
        # a check that refuses the first one. Getting there meant migrating off
        # four deprecated Docker SDK calls, wiring up five symbols that were
        # defined and never used, and fixing three places where an error was
        # formatted instead of wrapped.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          working-directory: engine
          args: --timeout 15m

      - name: The gates themselves
        # errcheck, ldcheck and the generators decide whether a build is
        # allowed to ship, and their own tests were never run here. A gate
        # nobody tests is a gate that passes everything the day it breaks.
        run: cd tools && go test ./... -timeout 5m

      - name: Format
        # gofmt rather than a linter with opinions. The point is that nobody
        # argues about it in review.
        run: |
          unformatted=$(gofmt -l engine tools)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted:"; echo "$unformatted"; exit 1
          fi

      - name: A pg_dump new enough to read that Postgres
        # The step below starts a Postgres 17, matching `just db` so local and
        # CI agree. The runner ships a 16 client, and pg_dump refuses outright
        # to read a server newer than itself. pgcopy detects that and refuses
        # by name rather than failing obscurely, which is why the symptom is a
        # clear message rather than a mystery, but every suite that copies a
        # database still fails.
        #
        # Installing the matching client is exactly what that message tells a
        # person to do, and STATUS.md records the same thing: a golden refresh
        # from a Postgres 17 source needs a 17 client, and the runners ship 16.
        # toolFor already looks in /usr/lib/postgresql/*/bin, which is where
        # this puts it.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          # Proof, not hope: the version that will actually be chosen.
          pg_dump --version
          test -x /usr/lib/postgresql/17/bin/pg_dump

      - name: A Postgres the database suites can use
        # This job had none, and the failure that produced is the one this
        # repository keeps finding: every test in engine/internal/insights that
        # needs a real server called t.Skipf, `go test` printed nothing for a
        # skip, and the job went green having examined almost nothing. A green
        # that examined nothing is worse than a red.
        #
        # Started as a step rather than a `services:` block because the two
        # -c flags matter and a service cannot override the image's command.
        # pg_stat_statements has to be preloaded at start: without it the
        # extension can be created and records nothing, so the query
        # regression checks read a permanently empty table. It is the same
        # container `just db` starts, deliberately, so local and CI agree.
        run: |
          set -euo pipefail
          docker run -d --name af-cp-test -p 55432:5432 \
            -e POSTGRES_PASSWORD=test -e POSTGRES_DB=antifailure postgres:17-alpine \
            -c shared_preload_libraries=pg_stat_statements \
            -c pg_stat_statements.track=all
          # A real query against the target database, not pg_isready. During
          # its first start the image runs a temporary server to initialise
          # the data directory, and pg_isready answers on that one before
          # POSTGRES_DB exists: the wait returns and the next command fails
          # with `database "antifailure" does not exist`. Verified by running
          # this block, not by reading it.
          ready=0
          for _ in $(seq 1 90); do
            if docker exec af-cp-test psql -U postgres -d antifailure -tAc 'select 1' \
                 > /dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs af-cp-test; echo "postgres never came up"; exit 1
          fi
          # The preload is the half that is easy to lose: without it the
          # extension can be created and records nothing, which reads as an
          # application that ran no queries.
          docker exec af-cp-test psql -U postgres -d antifailure -tAc \
            "SHOW shared_preload_libraries" | grep -q pg_stat_statements

      - name: Test
        # The race detector always. A data race that only shows up under load
        # is the kind of bug this product exists to find, and shipping one
        # would be embarrassing.
        run: cd engine && go test ./... -race -timeout 30m
        env:
          # Docker is available on this runner, so the provider and runtime
          # suites run for real rather than skipping.
          GOTOOLCHAIN: local
          AF_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:55432/antifailure
          # And if that Postgres is not there, say so loudly rather than
          # skipping every test that needed it.
          AF_REQUIRE_DATABASE: '1'
          # The comment above says the provider and runtime suites run for
          # real on this runner. This is what makes that a gate rather than a
          # claim: a suite that cannot reach the daemon now fails instead of
          # reporting ok having skipped itself.
          AF_REQUIRE_DOCKER: '1'

      - name: Nothing was left behind
        # The suites assert this themselves, and this catches the case where a
        # suite crashed before its own assertion ran.
        run: |
          left=$(docker ps -aq --filter label=dev.antifailure.managed | wc -l | tr -d ' ')
          nets=$(docker network ls -q --filter label=dev.antifailure.managed | wc -l | tr -d ' ')
          echo "containers: $left, networks: $nets"
          if [ "$left" != "0" ] || [ "$nets" != "0" ]; then
            docker ps -a --filter label=dev.antifailure.managed
            echo "the test run leaked resources"; exit 1
          fi

  runner:
    name: runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          # The lockfile, not the manifest. Keyed on package.json the cache key
          # was a file full of ranges, so two runs of the same commit could
          # resolve different trees and the cache made that quieter rather than
          # louder. That is the failure a lockfile exists to prevent.
          cache-dependency-path: runner/package-lock.json

      # ci rather than install, now that there is a lockfile to obey. It also
      # fails when the lockfile has drifted from package.json, which is the
      # only thing checking that they agree.
      - run: npm ci --no-audit --no-fund
        working-directory: runner

      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: runner

      - name: Typecheck
        # Strict, with exactOptionalPropertyTypes. There is no build step, so
        # this is the only thing standing between a type error and a run.
        run: npx tsc --noEmit
        working-directory: runner

      - name: Test
        run: node --experimental-strip-types --test test/*.test.ts
        working-directory: runner

  www:
    name: www
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            www/package-lock.json
            console/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: www

      - name: Build the marketing site
        # The site is the thing we ship to antifailure.dev. A type error or a
        # broken import is a blank page rather than a failed unit test, so the
        # proof is the production export itself.
        run: npm run build
        working-directory: www

      - run: npm ci --no-audit --no-fund
        working-directory: docs

      - name: Build the documentation site
        run: npm run build
        working-directory: docs

      - run: npm ci --no-audit --no-fund
        working-directory: console

      - name: Build the console
        # The control plane serves this build from its own origin, and the
        # image asserts the directory is not empty. Building it here means a
        # type error in the console fails the pull request rather than the
        # image build twenty minutes later.
        run: npm run build
        working-directory: console
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: The console exported the routes the control plane routes to
        # A static export writes one file per route. If a page stops exporting
        # -- which is what a stray server-only import does -- the route it
        # backs starts answering with the 404 page and nothing else notices.
        run: |
          missing=0
          for route in index environments runs masking network audit members keys device 404; do
            if [ ! -f "console/out/$route.html" ]; then
              echo "::error::console/out/$route.html was not exported"
              missing=1
            fi
          done
          exit $missing

      - name: Every documented error path has a page at the URL the engine prints
        # errors.go builds "https://antifailure.dev/docs/" + the catalog's docs
        # field. errcheck proves the source file exists; this proves the built
        # site actually serves it at that path, which is a different claim and
        # the one users experience. A rename that keeps the file but moves the
        # route would pass errcheck and 404 in production.
        run: |
          missing=0
          for path in $(grep -oE '^[[:space:]]*docs:[[:space:]]*[a-z0-9/_-]+' \
              engine/internal/errors/catalog.yaml | awk '{print $2}' | sort -u); do
            if [ ! -f "docs/dist/$path/index.html" ]; then
              echo "::error::no page built for https://antifailure.dev/docs/$path"
              missing=1
            fi
          done
          exit $missing

      - name: Spelling
        # cspell owns spelling, with the project dictionary in
        # tools/docs/dictionary.txt. Adding a word is a one line diff a
        # reviewer can read.
        run: npx --yes cspell --no-progress "docs/src/content/docs/**/*.md" "examples/**/*.md" README.md CONTRIBUTING.md SECURITY.md

      - name: Prose style
        # The Google developer documentation style at error level, plus the
        # rule about em dashes. Warnings are not enforced: three quarters of
        # them are contractions and passive voice, and this documentation's
        # voice declines both on purpose.
        #
        # The binary rather than the official action, because the action's
        # files input takes one folder and this checks five paths, and because
        # running the same command `just vale` runs is what keeps the two
        # honest. Pinned by version and checksum.
        run: |
          set -euo pipefail
          version=3.19.0
          sha=c8f9d6c8055442bc7e9c121b2498e6f0e3fb670f4665e6ee577f1897f7665cf6
          curl -sfLo vale.tar.gz \
            "https://github.com/errata-ai/vale/releases/download/v${version}/vale_${version}_Linux_64-bit.tar.gz"
          echo "${sha}  vale.tar.gz" | sha256sum -c -
          sudo tar -xzf vale.tar.gz -C /usr/local/bin vale
          rm vale.tar.gz
          vale sync
          vale docs/src/content/docs examples README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md

      - name: Assemble the site
        # Exactly what deploy.yml publishes, because it is now the same script
        # rather than a second copy that claimed to be. The link check and the
        # preview both need the real layout, because /docs/reference/cli/#af-init
        # is only a real address once both halves are in the same tree.
        run: tools/site/assemble.sh

      - name: Every link on the assembled site resolves
        # Offline: internal links and fragments only. A fragment is the case
        # worth having, because a renamed heading leaves a link that still
        # loads a page and silently lands at the top of it. The external
        # addresses are checked on the daily schedule, where a slow upstream
        # cannot block a pull request.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --offline --root-dir site 'site/**/*.html'
          fail: true

      - name: Upload the preview
        # The pull request preview. An artifact rather than a deployment,
        # because a pull request from a fork must not be able to publish to the
        # address people trust.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-preview
          path: site
          retention-days: 14

  control-plane:
    name: control plane
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # A real Postgres, because the thing under test is what Postgres enforces.
    # Row-level security cannot be tested against a fake: the whole property is
    # that the database refuses what the application asks for, and a fake would
    # only prove the application asks nicely.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: antifailure
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AF_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/antifailure

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Typecheck
        # There is no build step, so this is the only thing between a type
        # error and a running server.
        run: |
          for p in packages/db packages/policy apps/api; do
            npx tsc --noEmit -p "$p/tsconfig.json"
          done
        working-directory: web

      - name: The suites did not skip
        # Every suite here skips itself when there is no database, which is
        # right locally and wrong in CI: a green run that proved nothing is
        # worse than a red one. This fails if the database is not reachable,
        # before any test gets the chance to quietly skip.
        run: |
          node -e "
            const c = require('net').connect(5432, '127.0.0.1');
            c.on('connect', () => { console.log('postgres is up'); process.exit(0) });
            c.on('error', (e) => { console.error('no postgres:', e.message); process.exit(1) });
          "

      - name: Test
        run: npm test --workspaces --if-present
        working-directory: web

  edition-boundary:
    name: edition boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: A pg_dump new enough for the servers those suites build
        # The same step the engine job carries, and for the same reason. This
        # job runs the engine's own suites too, and several of them build a
        # Postgres 17 and copy a schema out of it. The runner ships a 16
        # client, pg_dump refuses to read a server newer than itself, and the
        # failure lands in this job rather than in the one people expect.
        #
        # Two jobs repeating it is the honest cost of not having a composite
        # action here. If you change one, change the other.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          test -x /usr/lib/postgresql/17/bin/pg_dump

      - name: The community build does not need ee
        # The proof rather than the assertion. ee is deleted and everything
        # still builds and passes, which is what the community binary is built
        # from. A comment saying the boundary holds is not evidence.
        run: |
          rm -rf ee
          cd engine
          go build ./...
          go test ./internal/... -short -timeout 15m

      - name: No engine package imports ee
        run: |
          if grep -rn --include='*.go' 'antifailure/antifailure/ee' engine tools; then
            echo "an engine package imports ee, which the community build does not have"
            exit 1
          fi

      - name: The community binary carries no enterprise symbols
        # The proof that ships, rather than the proof that compiles. The
        # boundary being a separate Go module already makes a stray import a
        # compile error, and this checks the artifact anyway, because the thing
        # a customer runs is the binary and not the source tree.
        run: |
          git checkout -- . 2>/dev/null || true
          cd engine
          CGO_ENABLED=0 go build -o /tmp/af-community ./cmd/af
          if strings /tmp/af-community | grep -E 'antifailure/(antifailure/)?ee/'; then
            echo "the community binary contains enterprise package paths"
            exit 1
          fi
          echo "no enterprise symbols in the community binary"

  enterprise:
    name: enterprise
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # A real Postgres, for the same reason the control plane job has one. The
    # enterprise web packages carry integration suites that drive single sign-on
    # and provisioning through the real server against the real row-level
    # security policies, and there is no version of that against a fake: the
    # property under test is what Postgres refuses.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: antifailure
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AF_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/antifailure
      # Every one of these suites skips itself when there is no database, which
      # is right on a laptop and wrong here. Without this the job can go green
      # having run none of them.
      AF_REQUIRE_DATABASE: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: engine/go.mod

      - name: Build and test the enterprise module
        # Its own module, deliberately outside the workspace, so GOWORK is off.
        # The community build cannot resolve these import paths at all, which is
        # a stronger boundary than a lint rule: a mistaken import fails to
        # compile on the machine that wrote it.
        run: |
          cd ee/engine
          GOWORK=off go build ./...
          GOWORK=off go vet ./...
          GOWORK=off go test ./... -race -timeout 15m

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Build and test the enterprise web packages
        # Its own npm workspace, outside the community one, so a community
        # install cannot pull enterprise code in by accident. It depends on the
        # community API for the permission catalog and the community API
        # depends on nothing here, which the boundary check below asserts.
        #
        # Fanned out over the workspaces list rather than naming each package.
        # The previous version named rbac and audit by hand, so a package added
        # later was neither typechecked nor tested and this job went green
        # having not run it. That is the silent gap this repository keeps
        # finding, in the gate meant to catch it.
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix ee/web install --no-audit --no-fund
          npm --prefix ee/web run typecheck
          npm --prefix ee/web test

      - name: Nothing in the community web depends on the enterprise one
        run: |
          if grep -rn --include='*.ts' --include='*.json' \
              -e 'antifailure-ee' -e 'ee/web' web/apps web/packages; then
            echo "the community web references enterprise code"
            exit 1
          fi

      - name: The license parser survives arbitrary input
        # It reads a value a customer pastes in, so the only property that
        # matters is that no input makes it panic or accept something unsigned.
        run: |
          cd ee/engine
          GOWORK=off go test ./license -run FuzzParse -fuzz FuzzParse -fuzztime 60s

  secrets:
    name: no credentials in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Every path the documents point at exists
        # README, CONTRIBUTING and SECURITY between them told readers about an
        # adversarial test suite, a provider authoring page, a changelog
        # directory and a linter config, none of which existed. Each one is a
        # dead end somebody finds only after following our instructions, and
        # the security one was a promise to researchers.
        run: go run ./tools/claimcheck .

      - name: The manifests in the documentation are ones the engine accepts
        # The gates above read style, spelling, links and repository paths. None
        # of them knows what a manifest is, and a getting started page shipped
        # telling readers to set control_plane.url. The engine refuses that with
        # AF-MAN-002, "Unknown key", because the schema closes itself so that a
        # typo cannot silently change an environment. The page was live on the
        # site and every documentation gate was green.
        run: go run ./tools/manifestcheck .

      - name: The prose reads like a person wrote it
        # The build plan asks for vale with "a custom rule that flags em dashes
        # and double hyphens in prose". This is that rule. Em dashes are the
        # most visible tell of text nobody wrote: they are what a machine
        # reaches for when it cannot decide whether a clause is a parenthesis,
        # a colon or a full stop. Code is exempt, because `--flag` is how an
        # option is spelled.
        run: go run ./tools/prosecheck .

      - name: Nothing in the repository looks like a live credential
        # Uses the engine's own detector, so the check and the runtime refusal
        # cannot disagree about what a credential looks like. Its own tests
        # assemble fake keys at runtime for exactly this reason.
        run: cd engine && go run ../tools/scanrepo ..

  authorship:
    name: commits are attributed to their author
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Enough history to see the range this push added, and no more.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }

      - name: No commit is authored by an identity that belongs to somebody else
        # A local git config sent 62 commits to a GitHub account that is not
        # the author's. The config was fixed, and a config is exactly the kind
        # of thing that gets overwritten by the next machine, the next clone,
        # or a tool that helpfully sets one.
        #
        # This blocks the known-wrong address rather than allow-listing the
        # right ones, on purpose. An allow-list would refuse a new contributor
        # for the crime of being new, and would then be widened until it meant
        # nothing. Naming the address that was wrong keeps the check specific
        # and keeps it true.
        #
        # Only the commits this push or pull request added are checked. The
        # history before the fix is left as it is, deliberately: rewriting it
        # would break every existing clone to change an avatar.
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Addresses that reached this repository by mistake. Add to this list
          # rather than removing it: each line is a thing that actually
          # happened.
          wrong='potatogreenbean204@gmail.com'

          if [ -n "${BASE:-}" ]; then
            # On a pull request the checkout is the MERGE commit, so ^1 is the
            # base branch tip and ^2 is this branch, and the commits the pull
            # request ADDS are the ones reachable from ^2 but not from ^1.
            #
            # This used to be "$BASE..HEAD", where BASE is the base sha as it
            # was when the pull request was OPENED. That range grows every time
            # the base branch moves, so it ends up containing commits the pull
            # request did not write. An unsigned commit landed on main and this
            # check then failed on every open pull request whose base predated
            # it, blaming each author for somebody else's commit. The comment
            # above already promised "only the commits this push or pull
            # request added"; this makes that true.
            if git rev-parse -q --verify 'HEAD^2' >/dev/null 2>&1; then
              range="HEAD^1..HEAD^2"
            else
              range="$BASE..HEAD"
            fi
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            # A new branch, or a force push that removed the old tip. Nothing
            # to compare against, so check only the commit at hand rather than
            # the whole history, which is known to contain the old address.
            range="HEAD~0..HEAD"
          fi

          echo "checking $range"
          bad=$(git log --format='%H %an <%ae>' "$range" | grep -F "$wrong" || true)
          if [ -n "$bad" ]; then
            echo "These commits are authored by an address that belongs to a different GitHub account:"
            echo "$bad"
            echo
            echo "Set the right one and amend:"
            echo "  git config user.email 67278851+VirSanghavi@users.noreply.github.com"
            echo "  git commit --amend --reset-author --no-edit"
            exit 1
          fi
          echo "every commit in $range is attributed to its author"

      - name: Every commit carries a Developer Certificate of Origin sign-off
        # CONTRIBUTING.md has always said this is required. Nothing checked,
        # and 65 of the first 80 commits had no trailer, which is how a rule in
        # a document stops being a rule.
        #
        # New commits only, for the same reason as above: the history before
        # this cannot be signed retroactively without rewriting it, and
        # rewriting it would break every existing clone.
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ -n "${BASE:-}" ]; then
            # On a pull request the checkout is the MERGE commit, so ^1 is the
            # base branch tip and ^2 is this branch, and the commits the pull
            # request ADDS are the ones reachable from ^2 but not from ^1.
            #
            # This used to be "$BASE..HEAD", where BASE is the base sha as it
            # was when the pull request was OPENED. That range grows every time
            # the base branch moves, so it ends up containing commits the pull
            # request did not write. An unsigned commit landed on main and this
            # check then failed on every open pull request whose base predated
            # it, blaming each author for somebody else's commit. The comment
            # above already promised "only the commits this push or pull
            # request added"; this makes that true.
            if git rev-parse -q --verify 'HEAD^2' >/dev/null 2>&1; then
              range="HEAD^1..HEAD^2"
            else
              range="$BASE..HEAD"
            fi
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~0..HEAD"
          fi

          missing=0
          for sha in $(git rev-list "$range"); do
            # A merge commit is not a contribution and has nothing to certify.
            if [ "$(git rev-list --no-walk --count --merges "$sha")" = "1" ]; then
              continue
            fi
            if ! git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by: '; then
              echo "no sign-off: $(git log -1 --format='%h %s' "$sha")"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -gt 0 ]; then
            echo
            echo "$missing commits have no Developer Certificate of Origin sign-off."
            echo "Add one with 'git commit -s', or let the repository's hook do it:"
            echo "  git config core.hooksPath .githooks"
            echo
            echo "The DCO text is at https://developercertificate.org. There is no CLA."
            exit 1
          fi
          echo "every commit in $range is signed off"
