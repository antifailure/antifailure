name: Walkthrough

# The getting started path, run in order and timed, on a clean machine.
#
# Every other check here proves a part works. This one proves that the sequence
# a new user is told to type gets them to a running environment, and says how
# long they wait for it. It is the only check that drives `af up` through the
# CLI against a real example rather than through a package's tests.
#
# On a schedule rather than on every push, for the same reason as the external
# link check: it needs a daemon and takes minutes, and a check that costs
# everybody that on every branch is one people learn to skip. A regression here
# is worth finding within a day; it is not worth blocking a documentation typo.

on:
  schedule:
    # 05:00 UTC daily, before the link check, so a broken path is first in the
    # morning's list rather than second.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walkthrough:
    name: the getting started path (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # All three, and none of them cancels the others. They fail for
      # different reasons: go-api is a compiled binary with a mocked egress
      # rule, next-app is a framework with a build step, django-api is a
      # framework whose own migration system owns the schema. A run that
      # stopped at the first failure would hide the others for a day.
      fail-fast: false
      matrix:
        example: [go-api, next-app, django-api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Walk it
        # The budget is generous on purpose. It is there to catch a path that
        # broke into a timeout, not to police a runner having a slow morning.
        run: go run ./tools/walkthrough . --example ${{ matrix.example }} --budget 20m

      - name: Nothing was left behind
        # The walkthrough tears down its own environment. This checks that it
        # did, because a teardown that quietly failed leaves the next run to
        # fail for a reason that has nothing to do with the product.
        if: always()
        run: |
          left=$(docker ps -aq --filter=label=dev.antifailure.managed | wc -l)
          if [ "$left" -ne 0 ]; then
            echo "::error::$left managed containers survived the walkthrough"
            docker ps -a --filter=label=dev.antifailure.managed
            exit 1
          fi
          echo "nothing managed by Antifailure is still on this machine"
