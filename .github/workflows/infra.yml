# Terraform, on every pull request that touches infra/.
#
# The point is that a change which would DESTROY something is visible in review,
# rather than discovered by the person who runs apply. A plan in a comment is
# the cheapest code review a piece of infrastructure ever gets.
#
# THE PLAN JOB HAS THREE MODES AND IT ALWAYS SAYS WHICH ONE IT RAN IN. This
# matters more than it sounds, because two of the three cannot see a destroy,
# and a green check that cannot see the thing it exists to see is worse than no
# check at all:
#
#   no credential      SKIPPED. Nothing was checked, and the job says so.
#   credential, no     PLANNED FROM EMPTY STATE. Real Azure, real provider,
#   state backend      real cost estimate, and it CANNOT REPORT A DESTROY
#                      because from an empty state everything is a create.
#                      The summary says this in the first line.
#   credential and     PLANNED AGAINST REAL STATE. The only mode in which
#   state backend      "0 to destroy" is evidence of anything.
#
# The middle mode exists because the subscription's bonfire-deny-public-data
# policy forces a Terraform state storage account to publicNetworkAccess =
# Disabled, which no hosted runner can reach. See infra/terraform/stacks/tfstate.
name: infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'tools/azguard/**'
      - 'tools/cost/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'tools/azguard/**'
      - 'tools/cost/**'

permissions:
  contents: read

env:
  # Pinned, and verified by checksum below. A toolchain fetched over the network
  # without a checksum is a supply chain hole in the job that guards the
  # infrastructure.
  TERRAFORM_VERSION: 1.13.4
  TERRAFORM_SHA256: 98aa516201e948306698efd9954ab4cc0d1227c2578ba56245898b5f679e590b

jobs:
  # The half that needs no cloud account, and therefore always runs.
  static:
    name: fmt, validate, guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Terraform
        run: |
          set -euo pipefail
          url="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSL -o /tmp/tf.zip "$url"
          echo "${TERRAFORM_SHA256}  /tmp/tf.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin
          terraform version

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: terraform validate
        run: |
          set -euo pipefail
          for dir in infra/terraform/modules/* infra/terraform/stacks/*; do
            [ -d "$dir" ] || continue
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

      # The azguard and cost tests are deliberately NOT run here. ci.yml already
      # runs `cd tools && go test ./...` on every pull request and that covers
      # both. A second, narrower invocation would be a gate with no matching
      # `just gate` recipe, which gatecheck refuses, and it would be right to:
      # the promise is that a green `just gate` means a green CI, and that only
      # holds while the two run the same things.

      # tfsec reads the configuration and needs no credentials, so it runs on
      # every pull request including one from a fork.
      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          working_directory: infra/terraform
          soft_fail: true

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: static
    permissions:
      contents: read
      # For the federated credential. No secret, no password, nothing with a
      # lifetime longer than this job.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Which mode can this run manage?
        id: azure
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TFSTATE_RG: ${{ secrets.AZURE_TFSTATE_RG }}
          TFSTATE_ACCOUNT: ${{ secrets.AZURE_TFSTATE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "remote_state=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Plan skipped::AZURE_CLIENT_ID is not set, so no plan was produced. This job checked nothing; it did not pass."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          # BOTH halves, not either. An account name with no resource group
          # fails inside `terraform init` with a message about the backend
          # rather than about the missing secret, which sends the reader to the
          # wrong file.
          if [ -n "$TFSTATE_RG" ] && [ -n "$TFSTATE_ACCOUNT" ]; then
            echo "remote_state=true" >> "$GITHUB_OUTPUT"
          else
            echo "remote_state=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Planning from empty state::AZURE_TFSTATE_RG and AZURE_TFSTATE_ACCOUNT are not both set, so this plan started from an empty state. Every resource reads as a create and THIS PLAN CANNOT REPORT A DESTROY."
          fi

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        if: steps.azure.outputs.ready == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The third gate, asked BEFORE the plan rather than discovered by an apply.
      #
      # A region can be within quota and permitted by every policy and still
      # refuse the database. eastus on this subscription returns
      # supportedServerVersions: [] with "Provisioning is restricted in this
      # region", and an apply there created twenty six of twenty seven
      # resources before finding out. Neither a plan nor a policy can see this.
      - name: The region can actually run the database
        if: steps.azure.outputs.ready == 'true'
        run: go run ./tools/azguard region centralus

      - name: Install Terraform
        if: steps.azure.outputs.ready == 'true'
        run: |
          set -euo pipefail
          url="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSL -o /tmp/tf.zip "$url"
          echo "${TERRAFORM_SHA256}  /tmp/tf.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin

      - name: terraform plan
        if: steps.azure.outputs.ready == 'true'
        working-directory: infra/terraform/stacks/control-plane
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # Placeholders. A plan does not need the real OAuth application, and
          # putting one in a pull request job would expose it to any fork.
          TF_VAR_github_client_id: plan-only
          TF_VAR_github_client_secret: plan-only
          TF_VAR_github_redirect_uri: https://example.invalid/auth/callback
        run: |
          set -euo pipefail
          if [ "${{ steps.azure.outputs.remote_state }}" = "true" ]; then
            # use_azuread_auth IS NOT OPTIONAL AND ITS ABSENCE DOES NOT LOOK
            # LIKE ITS ABSENCE.
            #
            # Without it the azurerm backend authenticates to the blob service
            # with a STORAGE KEY, so `terraform init` calls listKeys on an
            # account created with shared_access_key_enabled = false and gets:
            #
            #   AuthorizationFailed: ... 'Microsoft.Storage/storageAccounts/listKeys/action'
            #
            # which reads as a missing role. Adding the role would be the wrong
            # fix twice over: it would hand a pull request a credential that
            # bypasses every RBAC assignment on the account, and listKeys would
            # still fail because there are no keys to list.
            #
            # stacks/tfstate emits a `backend_hcl` output containing exactly
            # these settings, precisely so the two cannot disagree. This job
            # cannot read that output, because reading it means running that
            # stack, so it repeats them by hand. THAT REPETITION IS THE BUG
            # THIS COMMENT EXISTS TO STOP RECURRING: if you change the backend
            # in stacks/tfstate/outputs.tf, change it here in the same commit.
            terraform init -input=false \
              -backend-config="resource_group_name=${{ secrets.AZURE_TFSTATE_RG }}" \
              -backend-config="storage_account_name=${{ secrets.AZURE_TFSTATE_ACCOUNT }}" \
              -backend-config="container_name=tfstate" \
              -backend-config="key=control-plane.tfstate" \
              -backend-config="use_azuread_auth=true" \
              -backend-config="use_oidc=true"
          else
            # main.tf declares an empty `backend "azurerm" {}` and Terraform
            # would sit at an interactive prompt for its settings. An override
            # file replaces the block outright, which is the documented way to
            # change a backend without editing the file everybody else reads.
            cat > zz_ci_backend_override.tf <<'OVERRIDE'
            terraform {
              backend "local" {}
            }
          OVERRIDE
            terraform init -input=false
          fi
          # -lock=false ON PURPOSE, AND IT IS HALF OF A SECURITY DECISION.
          #
          # The azurerm backend takes a blob LEASE to lock, and a lease is a
          # write. Letting this job lock would mean granting it Storage Blob
          # Data Contributor on the state account, and a pull request can edit
          # this very file in the same commit that runs it. So the identity
          # holds Storage Blob Data READER (see infra/terraform/stacks/tfstate)
          # and this plan does not lock.
          #
          # What that costs: two plans running at once may read a state that is
          # mid write and produce a wrong plan. It can never produce a wrong
          # STATE, because this job writes nothing. A wrong plan is visible in
          # review; a corrupted state is not.
          #
          # -refresh=false is the other half, and it is also a security
          # decision rather than a speed one. Refreshing an
          # azurerm_key_vault_secret reads the secret's VALUE, so a refreshing
          # plan needs Key Vault Secrets User and would pull the live database
          # URLs into this job on every pull request. The identity is Reader on
          # the resource group and holds no Key Vault data role at all.
          #
          # What that costs: a resource deleted or altered outside Terraform
          # will not show up here. Comparing the configuration against the
          # recorded state is precisely the question this job exists to answer,
          # and drift detection is a different job that has not been built.
          terraform plan -input=false -lock=false -refresh=false -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json
          terraform show -no-color plan.tfplan > plan.txt

      # What this will cost, before it exists. --budget makes it a gate rather
      # than a note: a plan projected above the resource group's budget in
      # ISOLATION.md fails here instead of on an invoice.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.azure.outputs.ready == 'true'
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: cost estimate
        if: steps.azure.outputs.ready == 'true'
        run: |
          GOTOOLCHAIN=local go run ./tools/cost estimate \
            --plan infra/terraform/stacks/control-plane/plan.json \
            --pricing infra/pricing.yaml \
            --budget 300 | tee cost.txt

      # The destroy count, called out on its own. A plan buried in a log is a
      # plan nobody reads; "3 to destroy" in the summary is one somebody asks
      # about.
      - name: Summarise
        if: steps.azure.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cd infra/terraform/stacks/control-plane
          destroys=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' plan.json)
          {
            echo "## Terraform plan"
            echo
            if [ "${{ steps.azure.outputs.remote_state }}" != "true" ]; then
              echo "> **Planned from an EMPTY STATE.** \`AZURE_TFSTATE_RG\` and"
              echo "> \`AZURE_TFSTATE_ACCOUNT\` are not both set, so Terraform has no record"
              echo "> of what already exists and every resource below reads as a create."
              echo "> **A destroy cannot appear in this plan even if the change would cause"
              echo "> one.** The provider, the credential and the cost estimate are real;"
              echo "> the destroy count is not evidence."
              echo
            elif [ "$destroys" -gt 0 ]; then
              echo "**This plan DESTROYS $destroys resource(s).** Read it before approving."
            else
              echo "Nothing is destroyed by this plan."
            fi
            echo
            echo '<details><summary>plan</summary>'
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
            echo
            echo '```'
            cat "$GITHUB_WORKSPACE/cost.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
