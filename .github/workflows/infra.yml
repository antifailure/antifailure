# Terraform, on every pull request that touches infra/.
#
# The point is that a change which would DESTROY something is visible in review,
# rather than discovered by the person who runs apply. A plan in a comment is
# the cheapest code review a piece of infrastructure ever gets.
#
# THE PLAN JOB HAS THREE MODES AND IT ALWAYS SAYS WHICH ONE IT RAN IN. This
# matters more than it sounds, because two of the three cannot see a destroy,
# and a green check that cannot see the thing it exists to see is worse than no
# check at all:
#
#   no credential      SKIPPED. Nothing was checked, and the job says so.
#   credential, no     PLANNED FROM EMPTY STATE. Real Azure, real provider,
#   state backend      real cost estimate, and it CANNOT REPORT A DESTROY
#                      because from an empty state everything is a create.
#                      The summary says this in the first line.
#   credential and     PLANNED AGAINST REAL STATE. The only mode in which
#   state backend      "0 to destroy" is evidence of anything.
#
# The middle mode exists because the subscription's bonfire-deny-public-data
# policy forces a Terraform state storage account to publicNetworkAccess =
# Disabled, which no hosted runner can reach. See infra/terraform/stacks/tfstate.
name: infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'tools/azguard/**'
      - 'tools/cost/**'
      - 'tools/tfsecignores/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'tools/azguard/**'
      - 'tools/cost/**'
      - 'tools/tfsecignores/**'

permissions:
  contents: read

env:
  # Pinned, and verified by checksum below. A toolchain fetched over the network
  # without a checksum is a supply chain hole in the job that guards the
  # infrastructure.
  TERRAFORM_VERSION: 1.13.4
  TERRAFORM_SHA256: 98aa516201e948306698efd9954ab4cc0d1227c2578ba56245898b5f679e590b

jobs:
  # The half that needs no cloud account, and therefore always runs.
  static:
    name: fmt, validate, guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Terraform
        run: |
          set -euo pipefail
          url="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSL -o /tmp/tf.zip "$url"
          echo "${TERRAFORM_SHA256}  /tmp/tf.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin
          terraform version

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: terraform validate
        run: |
          set -euo pipefail
          for dir in infra/terraform/modules/* infra/terraform/stacks/*; do
            [ -d "$dir" ] || continue
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

      # The azguard and cost tests are deliberately NOT run here. ci.yml already
      # runs `cd tools && go test ./...` on every pull request and that covers
      # both. A second, narrower invocation would be a gate with no matching
      # `just gate` recipe, which gatecheck refuses, and it would be right to:
      # the promise is that a green `just gate` means a green CI, and that only
      # holds while the two run the same things.

      # tfsec reads the configuration and needs no credentials, so it runs on
      # every pull request including one from a fork.
      #
      # IT BLOCKS, and it did not until the findings were dealt with. Both
      # halves of that matter. `--soft-fail` was the right setting while the
      # step was broken and it is the reason eight findings sat unseen once it
      # was fixed: a scanner whose output nobody has to act on becomes a scanner
      # nobody reads. Every finding in this tree is now either fixed or carries
      # an inline decision with an expiry, so there is nothing left for a soft
      # failure to be soft about.
      #
      # It is also what makes those expiries mean anything. tfsec stops
      # honouring an ignore on its date and reports the finding again; under
      # `--soft-fail` that produces a green run and tells nobody, so every date
      # in infra/terraform would be decorative. The version pinned above is
      # archived upstream in favour of Trivy, so its ruleset does not move,
      # which removes the usual cost of a blocking scanner: a branch that was
      # green cannot go red because somebody else shipped a new rule.
      #
      # INSTALLED BY HAND RATHER THAN BY THE ACTION, and the reason is the whole
      # of this block. aquasecurity/tfsec-action downloads tfsec by asking the
      # GitHub releases API which version is `latest`, and that request returned
      # HTTP 403 on every pull request touching this directory. The action's own
      # error says "The request to the GitHub API was likely rate-limited. Set a
      # GITHUB_TOKEN to prevent this", so a token was set, and the request still
      # returned 403 with the token being sent. The advice in the message
      # answers a nearby question: it explains one cause of a 403 from that
      # endpoint and not the one we were getting, and following it produced a
      # second red run that looked exactly like the first.
      #
      # `soft_fail` never covered this and could not. It decides what happens
      # when tfsec FINDS something. This was tfsec never running at all, so the
      # step failed before there was anything to soft fail: a red check,
      # unrelated to the diff, green on a rerun. That is the shape that teaches
      # people to rerun a red job without reading it, and it had already cost
      # one lane an hour looking for a Terraform problem that did not exist.
      #
      # So the API is removed from the path. A release asset is served from a
      # CDN and needs no token and no rate limit budget, the version is pinned
      # the way every action here is pinned by SHA, and the checksum is the
      # published one for that release. A mismatch fails the step, because a
      # scanner downloaded over the network with no integrity check is a worse
      # thing to run than no scanner.
      - name: Install tfsec
        env:
          TFSEC_VERSION: v1.28.14
          TFSEC_SHA256: a32d0799bbefababaa4fcd814da9f4d251cd932789590b99d1d5fcb89ace6f68
        run: |
          set -euo pipefail
          url="https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64"
          curl --fail --silent --show-error --location --retry 3 -o /tmp/tfsec "$url"
          echo "${TFSEC_SHA256}  /tmp/tfsec" | sha256sum --check --status || {
            echo "::error title=tfsec checksum::The download did not match the published checksum for ${TFSEC_VERSION}. Refusing to run it."
            exit 1
          }
          chmod +x /tmp/tfsec
          /tmp/tfsec --version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      # THE RULE TFSEC HAS NO VERSION OF, AND IT RUNS BEFORE THE SCAN ON PURPOSE.
      #
      # A finding that cannot be fixed is recorded inline as
      # `#tfsec:ignore:<rule>:exp:<date>` with the reasoning in prose beside it,
      # which is the shape .govulncheck.yaml uses for the Go half. tfsec
      # enforces the date and nothing else: it accepts a directive with no
      # expiry at all, and it says nothing whatever about one that no longer
      # suppresses anything. A suppression left behind after the finding is
      # fixed reads as protection that is not there, and it hides the fact that
      # the real finding moved or changed shape.
      #
      # Before the scan, because the two failures need telling apart. When an
      # ignore lapses, tfsec reports the original finding and gives no hint that
      # a decision expired, which sends the reader looking for a change nobody
      # made. This step says "the decision to accept this expired on such a
      # date" first, and the scan never runs.
      - name: tfsec ignores are still true
        run: GOTOOLCHAIN=local go run ./tools/tfsecignores -tfsec /tmp/tfsec .

      - name: tfsec
        run: /tmp/tfsec infra/terraform

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: static
    permissions:
      contents: read
      # For the federated credential. No secret, no password, nothing with a
      # lifetime longer than this job.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Which mode can this run manage?
        id: azure
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TFSTATE_RG: ${{ secrets.AZURE_TFSTATE_RG }}
          TFSTATE_ACCOUNT: ${{ secrets.AZURE_TFSTATE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "remote_state=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Plan skipped::AZURE_CLIENT_ID is not set, so no plan was produced. This job checked nothing; it did not pass."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          # BOTH halves, not either. An account name with no resource group
          # fails inside `terraform init` with a message about the backend
          # rather than about the missing secret, which sends the reader to the
          # wrong file.
          if [ -n "$TFSTATE_RG" ] && [ -n "$TFSTATE_ACCOUNT" ]; then
            echo "remote_state=true" >> "$GITHUB_OUTPUT"
          else
            echo "remote_state=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Planning from empty state::AZURE_TFSTATE_RG and AZURE_TFSTATE_ACCOUNT are not both set, so this plan started from an empty state. Every resource reads as a create and THIS PLAN CANNOT REPORT A DESTROY."
          fi

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        if: steps.azure.outputs.ready == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The third gate, asked BEFORE the plan rather than discovered by an apply.
      #
      # A region can be within quota and permitted by every policy and still
      # refuse the database. eastus on this subscription returns
      # supportedServerVersions: [] with "Provisioning is restricted in this
      # region", and an apply there created twenty six of twenty seven
      # resources before finding out. Neither a plan nor a policy can see this.
      - name: The region can actually run the database
        if: steps.azure.outputs.ready == 'true'
        run: go run ./tools/azguard region centralus

      - name: Install Terraform
        if: steps.azure.outputs.ready == 'true'
        run: |
          set -euo pipefail
          url="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSL -o /tmp/tf.zip "$url"
          echo "${TERRAFORM_SHA256}  /tmp/tf.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin

      - name: terraform plan
        if: steps.azure.outputs.ready == 'true'
        working-directory: infra/terraform/stacks/control-plane
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # Placeholders. A plan does not need the real OAuth application, and
          # putting one in a pull request job would expose it to any fork.
          TF_VAR_github_client_id: plan-only
          TF_VAR_github_client_secret: plan-only
          TF_VAR_github_redirect_uri: https://example.invalid/auth/callback
          # A VARIABLE RATHER THAN A SECRET, because an object id identifies a
          # principal and unlocks nothing, and because this job's plan must be
          # run with the SAME inputs as the apply it is reviewing.
          #
          # If this is unset the count on the role assignment goes to zero and
          # the plan reports "1 to destroy" on every pull request, forever, for
          # a resource nobody proposed to remove. Every value in this block has
          # that property: a plan run with different inputs is a plan about a
          # different desired state, and its destroy count is noise.
          TF_VAR_ci_principal_id: ${{ vars.AZURE_CI_PRINCIPAL_ID }}
          # budget_contact_emails is deliberately NOT passed. The module
          # notifies by ROLE, so the default of [] is what the apply uses too
          # and the two agree without a secret existing. If you do set addresses
          # for a real apply, you must pass the same ones here or every plan
          # proposes to delete the notification blocks, which reads as a small
          # in-place update and would quietly switch the alerts off.
        run: |
          set -euo pipefail
          if [ "${{ steps.azure.outputs.remote_state }}" = "true" ]; then
            # use_azuread_auth IS NOT OPTIONAL AND ITS ABSENCE DOES NOT LOOK
            # LIKE ITS ABSENCE.
            #
            # Without it the azurerm backend authenticates to the blob service
            # with a STORAGE KEY, so `terraform init` calls listKeys on an
            # account created with shared_access_key_enabled = false and gets:
            #
            #   AuthorizationFailed: ... 'Microsoft.Storage/storageAccounts/listKeys/action'
            #
            # which reads as a missing role. Adding the role would be the wrong
            # fix twice over: it would hand a pull request a credential that
            # bypasses every RBAC assignment on the account, and listKeys would
            # still fail because there are no keys to list.
            #
            # stacks/tfstate emits a `backend_hcl` output containing exactly
            # these settings, precisely so the two cannot disagree. This job
            # cannot read that output, because reading it means running that
            # stack, so it repeats them by hand. THAT REPETITION IS THE BUG
            # THIS COMMENT EXISTS TO STOP RECURRING: if you change the backend
            # in stacks/tfstate/outputs.tf, change it here in the same commit.
            terraform init -input=false \
              -backend-config="resource_group_name=${{ secrets.AZURE_TFSTATE_RG }}" \
              -backend-config="storage_account_name=${{ secrets.AZURE_TFSTATE_ACCOUNT }}" \
              -backend-config="container_name=tfstate" \
              -backend-config="key=control-plane.tfstate" \
              -backend-config="use_azuread_auth=true" \
              -backend-config="use_oidc=true"
          else
            # main.tf declares an empty `backend "azurerm" {}` and Terraform
            # would sit at an interactive prompt for its settings. An override
            # file replaces the block outright, which is the documented way to
            # change a backend without editing the file everybody else reads.
            cat > zz_ci_backend_override.tf <<'OVERRIDE'
            terraform {
              backend "local" {}
            }
          OVERRIDE
            terraform init -input=false
          fi
          # -lock=false ON PURPOSE, AND IT IS HALF OF A SECURITY DECISION.
          #
          # The azurerm backend takes a blob LEASE to lock, and a lease is a
          # write. Letting this job lock would mean granting it Storage Blob
          # Data Contributor on the state account, and a pull request can edit
          # this very file in the same commit that runs it. So the identity
          # holds Storage Blob Data READER (see infra/terraform/stacks/tfstate)
          # and this plan does not lock.
          #
          # What that costs: two plans running at once may read a state that is
          # mid write and produce a wrong plan. It can never produce a wrong
          # STATE, because this job writes nothing. A wrong plan is visible in
          # review; a corrupted state is not.
          #
          # -refresh=false is the other half, and it is also a security
          # decision rather than a speed one. Refreshing an
          # azurerm_key_vault_secret reads the secret's VALUE, so a refreshing
          # plan needs Key Vault Secrets User and would pull the live database
          # URLs into this job on every pull request. The identity is Reader on
          # the resource group and holds no Key Vault data role at all.
          #
          # What that costs: a resource deleted or altered outside Terraform
          # will not show up here. Comparing the configuration against the
          # recorded state is precisely the question this job exists to answer,
          # and drift detection is a different job that has not been built.
          # -var-file is main's and is not optional: signin_allowlist has no
          # default, deliberately, so a plan without it fails on a required
          # variable. The two flags before it are this branch's and are the
          # security decisions explained above. Losing either half breaks a
          # different thing, so both are here.
          terraform plan -input=false -lock=false -refresh=false \
            -var-file=staging.tfvars -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json
          terraform show -no-color plan.tfplan > plan.txt

      # What this will cost, before it exists. --budget makes it a gate rather
      # than a note: a plan projected above the resource group's budget in
      # ISOLATION.md fails here instead of on an invoice.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.azure.outputs.ready == 'true'
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: cost estimate
        if: steps.azure.outputs.ready == 'true'
        run: |
          GOTOOLCHAIN=local go run ./tools/cost estimate \
            --plan infra/terraform/stacks/control-plane/plan.json \
            --pricing infra/pricing.yaml \
            --budget 300 | tee cost.txt

      # The destroy count, called out on its own. A plan buried in a log is a
      # plan nobody reads; "3 to destroy" in the summary is one somebody asks
      # about.
      - name: Summarise
        if: steps.azure.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cd infra/terraform/stacks/control-plane
          destroys=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' plan.json)
          {
            echo "## Terraform plan"
            echo
            if [ "${{ steps.azure.outputs.remote_state }}" != "true" ]; then
              echo "> **Planned from an EMPTY STATE.** \`AZURE_TFSTATE_RG\` and"
              echo "> \`AZURE_TFSTATE_ACCOUNT\` are not both set, so Terraform has no record"
              echo "> of what already exists and every resource below reads as a create."
              echo "> **A destroy cannot appear in this plan even if the change would cause"
              echo "> one.** The provider, the credential and the cost estimate are real;"
              echo "> the destroy count is not evidence."
              echo
            elif [ "$destroys" -gt 0 ]; then
              echo "**This plan DESTROYS $destroys resource(s).** Read it before approving."
            else
              echo "Nothing is destroyed by this plan."
            fi
            echo
            echo '<details><summary>plan</summary>'
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo '</details>'
            echo
            echo '```'
            cat "$GITHUB_WORKSPACE/cost.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # THE FOURTH MODE, AND THE ONE THIS JOB DID NOT HAVE.
      #
      # Every step above plans STAGING. Production is a second var-file against
      # a second state blob and nothing planned it, so the one environment
      # Terraform could not manage was the one nothing checked. That gap is
      # quiet by construction: deploys go out through `az containerapp update`
      # in deploy/cd/deploy.sh rather than through Terraform, so production kept
      # shipping normally for days while its stack could not be planned at all.
      # A stack that cannot be planned is a stack nobody can change, and the
      # settings that were merged and could not be applied were the ones that
      # turn the operator portal on.
      #
      # IT LOOKS AT THE EXIT STATUS AND AT NOTHING ELSE. It does not review the
      # diff and must not be read as reviewing it, because the inputs here are
      # not the inputs an apply would use: alert_emails is a placeholder, so
      # this plan always proposes an in-place change to the action group's
      # receiver that no apply would ever make. A plan run with different inputs
      # is a plan about a different desired state, which is the same reason the
      # staging block pins ci_principal_id. Whether the plan SUCCEEDS is the one
      # thing that does not depend on those inputs, and it is the whole question
      # being asked.
      #
      # WHY IT NEEDS THE REAL STATE, measured rather than assumed. The failure
      # this catches is a provider argument validator refusing a value it can
      # never accept. Terraform SKIPS a validator whose value is unknown, and
      # from an empty state every id in the plan is unknown, so the empty-state
      # mode above plans the identical broken configuration clean and exits
      # zero. Only a plan holding the recorded state has a known value to
      # refuse. That is why this is gated on remote_state and not on a
      # credential alone, and it is why "plan production from empty state too"
      # would have been a check that could not say no.
      #
      # WHAT IT COSTS IN PERMISSION: nothing new. The same federated credential,
      # the same storage account and container, one more blob key. -lock=false
      # because the identity is Storage Blob Data READER and cannot take a
      # lease, exactly as above. -refresh=false, and with that flag the only
      # Azure call this plan makes is azurerm_client_config, which reads the
      # caller's own identity and needs no role at all: every
      # azurerm_key_vault_secret data source in the module is counted to zero
      # under production.tfvars, so no secret is read and no role on
      # af-cp-prod-centralus is required.
      #
      # LAST IN THE JOB ON PURPOSE. It re-initialises the backend against the
      # production state, and every step above reads files the staging plan
      # wrote. Running it earlier would leave those steps describing one
      # environment from a directory pointed at the other, which is the exact
      # confusion infra/ISOLATION.md warns about in this shared stack directory.
      - name: production can still be planned
        if: steps.azure.outputs.ready == 'true' && steps.azure.outputs.remote_state == 'true'
        working-directory: infra/terraform/stacks/control-plane
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_github_client_id: plan-only
          TF_VAR_github_client_secret: plan-only
          TF_VAR_github_redirect_uri: https://example.invalid/auth/callback
          TF_VAR_ci_principal_id: ${{ vars.AZURE_CI_PRINCIPAL_ID }}
          # Production refuses to plan with alerting on and no receiver, which
          # is a deliberate validation and not something to work around: an
          # action group with no receivers creates cleanly, attaches to every
          # rule, reports healthy and tells nobody. A placeholder satisfies it
          # so the check can reach the configuration behind it. Nothing is
          # delivered to this address because nothing is applied from here.
          TF_VAR_alert_emails: '["plan-only@example.invalid"]'
        run: |
          set -euo pipefail
          terraform init -reconfigure -input=false \
            -backend-config="resource_group_name=${{ secrets.AZURE_TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.AZURE_TFSTATE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=control-plane-production.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
          # No -out, and the log goes to the runner's temp directory rather
          # than into the stack. `terraform show -json` on a plan file includes
          # the values of sensitive input variables and this plan has no reader,
          # and a log written beside staging.tfvars is one more untracked file
          # in a directory an operator also works in by hand.
          log="$RUNNER_TEMP/production-plan.txt"
          if terraform plan -input=false -lock=false -refresh=false \
            -var-file=production.tfvars -no-color > "$log" 2>&1; then
            echo "Production planned successfully. The diff above is staging's; this step read only the exit status." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Production cannot be planned::terraform plan against production.tfvars and control-plane-production.tfstate failed. Until it passes, no change to this stack can be applied to production, including changes already merged. The failure is below."
            {
              echo
              echo "### Production cannot be planned"
              echo
              echo 'This is not about the diff. `terraform plan -var-file=production.tfvars`'
              echo 'exited non-zero, so production has no applyable plan at all.'
              echo
              echo '```'
              tail -c 20000 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
