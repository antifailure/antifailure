name: Security

# Vulnerability scanning is on its own workflow, and on a schedule, because the
# thing that changes is not this repository. A commit that was clean yesterday
# is not clean today if an advisory landed overnight against a dependency it
# already had. Tying the scan only to pushes would mean a quiet repository is
# reported as a safe one, which is exactly backwards: the longer nothing is
# pushed, the staler the last answer.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 07:00 UTC daily. The Go vulnerability database publishes on weekdays, so a
    # daily run means at most one working day between an advisory and this
    # repository knowing about it.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run on main is the verdict a tag and a deploy are read against, so it
  # is never cancelled. On a branch the saving is real and nothing depends
  # on the superseded answer, so cancelling stays.
  #
  # Six merges landed inside one run's length on 2026-09-02 and each cancelled
  # the one before it, so main went from 09:07 to past 12:30 with no COMPLETED
  # run at all. Cancelled is not red, but it is not a verdict either, and
  # `release.yml` has no gate of its own, so the only thing standing between
  # an unverified commit and published binaries was somebody holding merges
  # by hand. Tags are excluded for the same reason.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Read, and only read. Same reasoning as CI: nothing here writes back, and every
# action is pinned to a commit because a tag can be moved after it is reviewed.
permissions:
  contents: read

jobs:
  vulnerabilities:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    # Symbol level analysis of the engine walks the whole call graph, including
    # the Docker client, the OpenTelemetry exporters and a pure Go SQLite. It is
    # minutes, not seconds, which is the reason this is not part of `just gate`.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.sum
            tools/go.sum
            ee/engine/go.sum

      - name: Known vulnerabilities
        # govulncheck asks whether a known vulnerability is reachable from our
        # code. tools/vulncheck holds the answer to a policy: anything reachable
        # must be matched by an entry in .govulncheck.yaml that says why it
        # cannot hurt us and when that judgement expires, and an entry that has
        # expired or that no longer matches anything fails too.
        #
        # govulncheck itself is pinned in tools/go.mod as a tool dependency, so
        # the scanner is version controlled like everything else rather than
        # resolved to whatever @latest means on the day.
        run: go run ./tools/vulncheck .

  # The same question for the JavaScript, which nothing was asking.
  #
  # govulncheck reads Go modules and stops there. Every `npm ci` in ci.yml passes
  # --no-audit, so the seven lockfiles here had no advisory check at all, and one
  # of them builds the control plane that holds organizations, policy and
  # billing. This is the half of the repository exposed to the internet and it
  # was the half with no scanner.
  #
  # A separate job rather than a step, because the two need different toolchains
  # and a Go setup failure should not decide whether the npm answer was heard.
  npm:
    name: npm advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: tools/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No `npm ci` anywhere above, deliberately. tools/npmaudit runs npm audit
      # with --package-lock-only, so the lockfile is the thing under review and
      # nothing has to be installed to review it. Installing first would make
      # this job cost seven installs and would let a postinstall script run
      # before the scan that is meant to judge it.
      - name: Known advisories against the lockfiles
        run: go run ./tools/npmaudit .
