# The control plane images, and a Helm chart proved against a real cluster.
#
# docs/self-hosting/control-plane.md tells operators to run
# ghcr.io/antifailure/control-plane:<version>. This is what makes that
# instruction followable.
#
# TWO EDITIONS, AND THE SECOND IS WHY THIS FILE HAS A MATRIX. ee/web/server is
# the enterprise entry point: the process that mounts single sign-on and
# directory provisioning, two of the things this repository sells. It ran, and
# it shipped in nothing. Four finished, tested, licensed packages were mounted
# by a binary that no deployment could pull, which is the same dead, shippable
# gap this repository keeps finding, wearing a container.
#
# The matrix rather than a second job, and that is a decision rather than a
# layout. The enterprise image is the community image plus registrations, and
# that claim only stays true if the two are tagged, labelled, asserted about
# and published by the same lines. A separate job would drift, and the drift
# would appear as a difference between what a paying customer runs and what
# everybody else runs, which is the most expensive place to find one.
#
# On a pull request both images are BUILT and never pushed, and the chart is
# installed on a real kind cluster using the freshly built community image.
# kind is not AKS, which is the point: the chart has to work on any conformant
# cluster.
name: control-plane-image

on:
  pull_request:
    paths:
      - 'web/**'
      - 'ee/web/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/control-plane-image.yml'

  # NO `paths:` FILTER HERE, AND THAT IS THE POINT.
  #
  # GitHub combines `branches`/`tags` with `paths` as an AND, so a `paths:`
  # filter sitting in the same block as `tags: ['v*']` is also applied to the
  # tag push. A release workflow that publishes on a version tag and quietly
  # never runs is the failure this shape produces, and it produces it silently:
  # there is no red check, there is no run at all, and the first symptom is an
  # operator pulling an image that was never built.
  #
  # The cost of dropping the filter is a few wasted minutes when a push to main
  # touches nothing this workflow cares about. That is the cheaper mistake.
  push:
    branches: [main]
    tags: ['v*']

  # Publishing a tag that already exists.
  #
  # v0.1.1 was tagged for the CLI release before this workflow existed, so the
  # tag push that would have built the image happened months of commits ago
  # against a tree with no Dockerfile in it. Re-pointing a released tag to
  # rebuild it would re-run the CLI release and rewrite a published artifact,
  # which is worse than the problem. This input publishes the image under a
  # chosen tag from the current ref instead, and the image's own
  # org.opencontainers.image.revision label records the commit it was really
  # built from, so the two can never quietly disagree.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish, e.g. v0.1.1. Defaults to main-<sha>.'
        required: false
        type: string
      latest:
        description: 'Also move :latest to this image.'
        required: false
        default: false
        type: boolean

# Superseded runs are cancelled, EXCEPT on a tag.
#
# Five agents pushing to the same branch left this workflow's runs queued
# against commits nobody wanted any more, holding runners while every other
# job waited. ci.yml and dogfood.yml already cancel; this file had no
# concurrency block at all.
#
# The exception matters more than the rule. This workflow PUBLISHES on a tag
# push, so cancelling one would abandon a release part way through and leave
# a tag with no image behind it. A branch run can be safely thrown away and
# a publish cannot, so tags are excluded rather than sharing the branch
# policy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The tag, worked out ONCE for every edition.
  #
  # Its own job rather than a step inside the matrix, and the reason is a trap
  # rather than tidiness: a matrix job's `outputs` are written by every leg into
  # the same place, so whichever leg finishes last wins and the value a
  # downstream job reads depends on a race. Both legs would compute the same
  # string here, which is exactly what makes that shape dangerous. It would be
  # correct until the day it was not, and nothing would say when that was.
  # ---------------------------------------------------------------------------
  meta:
    name: the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the tag
        id: meta
        run: |
          set -euo pipefail
          requested="${{ inputs.tag }}"
          if [[ -n "$requested" ]]; then
            # A tag reaches a registry path and an OCI reference. Anything
            # outside this set either fails deep inside `docker push` with a
            # message about a malformed reference, or does not fail at all and
            # publishes something nobody meant to.
            [[ "$requested" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
              echo "::error::refusing tag '$requested': a tag is 1 to 128 characters of letters, digits, dot, dash and underscore, and may not start with a separator"
              exit 1
            }
            tag="$requested"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tag="main-$(git rev-parse --short HEAD)"
          else
            tag="pr-${{ github.event.number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $tag from $(git rev-parse HEAD)"

  build:
    name: build ${{ matrix.edition }}
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: read
      packages: write

    # fail-fast off. The two editions fail for different reasons, and the
    # enterprise one fails for reasons the community one cannot have: its build
    # context is a different list of files and its layout carries symlinks
    # between two npm workspaces. Cancelling the community leg because the
    # enterprise leg broke would hide whether the shared half is still sound,
    # which is the first question anybody reading a red run here asks.
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: community
            image: control-plane
            dockerfile: deploy/docker/control-plane.Dockerfile
          - edition: enterprise
            image: control-plane-enterprise
            dockerfile: deploy/docker/control-plane-enterprise.Dockerfile

    # Written out per job rather than derived from a shared value, because the
    # `env` context is not available to `jobs.<id>.env` and a half derived name
    # is worse than two literals. The chart job below carries the community one
    # for the same reason.
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          set -euo pipefail
          docker build \
            -f "${DOCKERFILE}" \
            -t "${IMAGE}:${{ needs.meta.outputs.tag }}" \
            --build-arg AF_VERSION="${{ needs.meta.outputs.tag }}" \
            --build-arg AF_COMMIT="$(git rev-parse HEAD)" \
            --build-arg AF_BUILD_DATE="$(git show -s --format=%cI HEAD)" \
            .
          docker save "${IMAGE}:${{ needs.meta.outputs.tag }}" -o /tmp/image.tar
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}

      # THE ENTERPRISE CONTEXT IS NOT THE COMMUNITY CONTEXT, AND THIS IS WHERE
      # THAT WOULD GO WRONG QUIETLY.
      #
      # The repository root .dockerignore excludes ee/, and ee/README.md names
      # that exclusion as one of the four mechanisms holding the edition
      # boundary. So the enterprise Dockerfile carries its own ignore file
      # beside it, which BuildKit reads in its place. If a future builder does
      # not honour a per-Dockerfile ignore file, the enterprise build fails on a
      # missing COPY, which is loud. The failure that would NOT be loud is the
      # opposite one: the community image quietly gaining ee/ in its context.
      # So the community leg asserts that its own image carries no enterprise
      # tree, which is the direction that has no other alarm on it.
      - name: The community image carries no enterprise tree
        if: matrix.edition == 'community'
        run: |
          set -euo pipefail
          img="${IMAGE}:${{ needs.meta.outputs.tag }}"
          if docker run --rm --entrypoint sh "$img" -c 'test -e /app/ee -o -e /app/ee/web'; then
            echo "FAIL: the community image contains an enterprise tree. The root .dockerignore"
            echo "FAIL: no longer excludes ee/, or this Dockerfile started copying it."
            exit 1
          fi
          echo "no enterprise tree in the community image"

      - name: The enterprise image carries the entry point and its links
        if: matrix.edition == 'enterprise'
        run: |
          set -euo pipefail
          img="${IMAGE}:${{ needs.meta.outputs.tag }}"
          # Asserted from outside the build as well as inside it. The Dockerfile
          # makes the same checks with RUN, and a layer cache hit can serve a
          # RUN from a previous build; this reads the image that came out.
          docker run --rm --entrypoint sh "$img" -c '
            set -e
            test -f /app/ee/web/server/src/main.ts
            test -f /app/ee/web/node_modules/@antifailure/api/src/boot.ts
            test -f /app/ee/LICENSE.md
          '
          echo "the entry point, the cross workspace link and the license are in the image"

      # The image has to be able to do the two things the deployment depends on
      # before it is allowed anywhere near a registry.
      - name: The entrypoints exist and refuse cleanly
        run: |
          set -euo pipefail
          img="${IMAGE}:${{ needs.meta.outputs.tag }}"
          test "$(docker run --rm --entrypoint sh "$img" -c 'ls bootstrap.mjs maintenance.mjs | wc -l')" = "2"

          # With no credential each entrypoint must exit non-zero AND name the
          # variable it wanted. Both halves are asserted: an exit code with a
          # useless message sends somebody to read the source at 3am, and a good
          # message with a zero exit is a job that silently did nothing.
          check_refusal() {
            local script="$1" want="$2" out rc
            out=$(docker run --rm "$img" node "$script" 2>&1) && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "FAIL: $script exited 0 with no credential configured"; exit 1
            fi
            case "$out" in
              *"$want"*) echo "$script refuses and names $want" ;;
              *) echo "FAIL: $script did not mention $want. It said: $out"; exit 1 ;;
            esac
          }
          check_refusal maintenance.mjs AF_MAINTENANCE_DATABASE_URL
          check_refusal bootstrap.mjs AF_MIGRATION_DATABASE_URL

          # Exercise the packaged command, not only the source file it wraps.
          out=$(docker run --rm --entrypoint af-operator "$img" init 2>&1) && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: operator setup exited 0 without its runtime credential"; exit 1
          fi
          case "$out" in
            *AF_ADMIN_DATABASE_URL*) echo "operator setup refuses and names its runtime credential" ;;
            *) echo "FAIL: operator setup did not reach its credential guard. It said: $out"; exit 1 ;;
          esac

      # One artifact per edition. A shared name would have the two legs
      # overwrite each other, and the chart job downloads by name, so it would
      # install whichever leg happened to finish last onto a cluster.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-image-${{ matrix.edition }}
          path: /tmp/image.tar
          retention-days: 1

      # Only after everything above, and never from a pull request: a fork must
      # not be able to publish under this repository's name.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${{ needs.meta.outputs.tag }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* || "${{ inputs.latest }}" == "true" ]]; then
            docker tag "${IMAGE}:${{ needs.meta.outputs.tag }}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${{ needs.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The enterprise image mounts what it sells, refuses what has not been bought,
  # and the community image mounts neither.
  #
  # THE CLAIM THIS JOB EXISTS TO MAKE, AND WHY THE SUITE DOES NOT MAKE IT.
  # ee/web/server/test/entrypoint.test.ts already drives the same three answers
  # out of processes started with `node src/main.ts` from a checkout. That is a
  # claim about the SOURCE. This is a claim about the ARTIFACT, and until this
  # workflow built one there was no artifact to make it about: an entry point
  # that works under a test runner and ships in nothing is the same gap moved
  # one layer out.
  #
  # It is also the only place the image's LAYOUT is under test. The enterprise
  # packages reach the community ones through relative symlinks npm wrote, and a
  # symlink pointing at nothing is not a build error. A licensed 200 out of
  # ee/web/sso proves the link resolved, the pool opened, the extension
  # registered before the router was built, and the route reached a socket.
  #
  # Its own job because it needs BOTH images, and neither build leg has the
  # other one.
  # ---------------------------------------------------------------------------
  enterprise:
    name: the enterprise image mounts what it sells
    runs-on: ubuntu-latest
    needs: [meta, build]

    env:
      ENTERPRISE_IMAGE: ghcr.io/${{ github.repository_owner }}/control-plane-enterprise
      COMMUNITY_IMAGE: ghcr.io/${{ github.repository_owner }}/control-plane

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two directories, because both legs save their tarball under the same
      # file name and one path would have the second download overwrite the
      # first. The proof would then compare an image against itself and pass.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: control-plane-image-enterprise
          path: /tmp/enterprise

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: control-plane-image-community
          path: /tmp/community

      - name: Load both images
        run: |
          set -euo pipefail
          docker load -i /tmp/enterprise/image.tar
          docker load -i /tmp/community/image.tar
          # Loaded, and they are two different images. A tarball that was
          # overwritten upstream would load one image twice, and every
          # assertion in the proof would then be made about the same
          # container, which is the failure mode that reads as a pass.
          ee=$(docker image inspect -f '{{.Id}}' "${ENTERPRISE_IMAGE}:${{ needs.meta.outputs.tag }}")
          ce=$(docker image inspect -f '{{.Id}}' "${COMMUNITY_IMAGE}:${{ needs.meta.outputs.tag }}")
          test "$ee" != "$ce" || { echo "FAIL: both artifacts are the same image"; exit 1; }
          echo "two distinct images loaded"

      - name: Licensed 200, unlicensed 402, community 404
        run: |
          deploy/docker/enterprise-image-proof.sh \
            "${ENTERPRISE_IMAGE}:${{ needs.meta.outputs.tag }}" \
            "${COMMUNITY_IMAGE}:${{ needs.meta.outputs.tag }}"

  # ---------------------------------------------------------------------------
  # The chart, installed for real, on a cluster that is not AKS.
  #
  # This is the difference between "the templates render" and "it works".
  # `helm template` has never caught a bad probe, a missing grant, or a job that
  # runs in the wrong order. An install does.
  # ---------------------------------------------------------------------------
  chart:
    name: helm install on kind
    runs-on: ubuntu-latest
    # Both, and the tag job. `needs: build` on a matrix waits for every leg,
    # which is what is wanted: the chart is the community image's proof and a
    # broken enterprise build is still a broken pull request.
    needs: [meta, build]

    # The community image, spelled out. This job installs the chart, and the
    # chart's own default is the community repository; pointing it at an
    # edition chosen by a matrix variable that does not exist in this job would
    # be a silent empty string.
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/control-plane

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: control-plane-image-community
          path: /tmp

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: af-chart

      - name: Load the image we just built
        run: |
          set -euo pipefail
          docker load -i /tmp/image.tar
          kind load docker-image "${IMAGE}:${{ needs.meta.outputs.tag }}" --name af-chart

      - name: helm lint
        run: |
          helm lint deploy/helm/antifailure-control-plane \
            --set database.url=postgres://a:b@h:5432/c \
            --set database.migrationUrl=postgres://m:n@h:5432/c \
            --set github.clientId=i --set github.clientSecret=s \
            --set github.redirectUri=https://x/cb

      # Install-time ordering, checked without needing a cluster. This chart
      # failed on a real cluster twice for the same reason: a pre-install hook
      # referencing a normal release resource that does not exist yet. Neither
      # failure was visible in the rendered YAML, which was valid both times,
      # and both cost eight minutes to surface as "timed out waiting for the
      # condition".
      - name: Hook ordering
        run: |
          set -euo pipefail
          helm template r deploy/helm/antifailure-control-plane \
            --set database.url=x --set database.migrationUrl=y \
            --set github.clientId=i --set github.clientSecret=s \
            --set github.redirectUri=https://x/cb \
            | python3 deploy/helm/hook-ordering-check.py

      # The guards must be able to REFUSE. A validation nobody has watched fail
      # is a validation that may not work.
      - name: The value guards refuse bad input
        run: |
          set -euo pipefail
          refuse() {
            if helm template t deploy/helm/antifailure-control-plane "$@" >/dev/null 2>&1; then
              echo "FAIL: rendered when it should have refused: $*"; exit 1
            fi
            echo "refused as it should: $*"
          }
          refuse --set github.clientId=i --set github.clientSecret=s --set github.redirectUri=u
          refuse --set database.url=x --set github.clientId=i --set github.clientSecret=s --set github.redirectUri=u
          refuse --set database.url=x --set database.migrationUrl=y --set github.clientId=i \
                 --set github.clientSecret=s --set github.redirectUri=u --set maintenance.mode=weekly
          # The all-or-nothing sets. Each of these renders valid YAML and
          # installs cleanly; the application then stops at startup, or worse,
          # runs half configured. A half configured GitHub App accepts
          # installations and drops every delivery, and two thirds of Stripe
          # leaves billing off with the missing piece usually being the webhook
          # secret, which fails for the first time when a real customer pays.
          ok() {
            if ! helm template t deploy/helm/antifailure-control-plane "$@" >/dev/null 2>&1; then
              echo "FAIL: refused a combination that is correct: $*"; exit 1
            fi
            echo "rendered as it should: $*"
          }
          base=(--set database.url=x --set database.migrationUrl=y --set github.clientId=i
                --set github.clientSecret=s --set github.redirectUri=https://x/cb)
          refuse "${base[@]}" --set github.appId=1
          refuse "${base[@]}" --set github.appId=1 --set github.privateKey=k
          refuse "${base[@]}" --set github.privateKey=k --set github.webhookSecret=w
          ok     "${base[@]}" --set github.appId=1 --set github.privateKey=k --set github.webhookSecret=w
          # An operator-supplied Secret is evidence for Stripe and not for the
          # App, because a Secret named by stripe.existingSecret exists for
          # Stripe and nothing else, while github.existingSecret carries the
          # OAuth App that every installation has. Both directions asserted, so
          # neither rule can be quietly given the other's shape.
          ok     --set database.existingSecret=d --set github.existingSecret=g
          ok     --set database.existingSecret=d --set github.existingSecret=g --set github.appId=1
          refuse "${base[@]}" --set stripe.secretKey=sk
          refuse "${base[@]}" --set stripe.secretKey=sk --set stripe.webhookSecret=wh
          refuse "${base[@]}" --set stripe.priceTeam=price
          refuse "${base[@]}" --set stripe.existingSecret=s
          ok     "${base[@]}" --set stripe.secretKey=sk --set stripe.webhookSecret=wh --set stripe.priceTeam=price
          ok     "${base[@]}" --set stripe.existingSecret=s --set stripe.priceTeam=price
          refuse "${base[@]}" --set config.adminPoolMax=4
          ok     "${base[@]}" --set config.adminPoolMax=4 --set database.adminUrl=postgres://admin
          refuse "${base[@]}" --set config.hostedRequiredPlan=enterprise
          ok     "${base[@]}" --set config.hostedRequiredPlan=enterprise --set stripe.secretKey=sk \
                 --set stripe.webhookSecret=wh --set stripe.priceTeam=price

      # Who may sign in, in all three of its states, because the difference
      # between them is the whole feature and two of the three are silent.
      #
      # The application reads an UNSET AF_SIGNIN_ALLOWLIST as open to every
      # GitHub account and an EMPTY one as nobody. So a template block that
      # disappeared when the list was empty would turn the most restrictive
      # intent into the least restrictive deployment, and the rendered YAML of
      # a chart that got this wrong looks exactly like the rendered YAML of one
      # that got it right: the variable is simply not there.
      - name: The sign-in allowlist renders in all three states
        run: |
          set -euo pipefail
          render() {
            helm template t deploy/helm/antifailure-control-plane               --set database.url=x --set database.migrationUrl=y               --set github.clientId=i --set github.clientSecret=s               --set github.redirectUri=https://x/cb "$@"
          }
          # The absent case has to come back as a SENTENCE rather than as a
          # failed pipeline. Without the fallback, grep finding nothing exits
          # the step under pipefail before the assertion below can say what was
          # wrong, and a red step with no message is how somebody concludes the
          # check is flaky.
          allowlist() {
            local rendered
            rendered=$(render "$@" | grep -A1 'name: AF_SIGNIN_ALLOWLIST' | tail -1 | sed 's/.*value: //') \
              || rendered="<absent, so this deployment lets any GitHub account sign in>"
            printf '%s' "$rendered"
          }
          if render | grep -q AF_SIGNIN_ALLOWLIST; then
            echo "FAIL: the default set the variable, which closes an installation that did not ask to be closed"
            exit 1
          fi
          echo "default: the variable is absent, so sign-in is open"

          empty=$(allowlist --set-json 'config.signinAllowlist=[]')
          if [ "$empty" != '""' ]; then
            echo "FAIL: an empty list rendered $empty, want an empty string, which is how the application spells nobody"
            exit 1
          fi
          echo "empty list: the variable is set and empty, so sign-in is closed to everybody"

          named=$(allowlist --set-json 'config.signinAllowlist=["octocat","hubot"]')
          if [ "$named" != '"octocat,hubot"' ]; then
            echo "FAIL: two logins rendered $named"
            exit 1
          fi
          echo "two logins: $named"

      - name: A Postgres for the chart to talk to
        run: |
          set -euo pipefail
          kubectl create namespace cp
          kubectl -n cp create secret generic pg --from-literal=POSTGRES_PASSWORD=devpassword
          kubectl -n cp apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: pg }
          spec:
            replicas: 1
            selector: { matchLabels: { app: pg } }
            template:
              metadata: { labels: { app: pg } }
              spec:
                containers:
                  - name: pg
                    image: postgres:17-alpine
                    env:
                      - { name: POSTGRES_USER, value: af_migrator }
                      - { name: POSTGRES_DB, value: antifailure }
                      - name: POSTGRES_PASSWORD
                        valueFrom: { secretKeyRef: { name: pg, key: POSTGRES_PASSWORD } }
                    ports: [{ containerPort: 5432 }]
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: pg }
          spec:
            selector: { app: pg }
            ports: [{ port: 5432, targetPort: 5432 }]
          YAML
          kubectl -n cp rollout status deploy/pg --timeout=180s

      - name: helm install
        run: |
          set -euo pipefail
          helm install cp deploy/helm/antifailure-control-plane -n cp --wait --timeout 8m \
            --set image.repository="${IMAGE}" \
            --set image.tag="${{ needs.meta.outputs.tag }}" \
            --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --set podDisruptionBudget.enabled=false \
            --set database.url="postgres://af_app:apppassword@pg:5432/antifailure" \
            --set database.migrationUrl="postgres://af_migrator:devpassword@pg:5432/antifailure" \
            --set github.clientId=test --set github.clientSecret=test \
            --set github.redirectUri=http://localhost/auth/callback \
            --set config.insecureCookies=true

      # The bootstrap did the thing nothing else does. Without the membership
      # grant the pods come up healthy and cannot read one table, so this is the
      # assertion that matters most in the whole workflow.
      - name: The application role can actually see its tables
        run: |
          set -euo pipefail
          kubectl -n cp logs job -l app.kubernetes.io/component=bootstrap --tail=-1 || true
          kubectl -n cp exec deploy/pg -- env PGPASSWORD=devpassword \
            psql -U af_migrator -d antifailure -tAc \
            "SELECT pg_has_role('af_app','antifailure_app','MEMBER')" | grep -qx t
          echo "af_app is a member of antifailure_app"
          kubectl -n cp exec deploy/pg -- env PGPASSWORD=apppassword \
            psql -h 127.0.0.1 -U af_app -d antifailure -tAc "SELECT count(*) FROM organizations" | grep -qx 0
          echo "af_app can read organizations, and sees no other tenant's rows"

      - name: helm test
        run: helm test cp -n cp --timeout 3m

      - name: What went wrong
        if: failure()
        run: |
          kubectl -n cp get all
          kubectl -n cp describe pods
          # The Job, not only its pods. When a hook fails because its pod was
          # never created, the pods tell you nothing and the Job's events say
          # exactly why.
          kubectl -n cp describe job
          kubectl -n cp get events --sort-by=.lastTimestamp | tail -40
          kubectl -n cp logs -l app.kubernetes.io/name=antifailure-control-plane --tail=100 --all-containers || true
          kubectl -n cp logs -l app.kubernetes.io/component=bootstrap --tail=100 || true

      - name: helm uninstall leaves nothing behind
        run: |
          set -euo pipefail
          helm uninstall cp -n cp --wait
          left=$(kubectl -n cp get deploy,svc,secret,cronjob -l app.kubernetes.io/name=antifailure-control-plane -o name | wc -l)
          test "$left" -eq 0 || { kubectl -n cp get all; echo "uninstall left $left object(s)"; exit 1; }
          echo "clean"
