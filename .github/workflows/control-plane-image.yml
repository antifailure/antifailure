# The control plane image, and a Helm chart proved against a real cluster.
#
# docs/self-hosting/control-plane.md tells operators to run
# ghcr.io/antifailure/control-plane:<version>. This is what makes that
# instruction followable.
#
# On a pull request the image is BUILT and never pushed, and the chart is
# installed on a real kind cluster using that freshly built image. kind is not
# AKS, which is the point: the chart has to work on any conformant cluster.
name: control-plane-image

on:
  pull_request:
    paths:
      - 'web/**'
      - 'deploy/**'
      - '.dockerignore'
      - '.github/workflows/control-plane-image.yml'

  # NO `paths:` FILTER HERE, AND THAT IS THE POINT.
  #
  # GitHub combines `branches`/`tags` with `paths` as an AND, so a `paths:`
  # filter sitting in the same block as `tags: ['v*']` is also applied to the
  # tag push. A release workflow that publishes on a version tag and quietly
  # never runs is the failure this shape produces, and it produces it silently:
  # there is no red check, there is no run at all, and the first symptom is an
  # operator pulling an image that was never built.
  #
  # The cost of dropping the filter is a few wasted minutes when a push to main
  # touches nothing this workflow cares about. That is the cheaper mistake.
  push:
    branches: [main]
    tags: ['v*']

  # Publishing a tag that already exists.
  #
  # v0.1.1 was tagged for the CLI release before this workflow existed, so the
  # tag push that would have built the image happened months of commits ago
  # against a tree with no Dockerfile in it. Re-pointing a released tag to
  # rebuild it would re-run the CLI release and rewrite a published artifact,
  # which is worse than the problem. This input publishes the image under a
  # chosen tag from the current ref instead, and the image's own
  # org.opencontainers.image.revision label records the commit it was really
  # built from, so the two can never quietly disagree.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish, e.g. v0.1.1. Defaults to main-<sha>.'
        required: false
        type: string
      latest:
        description: 'Also move :latest to this image.'
        required: false
        default: false
        type: boolean

# Superseded runs are cancelled, EXCEPT on a tag.
#
# Five agents pushing to the same branch left this workflow's runs queued
# against commits nobody wanted any more, holding runners while every other
# job waited. ci.yml and dogfood.yml already cancel; this file had no
# concurrency block at all.
#
# The exception matters more than the rule. This workflow PUBLISHES on a tag
# push, so cancelling one would abandon a release part way through and leave
# a tag with no image behind it. A branch run can be safely thrown away and
# a publish cannot, so tags are excluded rather than sharing the branch
# policy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/control-plane

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the tag
        id: meta
        run: |
          set -euo pipefail
          requested="${{ inputs.tag }}"
          if [[ -n "$requested" ]]; then
            # A tag reaches a registry path and an OCI reference. Anything
            # outside this set either fails deep inside `docker push` with a
            # message about a malformed reference, or does not fail at all and
            # publishes something nobody meant to.
            [[ "$requested" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
              echo "::error::refusing tag '$requested': a tag is 1 to 128 characters of letters, digits, dot, dash and underscore, and may not start with a separator"
              exit 1
            }
            tag="$requested"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            tag="main-$(git rev-parse --short HEAD)"
          else
            tag="pr-${{ github.event.number }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $tag from $(git rev-parse HEAD)"

      - name: Build
        run: |
          set -euo pipefail
          docker build \
            -f deploy/docker/control-plane.Dockerfile \
            -t "${IMAGE}:${{ steps.meta.outputs.tag }}" \
            --build-arg AF_VERSION="${{ steps.meta.outputs.tag }}" \
            --build-arg AF_COMMIT="$(git rev-parse HEAD)" \
            --build-arg AF_BUILD_DATE="$(git show -s --format=%cI HEAD)" \
            .
          docker save "${IMAGE}:${{ steps.meta.outputs.tag }}" -o /tmp/image.tar

      # The image has to be able to do the two things the deployment depends on
      # before it is allowed anywhere near a registry.
      - name: The entrypoints exist and refuse cleanly
        run: |
          set -euo pipefail
          img="${IMAGE}:${{ steps.meta.outputs.tag }}"
          test "$(docker run --rm --entrypoint sh "$img" -c 'ls bootstrap.mjs maintenance.mjs | wc -l')" = "2"

          # With no credential each entrypoint must exit non-zero AND name the
          # variable it wanted. Both halves are asserted: an exit code with a
          # useless message sends somebody to read the source at 3am, and a good
          # message with a zero exit is a job that silently did nothing.
          check_refusal() {
            local script="$1" want="$2" out rc
            out=$(docker run --rm "$img" node "$script" 2>&1) && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "FAIL: $script exited 0 with no credential configured"; exit 1
            fi
            case "$out" in
              *"$want"*) echo "$script refuses and names $want" ;;
              *) echo "FAIL: $script did not mention $want. It said: $out"; exit 1 ;;
            esac
          }
          check_refusal maintenance.mjs AF_MAINTENANCE_DATABASE_URL
          check_refusal bootstrap.mjs AF_MIGRATION_DATABASE_URL

          # Exercise the packaged command, not only the source file it wraps.
          out=$(docker run --rm --entrypoint af-operator "$img" init 2>&1) && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: operator setup exited 0 without its runtime credential"; exit 1
          fi
          case "$out" in
            *AF_ADMIN_DATABASE_URL*) echo "operator setup refuses and names its runtime credential" ;;
            *) echo "FAIL: operator setup did not reach its credential guard. It said: $out"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-plane-image
          path: /tmp/image.tar
          retention-days: 1

      # Only after everything above, and never from a pull request: a fork must
      # not be able to publish under this repository's name.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${{ steps.meta.outputs.tag }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* || "${{ inputs.latest }}" == "true" ]]; then
            docker tag "${IMAGE}:${{ steps.meta.outputs.tag }}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The chart, installed for real, on a cluster that is not AKS.
  #
  # This is the difference between "the templates render" and "it works".
  # `helm template` has never caught a bad probe, a missing grant, or a job that
  # runs in the wrong order. An install does.
  # ---------------------------------------------------------------------------
  chart:
    name: helm install on kind
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: control-plane-image
          path: /tmp

      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: af-chart

      - name: Load the image we just built
        run: |
          set -euo pipefail
          docker load -i /tmp/image.tar
          kind load docker-image "${IMAGE}:${{ needs.build.outputs.tag }}" --name af-chart

      - name: helm lint
        run: |
          helm lint deploy/helm/antifailure-control-plane \
            --set database.url=postgres://a:b@h:5432/c \
            --set database.migrationUrl=postgres://m:n@h:5432/c \
            --set github.clientId=i --set github.clientSecret=s \
            --set github.redirectUri=https://x/cb

      # Install-time ordering, checked without needing a cluster. This chart
      # failed on a real cluster twice for the same reason: a pre-install hook
      # referencing a normal release resource that does not exist yet. Neither
      # failure was visible in the rendered YAML, which was valid both times,
      # and both cost eight minutes to surface as "timed out waiting for the
      # condition".
      - name: Hook ordering
        run: |
          set -euo pipefail
          helm template r deploy/helm/antifailure-control-plane \
            --set database.url=x --set database.migrationUrl=y \
            --set github.clientId=i --set github.clientSecret=s \
            --set github.redirectUri=https://x/cb \
            | python3 deploy/helm/hook-ordering-check.py

      # The guards must be able to REFUSE. A validation nobody has watched fail
      # is a validation that may not work.
      - name: The value guards refuse bad input
        run: |
          set -euo pipefail
          refuse() {
            if helm template t deploy/helm/antifailure-control-plane "$@" >/dev/null 2>&1; then
              echo "FAIL: rendered when it should have refused: $*"; exit 1
            fi
            echo "refused as it should: $*"
          }
          refuse --set github.clientId=i --set github.clientSecret=s --set github.redirectUri=u
          refuse --set database.url=x --set github.clientId=i --set github.clientSecret=s --set github.redirectUri=u
          refuse --set database.url=x --set database.migrationUrl=y --set github.clientId=i \
                 --set github.clientSecret=s --set github.redirectUri=u --set maintenance.mode=weekly

      # Who may sign in, in all three of its states, because the difference
      # between them is the whole feature and two of the three are silent.
      #
      # The application reads an UNSET AF_SIGNIN_ALLOWLIST as open to every
      # GitHub account and an EMPTY one as nobody. So a template block that
      # disappeared when the list was empty would turn the most restrictive
      # intent into the least restrictive deployment, and the rendered YAML of
      # a chart that got this wrong looks exactly like the rendered YAML of one
      # that got it right: the variable is simply not there.
      - name: The sign-in allowlist renders in all three states
        run: |
          set -euo pipefail
          render() {
            helm template t deploy/helm/antifailure-control-plane               --set database.url=x --set database.migrationUrl=y               --set github.clientId=i --set github.clientSecret=s               --set github.redirectUri=https://x/cb "$@"
          }
          # The absent case has to come back as a SENTENCE rather than as a
          # failed pipeline. Without the fallback, grep finding nothing exits
          # the step under pipefail before the assertion below can say what was
          # wrong, and a red step with no message is how somebody concludes the
          # check is flaky.
          allowlist() {
            local rendered
            rendered=$(render "$@" | grep -A1 'name: AF_SIGNIN_ALLOWLIST' | tail -1 | sed 's/.*value: //') \
              || rendered="<absent, so this deployment lets any GitHub account sign in>"
            printf '%s' "$rendered"
          }
          if render | grep -q AF_SIGNIN_ALLOWLIST; then
            echo "FAIL: the default set the variable, which closes an installation that did not ask to be closed"
            exit 1
          fi
          echo "default: the variable is absent, so sign-in is open"

          empty=$(allowlist --set-json 'config.signinAllowlist=[]')
          if [ "$empty" != '""' ]; then
            echo "FAIL: an empty list rendered $empty, want an empty string, which is how the application spells nobody"
            exit 1
          fi
          echo "empty list: the variable is set and empty, so sign-in is closed to everybody"

          named=$(allowlist --set-json 'config.signinAllowlist=["octocat","hubot"]')
          if [ "$named" != '"octocat,hubot"' ]; then
            echo "FAIL: two logins rendered $named"
            exit 1
          fi
          echo "two logins: $named"

      - name: A Postgres for the chart to talk to
        run: |
          set -euo pipefail
          kubectl create namespace cp
          kubectl -n cp create secret generic pg --from-literal=POSTGRES_PASSWORD=devpassword
          kubectl -n cp apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: pg }
          spec:
            replicas: 1
            selector: { matchLabels: { app: pg } }
            template:
              metadata: { labels: { app: pg } }
              spec:
                containers:
                  - name: pg
                    image: postgres:17-alpine
                    env:
                      - { name: POSTGRES_USER, value: af_migrator }
                      - { name: POSTGRES_DB, value: antifailure }
                      - name: POSTGRES_PASSWORD
                        valueFrom: { secretKeyRef: { name: pg, key: POSTGRES_PASSWORD } }
                    ports: [{ containerPort: 5432 }]
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: pg }
          spec:
            selector: { app: pg }
            ports: [{ port: 5432, targetPort: 5432 }]
          YAML
          kubectl -n cp rollout status deploy/pg --timeout=180s

      - name: helm install
        run: |
          set -euo pipefail
          helm install cp deploy/helm/antifailure-control-plane -n cp --wait --timeout 8m \
            --set image.repository="${IMAGE}" \
            --set image.tag="${{ needs.build.outputs.tag }}" \
            --set image.pullPolicy=Never \
            --set replicaCount=1 \
            --set podDisruptionBudget.enabled=false \
            --set database.url="postgres://af_app:apppassword@pg:5432/antifailure" \
            --set database.migrationUrl="postgres://af_migrator:devpassword@pg:5432/antifailure" \
            --set github.clientId=test --set github.clientSecret=test \
            --set github.redirectUri=http://localhost/auth/callback \
            --set config.insecureCookies=true

      # The bootstrap did the thing nothing else does. Without the membership
      # grant the pods come up healthy and cannot read one table, so this is the
      # assertion that matters most in the whole workflow.
      - name: The application role can actually see its tables
        run: |
          set -euo pipefail
          kubectl -n cp logs job -l app.kubernetes.io/component=bootstrap --tail=-1 || true
          kubectl -n cp exec deploy/pg -- env PGPASSWORD=devpassword \
            psql -U af_migrator -d antifailure -tAc \
            "SELECT pg_has_role('af_app','antifailure_app','MEMBER')" | grep -qx t
          echo "af_app is a member of antifailure_app"
          kubectl -n cp exec deploy/pg -- env PGPASSWORD=apppassword \
            psql -h 127.0.0.1 -U af_app -d antifailure -tAc "SELECT count(*) FROM organizations" | grep -qx 0
          echo "af_app can read organizations, and sees no other tenant's rows"

      - name: helm test
        run: helm test cp -n cp --timeout 3m

      - name: What went wrong
        if: failure()
        run: |
          kubectl -n cp get all
          kubectl -n cp describe pods
          # The Job, not only its pods. When a hook fails because its pod was
          # never created, the pods tell you nothing and the Job's events say
          # exactly why.
          kubectl -n cp describe job
          kubectl -n cp get events --sort-by=.lastTimestamp | tail -40
          kubectl -n cp logs -l app.kubernetes.io/name=antifailure-control-plane --tail=100 --all-containers || true
          kubectl -n cp logs -l app.kubernetes.io/component=bootstrap --tail=100 || true

      - name: helm uninstall leaves nothing behind
        run: |
          set -euo pipefail
          helm uninstall cp -n cp --wait
          left=$(kubectl -n cp get deploy,svc,secret,cronjob -l app.kubernetes.io/name=antifailure-control-plane -o name | wc -l)
          test "$left" -eq 0 || { kubectl -n cp get all; echo "uninstall left $left object(s)"; exit 1; }
          echo "clean"
