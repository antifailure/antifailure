name: Links

# Every address the site points at, including the ones that leave it.
#
# Separate from CI and on a schedule because an external link check is not a
# property of a change. A vendor's documentation site going down is not a
# reason to refuse somebody's pull request, and a check that fails for reasons
# the author cannot fix is a check everybody learns to re-run until it passes.
# CI checks the internal links and fragments on every build, where a failure is
# always the author's to fix.

on:
  schedule:
    # 06:00 UTC daily, before the working day in Europe.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: every address resolves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job builds www, and www/lib/lastmod.ts asks git when the files
          # behind each route last changed so the sitemap's lastmod is a real
          # date rather than the build clock. Under a shallow checkout every
          # file looks like it arrived in the single commit that exists, and
          # the build refuses rather than publishing a sitemap claiming every
          # page changed today. ci.yml and deploy.yml already set this; this
          # workflow was missed, and it is why the nightly link check has been
          # failing in the build step without ever reaching a link.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: www/package-lock.json

      - run: npm ci --no-audit --no-fund
        working-directory: www

      - run: npm run build
        working-directory: www

      - run: npm ci --no-audit --no-fund
        working-directory: docs

      - run: npm run build
        working-directory: docs

      - name: Assemble the site
        run: |
          rm -rf site && mkdir -p site
          cp -R www/out/. site/
          cp -R docs/dist site/docs

      - name: Check every link, including the external ones
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --root-dir site 'site/**/*.html'
          fail: true
