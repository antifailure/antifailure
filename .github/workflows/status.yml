# A status page whose signal comes from outside the thing it reports on.
#
# Every other check in this repository runs where the thing it is checking
# runs: CI builds the commit, the deploy gate curls the revision it just
# created. A status page cannot work that way. If the probe lived in the
# control plane's own process, a total outage of the control plane would also
# silence the page that is supposed to say so, which is the one failure a
# status page exists to rule out.
#
# So this runs on a schedule, on GitHub's infrastructure rather than Azure's,
# and it writes to its own orphan branch rather than to main: a probe every
# five minutes on `main` would fire cd.yml's staging deploy every five
# minutes, which is the opposite of what a status page should cause.
# status-data is read by nothing else in this repository and triggers nothing
# else in it.
#
# See docs/src/content/docs/self-hosting/status-page.md for why this shape and
# not a third party product, and for the one manual step (enabling Pages on
# status-data) that turns this branch into a URL.
name: status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  # The probe never runs on a push. These two triggers exist only for the
  # `validate` job below, which reads the incident files a person just edited
  # and says so before they reach main rather than after. A paths filter is
  # ignored by `schedule`, so it constrains the push and pull_request events
  # and leaves the probe on its own timetable.
  pull_request:
    paths:
      - 'deploy/status/**'
      - '.github/workflows/status.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/status/**'
      - '.github/workflows/status.yml'

permissions:
  contents: read

concurrency:
  group: status-probe
  cancel-in-progress: false

jobs:
  # An incident note is written by a tired person during an outage, and the
  # cost of a mistake in it is a section of the status page that silently
  # renders nothing. render.sh deliberately never fails on a bad incident
  # file, because a probe must keep publishing whatever else is wrong, so
  # something else has to be the thing that says no. This is that thing, and
  # it runs on the pull request rather than on the schedule so the answer
  # arrives before the file lands.
  validate:
    name: the incident files and the renderer
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Every incident file is well formed and names components that exist
        run: deploy/status/incidents.sh check deploy/status/incidents deploy/status/targets.json

      - name: Every target is uniquely identified
        # An id collision would silently merge two components' histories into
        # one, and the merge is not reversible once it has been committed.
        run: |
          jq -e '(map(.id) | unique | length) == length' deploy/status/targets.json > /dev/null
          jq -e 'all(.[]; .id and .name and .group and .description and .url and .check)' deploy/status/targets.json > /dev/null
          jq -e 'all(.[]; .check == "readyz" or (.check == "http" and (.expect_body | length) > 0))' deploy/status/targets.json > /dev/null
          echo "$(jq length deploy/status/targets.json) components, all identified and all with something to assert"

      - name: The renderer over the states this page will actually be in
        run: deploy/status/render_test.sh

  probe:
    name: probe and publish
    runs-on: ubuntu-latest
    if: github.repository == 'antifailure/antifailure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 5
    permissions:
      # Only to push status-data, and nothing else this token could touch: no
      # pull requests, no issues, no other branch.
      contents: write
    steps:
      - name: Check out the scripts, from the commit this workflow runs at
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: main

      - name: Check out the data branch, into the same working copy origin remembers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: data
          fetch-depth: 0

      - name: Move to status-data, creating it the first time this runs
        working-directory: data
        run: |
          git config user.name "antifailure-status"
          git config user.email "status@antifailure.dev"
          if git ls-remote --exit-code --heads origin status-data > /dev/null; then
            git fetch origin status-data
            git checkout -B status-data origin/status-data
          else
            echo "status-data does not exist yet on the remote; starting it"
            git checkout --orphan status-data
            git rm -rf . > /dev/null
          fi

      - name: Probe every target
        run: main/deploy/status/probe.sh main/deploy/status/targets.json > readings.jsonl

      - name: Fold the readings into the history and render the page
        # Two checkouts, and that is the point: the scripts and the incident
        # notes come from `main`, the record comes from `status-data`, and
        # render.sh resolves the first from its own path so the two can never
        # be confused for each other.
        run: main/deploy/status/render.sh data readings.jsonl

      - name: Commit and push, only if something actually changed
        working-directory: data
        run: |
          git add history.json daily.json index.html feed.xml
          if git diff --cached --quiet; then
            echo "no change in this probe's readings; nothing to commit"
            exit 0
          fi
          git commit -m "status: probe at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A concurrent run of this same workflow is the only expected
          # conflict, five minutes apart at most; the concurrency group above
          # already serialises runs of this workflow, so a rejection here means
          # something else pushed to status-data, and one rebase and retry is
          # enough rather than a force push overwriting whatever that was.
          for attempt in 1 2 3; do
            if git push origin status-data; then
              exit 0
            fi
            echo "push rejected, attempt $attempt: fetching and rebasing"
            git fetch origin status-data
            git rebase origin/status-data
          done
          echo "::error::could not push status-data after three attempts"
          exit 1
