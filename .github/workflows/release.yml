name: Release

# Tags only. A release built from a branch is a release nobody can reproduce.
on:
  push:
    tags: ['v*']

# Read by default. The one job that publishes asks for write, and nothing else
# gets it. Four of the six jobs here only compile a binary and one only asks
# GitHub a question, and a compiler with permission to create a release is
# permission nobody needed to grant.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Nothing publishes that CI has not passed.
  #
  # A tag is the whole trigger for this workflow, and a tag is one command
  # anybody with push access can run on any commit. Before this job existed, a
  # tag on a red commit built four binaries, wrote a checksum file, generated a
  # bill of materials, signed both with cosign and published the lot, green the
  # whole way. The signature was even honest: it says this workflow in this
  # repository produced these bytes, which was true. Nothing anywhere said the
  # commit worked.
  #
  # cd.yml has answered the same question for deployment since the beginning,
  # and this is the same rule with the same reasoning and the same 38 minute
  # budget behind it. It defers to CI rather than re-running the checks, because
  # CI already ran on this commit and a second opinion that disagrees with the
  # first leaves nobody able to say which verdict was real.
  #
  # WHY IT DOES NOT DEADLOCK ITS OWN TAG. ci.yml runs on a push to main and on a
  # pull request, and not on tags. The run this waits for is the one the commit
  # already had when it landed on main, found by head_sha, so it is normally
  # complete before the tag exists. Nothing here waits for a run the tag itself
  # would trigger, because no such run is ever created.
  #
  # WHY THE JUDGEMENT IS A COMMAND AND NOT FIFTEEN LINES OF SHELL. Shell in a
  # tag triggered workflow can be watched refusing exactly once, on a real red
  # tag, which is the rehearsal nobody gets to do twice. tools/cigate has a
  # test per state GitHub can report, and the two that look like a pass and are
  # not, `cancelled` and `skipped`, each have their own.
  #
  # `cancelled` refuses. GitHub uses that one word for a job that hit its own
  # timeout, a run somebody stopped by hand, and a run a newer push superseded,
  # and none of the three is a verdict about the commit. ci.yml stopped
  # cancelling superseded runs on main and on tags precisely so that the commit
  # a release is cut from reaches one.
  # ---------------------------------------------------------------------------
  gate:
    name: gate
    runs-on: ubuntu-latest
    # The 115 attempts at 20 seconds inside cigate are sized against this
    # number, exactly as cd.yml's are against its own. Changing one without the
    # other turns a slow queue into a failed release.
    timeout-minutes: 45
    permissions:
      contents: read
      # Reading another workflow's runs. The default token cannot, and the
      # answer without it is a 403 rather than an empty list, which cigate
      # refuses on rather than mistaking for a commit nobody has tested.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: CI is green on the commit this tag names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # github.sha, which is the same value the build job stamps into every
        # binary below and the same value cd.yml gates on. Gating the exact
        # commit that gets stamped is the property that makes this worth
        # anything.
        run: |
          GOTOOLCHAIN=local go run ./tools/cigate \
            -repo "${{ github.repository }}" \
            -sha "${{ github.sha }}"

  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    # Gated too, rather than only the publish job. Compiling a binary from a red
    # commit harms nobody, and a green build job sitting above a refused gate is
    # a release that looks four fifths finished to whoever reads the run. It
    # also costs nothing: ci.yml does not run on tags, so the conclusion this
    # waits for already exists and the gate normally resolves on its first ask.
    needs: gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: darwin, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: linux,  arch: amd64 }
          - { os: linux,  arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Build and package
        # One script, called here and by `just build-release`, rather than a
        # copy of the build in each. The copies are what produced the bug this
        # pipeline is still living down: both stamped BuildDate with $(date -u),
        # so every build of one commit differed, and the local gate could not
        # see it because it was comparing its own copy against itself.
        #
        # The script carries the -X flags written out in full, and
        # tools/ldcheck reads it to prove each one names a symbol that exists.
        # The linker accepts -X for a symbol it cannot find and says nothing,
        # which is how v0.1.0 shipped four platforms that all reported "dev".
        run: |
          ./tools/release/build.sh \
            "${{ matrix.os }}" "${{ matrix.arch }}" \
            "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" "$(git show -s --format=%cI HEAD)" \
            dist stage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz*

  # ---------------------------------------------------------------------------
  # The egress sidecar image, published so that a customer's first af up does
  # not compile one.
  #
  # THE MEASUREMENT THIS JOB EXISTS FOR. docs/plan/four-stacks/README.md is a
  # run of `af up` against three stacks those projects publish themselves, taken
  # on 2026-09-08. It records the same line three times: killed at 25 minutes 32
  # seconds on "building the egress proxy". Zero of four stacks came up, zero of
  # fifty services reached ready. The sidecar is the first thing `af up` needs
  # and nothing had ever published it, so every first run anywhere compiled Go
  # inside a container, with a module fetch inside that container, on somebody's
  # first five minutes with this product.
  #
  # TWO ARCHITECTURES, AND THAT IS NOT OPTIONAL. The image runs on the container
  # daemon, not on the machine, so a developer on an Apple laptop needs
  # linux/arm64 and a Linux workstation needs linux/amd64. An amd64 only image
  # is not a smaller version of this fix, it is the fix skipping the half of
  # buyers most likely to be evaluating on a laptop: the pull finds no matching
  # manifest and the engine falls back to the 25 minute build, quietly, with
  # nothing saying why. The arm64 leg is emulated and therefore slow, which is
  # the right place to spend the minutes: once per release here rather than once
  # per customer there.
  #
  # THE TAG IS A CONTENT DIGEST AND THE ENGINE COMPUTES IT. The reference is a
  # hash over the twenty source files tools/proxysrc packages plus the
  # Dockerfile, so this job cannot know it and must not guess it. It asks
  # engine/cmd/sidecarimage, which is the same function the engine calls when it
  # looks for the image, and builds from the same tar archive the engine would
  # have handed its own daemon. A second implementation of that hash in shell
  # would agree until the day it did not, and on that day the release would
  # publish an image under a name nothing ever looks for.
  #
  # WHY IT GATES THE RELEASE. `publish` needs this job. A release whose sidecar
  # image is missing looks finished and puts every customer back on the build,
  # and nobody goes looking for an artifact they were never told about. A red
  # release can be cut again; a published one that is quietly short cannot.
  # ---------------------------------------------------------------------------
  sidecar:
    name: the egress sidecar image
    needs: gate
    runs-on: ubuntu-latest
    # Long enough for the emulated arm64 leg, which compiles the Go toolchain's
    # output under QEMU. If this ever hits the limit the release fails loudly,
    # which is the correct direction: the alternative is a release that
    # publishes half a manifest list.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      # QEMU for the arm64 leg and buildx for the manifest list. Both pinned to
      # a commit like every other action here.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: The reference the engine will ask for, and the context it would build
        id: image
        run: |
          set -euo pipefail
          cd engine
          GOTOOLCHAIN=local go run ./cmd/sidecarimage \
            -context "$RUNNER_TEMP/sidecar-context.tar" | tee "$GITHUB_OUTPUT"
          ls -l "$RUNNER_TEMP/sidecar-context.tar"

      # A fork must not push under this repository's name, and this constant
      # must not quietly stop naming what the release publishes. Both are the
      # same assertion: the owner half of the reference the ENGINE will pull
      # from has to be the owner this workflow is running for. Without it a fork
      # gets a 403 from a registry nobody told it about, and an edit to
      # proxyimage.PublishedRepository publishes somewhere no engine looks.
      - name: The published reference belongs to this repository's owner
        env:
          PUBLISHED: ${{ steps.image.outputs.published }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          expected="ghcr.io/${OWNER}/"
          case "$PUBLISHED" in
            "$expected"*) echo "$PUBLISHED is published by $OWNER" ;;
            *)
              echo "::error::proxyimage.PublishedRepository names $PUBLISHED, which is not under $expected."
              echo "::error::The engine pulls that reference, so publishing anywhere else means every"
              echo "::error::first run falls back to compiling the sidecar with nothing saying why."
              exit 1
              ;;
          esac

      # Built for this runner first, so the assertions below run against a real
      # container rather than against a manifest list nothing can start. The
      # multi architecture push reuses this leg from cache.
      - name: Build for this runner
        env:
          REF: ${{ steps.image.outputs.published }}
          LABEL: ${{ steps.image.outputs.label }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --label "${LABEL}=${DIGEST}" \
            --tag "$REF" \
            --load \
            - < "$RUNNER_TEMP/sidecar-context.tar"

      # THE LABEL IS THE INVARIANT AND THIS IS WHERE IT IS PUT THERE.
      #
      # A tag is a name in a registry that whoever can push may move. The engine
      # therefore treats the tag as how the image is FOUND and this label as how
      # it is BELIEVED: it refuses any image it pulled whose label is not the
      # digest of the sidecar source the binary carries, whatever the image was
      # called. So an image published without the label is an image no engine
      # will run, and that has to fail here rather than at a customer.
      - name: The image says which sidecar source it was built from
        env:
          REF: ${{ steps.image.outputs.published }}
          LABEL: ${{ steps.image.outputs.label }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          got=$(docker image inspect -f "{{index .Config.Labels \"${LABEL}\"}}" "$REF")
          if [ "$got" != "$DIGEST" ]; then
            echo "::error::$REF carries ${LABEL}=${got:-nothing} and the engine will look for $DIGEST."
            echo "::error::Every engine that pulled it would refuse it and compile the sidecar instead."
            exit 1
          fi
          echo "$REF declares sidecar source $got"

      # And it has to be the sidecar, not merely an image. The runtime stage is
      # scratch, so this is also the only place anything proves the binary is
      # statically linked: a dynamically linked one cannot start at all there.
      # With no configuration file it must exit non-zero AND name itself, and
      # both halves are asserted, because an exit code with no message sends
      # somebody to read source at 3am and a good message with a zero exit is a
      # sidecar that decided to run with no policy.
      - name: The image is the sidecar and refuses to run with no policy
        env:
          REF: ${{ steps.image.outputs.published }}
        run: |
          set -euo pipefail
          out=$(docker run --rm "$REF" 2>&1) && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::the sidecar started with no configuration file, which would mean an"
            echo "::error::environment whose egress policy is whatever the binary defaults to."
            exit 1
          fi
          case "$out" in
            *af-proxy*) echo "the sidecar refuses with no policy: $out" ;;
            *)
              echo "::error::that container is not the sidecar. It said: $out"
              exit 1
              ;;
          esac

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # No moving tag. The reference IS the content, so there is nothing for a
      # `latest` to mean here and a floating tag would be a way to serve a
      # sidecar that does not match its source.
      - name: Push both architectures
        env:
          REF: ${{ steps.image.outputs.published }}
          LABEL: ${{ steps.image.outputs.label }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "${LABEL}=${DIGEST}" \
            --tag "$REF" \
            --push \
            - < "$RUNNER_TEMP/sidecar-context.tar"

      # THE ASSERTION THAT IS NOT STRUCTURAL. Everything above this line is
      # about bytes on the runner. This is the path the customer takes: the
      # local copy is removed, the reference is pulled back out of the registry,
      # and the label has to survive the round trip. A push that produced a
      # manifest list with no linux/amd64 entry, or an authentication that
      # succeeded and wrote nothing, is green in every step above and red here.
      - name: Pulling it back is what a customer's first af up does
        env:
          REF: ${{ steps.image.outputs.published }}
          LABEL: ${{ steps.image.outputs.label }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          docker image rm -f "$REF" >/dev/null
          docker pull "$REF"
          got=$(docker image inspect -f "{{index .Config.Labels \"${LABEL}\"}}" "$REF")
          test "$got" = "$DIGEST" || {
            echo "::error::the published $REF declares ${got:-nothing}, not $DIGEST"
            exit 1
          }
          # Both architectures are in the manifest list the engine will meet.
          # Read from the registry rather than from the local image, because the
          # local one is whichever leg this runner pulled.
          manifest=$(docker buildx imagetools inspect --raw "$REF")
          for want in amd64 arm64; do
            case "$manifest" in
              *"\"architecture\":\"$want\""*) echo "linux/$want is published" ;;
              *)
                echo "::error::the published manifest list has no linux/$want entry, so every engine"
                echo "::error::on that architecture falls back to compiling the sidecar."
                exit 1
                ;;
            esac
          done
          {
            echo "### The egress sidecar image"
            echo ''
            echo "Published \`$REF\`, linux/amd64 and linux/arm64, declaring sidecar source \`$DIGEST\`."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [build, sidecar]
    runs-on: ubuntu-latest
    # The only job that writes anything back to the repository.
    permissions:
      contents: write
      # Keyless signing below. cosign asks GitHub for a short lived OIDC token,
      # proves to Sigstore that this workflow in this repository produced these
      # files, and gets a certificate that lives for the length of the signing
      # operation. The point of doing it this way is that there is no signing
      # key: nothing to store, nothing to leak, nothing to rotate, and nothing
      # for a maintainer to be careless with.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { path: dist, merge-multiple: true }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Third party notices
        # Generated from what is actually linked rather than maintained by
        # hand. MIT does not require a NOTICE file, but the Apache licensed
        # dependencies still require attribution, and a stale list attributes
        # the wrong people.
        #
        # This overwrites the committed copy, so what a release publishes is the
        # fresh one. For a long time this was the only place the generator ran,
        # which left the committed file free to drift and it did, 49 modules
        # behind, and that copy is the one a reader of the repository opens.
        # ci.yml now regenerates it on every pull request and fails on a
        # difference. This step stays anyway, because a release that depends on
        # a gate having run is a release that ships whatever the gate missed.
        #
        # Fresh was also not the same as complete. This runs on ubuntu and the
        # generator used to answer for the platform it stood on, so it listed
        # the 88 modules linked on linux while the two darwin archives in the
        # same release linked 89. It now takes the union over this workflow's
        # own build matrix.
        run: go run ./tools/notices -out THIRD_PARTY_NOTICES.md

      - name: Checksums
        run: |
          cd dist
          cat *.sha256 > checksums.txt
          rm -f *.sha256

      - name: Unpack the archives so the bill of materials can read the binaries
        # This step is the fix for a release that would have shipped a bill of
        # materials describing nothing.
        #
        # The previous version pointed syft at dist/, and by the time this job
        # runs dist/ holds four .tar.gz files and a checksums file. syft's
        # directory cataloger does not open archives, so it walked past every
        # one of them and emitted a valid SPDX 2.3 document containing exactly
        # one package: the directory itself. Zero Go modules. That document
        # would have been signed and published, and every step was green,
        # because every step did what it was asked.
        #
        # Measured on this repository at e564cb9: syft over dist/ finds 1
        # package, syft over these extracted binaries finds 363.
        run: |
          mkdir -p unpacked
          for archive in dist/*.tar.gz; do
            tar -C unpacked -xzf "$archive"
          done
          find unpacked -name af -type f | sort

      - name: Software bill of materials
        # Read out of the built binaries rather than generated from go.mod.
        # Go records the module graph it actually linked inside the binary, so
        # reading the artifact answers "what shipped", while reading go.mod
        # answers "what we asked for". Those differ whenever a build constraint,
        # a replace, or a pruned dependency changes what the linker kept, and
        # the one a person downloading a release needs is the first.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: unpacked
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: The bill of materials describes this release
        # An SBOM nobody validates is decoration, and a signed one that lists
        # nothing is worse, because it carries the authority of the signature.
        # This asks two questions the generator cannot answer about itself: is
        # the document SPDX, and does it record the SHA256 of every binary that
        # actually ships. The empty document above passes the first and fails
        # the second, which is why both are here.
        run: go run ./tools/sbomcheck -sbom dist/sbom.spdx.json -artifacts unpacked

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned, for the same reason every action above is pinned to a
          # commit. The installer's own default moves, and cosign v3 changed
          # what `sign-blob` produces: --output-signature and
          # --output-certificate are deprecated there and the command refuses
          # to run without --bundle. An unpinned version is a release that
          # starts failing, or starts producing a different artifact shape,
          # on a day nobody touched this file.
          cosign-release: v3.0.6

      - name: Sign the checksums and the bill of materials
        # Signing the checksum file rather than each archive is deliberate and
        # is not a shortcut: checksums.txt names every artifact by hash, so one
        # signature over it covers all of them, and verifying is two steps a
        # person can actually follow. Signing eight archives separately gives
        # somebody eight things to check and so gets checked zero times.
        #
        # The bundle is signed separately because it is not listed in
        # checksums.txt.
        #
        # A .sigstore.json bundle rather than a separate .sig and .pem. That is
        # cosign v3's only output for sign-blob, and it is the better artifact
        # anyway: the signature, the certificate and the transparency log entry
        # travel together, so a person verifying has one file to fetch instead
        # of three to keep in step.
        run: |
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt
          cosign sign-blob --yes \
            --bundle dist/sbom.spdx.json.sigstore.json \
            dist/sbom.spdx.json

      - name: The signature verifies, and a changed byte does not
        # The assertion that matters, and the one that was missing. A signature
        # nobody checks proves nothing, and a verification that only ever sees
        # good input proves less than nothing: it would pass just as happily
        # against a command that accepted everything.
        #
        # So both controls run here. The positive one is the exact command the
        # release notes tell a user to run, with the identity bound, so the
        # published instructions are tested rather than described. The negative
        # one flips a single byte and requires the verification to fail. If
        # cosign ever stops rejecting a tampered blob, this release does not
        # publish.
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail

          for blob in checksums.txt sbom.spdx.json; do
            echo "verifying $blob"
            cosign verify-blob \
              --bundle "dist/$blob.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "dist/$blob"
          done

          # One byte, in a copy, so the published file is untouched.
          cp dist/checksums.txt tampered.txt
          printf 'x' >> tampered.txt
          if cosign verify-blob \
              --bundle dist/checksums.txt.sigstore.json \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              tampered.txt 2>/dev/null; then
            echo "cosign accepted a file that does not match its signature." >&2
            echo "Every verification instruction we publish is worthless while that is true." >&2
            exit 1
          fi
          echo "a tampered checksums.txt was rejected, as it must be"
          rm -f tampered.txt

          # And the other half of what a user is told to do: the checksums
          # actually match the archives they name. checksums.txt is only worth
          # signing if it is true.
          (cd dist && sha256sum --check --ignore-missing checksums.txt)

      - name: The release notes
        # Written by hand, and this is also the step that refuses to publish a
        # release with nothing to say. generate_release_notes was a list of
        # merged pull requests, which over this release span is a wall and is
        # the first thing somebody deciding whether to buy this reads.
        #
        # The preamble lives inside this command rather than in a `body:` block
        # below, and that is not tidying. action-gh-release tries `body_path`
        # first and falls back to `body` only when the path cannot be read, so
        # the moment a notes file reads successfully the block is dropped,
        # silently, with this step still green. The verification instructions
        # would have vanished from every release note and nothing would have
        # gone red. One emitter, no second copy to lose.
        run: |
          go run ./tools/relnotes \
            -tag "$GITHUB_REF_NAME" \
            -repo "${{ github.repository }}" \
            -ref "${{ github.ref }}" \
            -out release-notes.md .
          echo "--- notes ---"
          cat release-notes.md

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/sbom.spdx.json
            dist/sbom.spdx.json.sigstore.json
            THIRD_PARTY_NOTICES.md
          # Without this the action WARNS on a pattern that matches nothing and
          # publishes anyway, green. That is the one failure this pipeline is
          # not allowed to have: a release short an asset looks finished, and
          # nobody goes looking for a file they were never told was missing.
          # Read out of the action's own src/run.ts at the pinned commit, where
          # an unmatched pattern is a console.warn unless this is set.
          fail_on_unmatched_files: true
          # Deliberately off. The generated notes are the merged pull request
          # list, and the step above produces the notes a person should read.
          generate_release_notes: false
          body_path: release-notes.md

      - name: Move the major tag to this release
        # `uses: antifailure/antifailure@v1` is the line every customer's
        # workflow carries, once in their own file for the reusable workflow
        # and once inside it for the action. A tag that never moves is a
        # customer pinned to the first release forever, with no line in their
        # repository to change, so v1 is a moving tag and this is what moves
        # it: after the release exists, and only then, because a major tag
        # pointing at a commit whose release failed to publish is a customer
        # running a build that has no release notes and no signed checksums.
        #
        # Only a final release moves it. A prerelease tag such as v1.3.0-rc.1
        # still publishes above, and must not carry every customer with it,
        # so anything with a suffix is refused here rather than filtered in
        # the trigger, where a glob cannot say "no suffix". The push is a
        # force push by design: the tag is meant to move, and it moves to the
        # same commit the checksums above were signed for.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$TAG is not a final release, so the major tag stays where it is."
            exit 0
          fi
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "$major now names $GITHUB_SHA, the commit $TAG was released from."
