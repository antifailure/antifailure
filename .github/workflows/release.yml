name: Release

# Tags only. A release built from a branch is a release nobody can reproduce.
on:
  push:
    tags: ['v*']

# Read by default. The one job that publishes asks for write, and nothing else
# gets it. Four of the five jobs here only compile a binary, and a compiler
# with permission to create a release is permission nobody needed to grant.
permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: darwin, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: linux,  arch: amd64 }
          - { os: linux,  arch: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Build
        working-directory: engine
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          # Static, so the binary runs on a distroless image and on a
          # distribution whose libc is older than the builder's.
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Full import paths, not bare main. The variables live in
          # internal/cli, and the linker accepts a -X for a symbol it cannot
          # find without saying anything: this said main.version for one
          # release, every flag was a no-op, and the published binary reported
          # itself as "dev". tools/ldcheck runs in CI to keep that from
          # recurring.
          # Written out in full rather than through a shell variable, so that
          # tools/ldcheck can read them. A check a one line change can defeat
          # is not worth having.
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/antifailure/antifailure/engine/internal/cli.Version=$version \
              -X github.com/antifailure/antifailure/engine/internal/cli.Commit=$GITHUB_SHA \
              -X github.com/antifailure/antifailure/engine/internal/cli.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "../dist/af" ./cmd/af

      - name: Package
        # The runner travels with the binary rather than being fetched later,
        # so the source a release was tested with is the source it runs.
        run: |
          name="antifailure_${GITHUB_REF_NAME#v}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p "stage/$name/runner"
          cp dist/af "stage/$name/af"
          cp -R runner/src runner/package.json runner/tsconfig.json runner/README.md "stage/$name/runner/"
          cp LICENSE README.md "stage/$name/"
          tar -C stage -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The only job that writes anything back to the repository.
    permissions:
      contents: write
      # Keyless signing below. cosign asks GitHub for a short lived OIDC token,
      # proves to Sigstore that this workflow in this repository produced these
      # files, and gets a certificate that lives for the length of the signing
      # operation. The point of doing it this way is that there is no signing
      # key: nothing to store, nothing to leak, nothing to rotate, and nothing
      # for a maintainer to be careless with.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist, merge-multiple: true }

      - name: Third party notices
        # Generated from what is actually linked rather than maintained by
        # hand. MIT does not require a NOTICE file, but the Apache licensed
        # dependencies still require attribution, and a stale list attributes
        # the wrong people.
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - run: go run ./tools/notices > THIRD_PARTY_NOTICES.md

      - name: Checksums
        run: |
          cd dist
          cat *.sha256 > checksums.txt
          rm -f *.sha256

      - name: Software bill of materials
        # Read out of the built binaries rather than generated from go.mod.
        # Go records the module graph it actually linked inside the binary, so
        # reading the artifact answers "what shipped", while reading go.mod
        # answers "what we asked for". Those differ whenever a build constraint,
        # a replace, or a pruned dependency changes what the linker kept, and
        # the one a person downloading a release needs is the first.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums and the bill of materials
        # Signing the checksum file rather than each archive is deliberate and
        # is not a shortcut: checksums.txt names every artifact by hash, so one
        # signature over it covers all of them, and verifying is two steps a
        # person can actually follow. Signing eight archives separately gives
        # somebody eight things to check and so gets checked zero times.
        #
        # The bundle is signed separately because it is not listed in
        # checksums.txt.
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt
          cosign sign-blob --yes \
            --output-signature dist/sbom.spdx.json.sig \
            --output-certificate dist/sbom.spdx.json.pem \
            dist/sbom.spdx.json

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/sbom.spdx.json
            dist/sbom.spdx.json.sig
            dist/sbom.spdx.json.pem
            THIRD_PARTY_NOTICES.md
          generate_release_notes: true
          # Prepended above the generated commit list. A signature nobody knows
          # how to check is decoration, so the instructions ship with the thing
          # they verify rather than in a documentation page a person would have
          # to know exists.
          body: |
            ### Verifying this release

            `checksums.txt` names every archive by hash, and it is signed, so
            checking the signature once covers all of them.

            ```sh
            cosign verify-blob \
              --certificate checksums.txt.pem \
              --signature checksums.txt.sig \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              checksums.txt

            sha256sum --check --ignore-missing checksums.txt
            ```

            There is no public key to fetch. The certificate records which
            workflow, in which repository, at which tag produced these files,
            and `--certificate-identity` is what makes the check mean
            something: without it you would be verifying that somebody signed
            this, rather than that we did.

            `sbom.spdx.json` lists what is inside the binaries, read out of the
            built artifacts rather than from `go.mod`. It is signed the same
            way, substituting its own `.pem` and `.sig`.

