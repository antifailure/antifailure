# A commit becomes a running deployment, or it does not move at all.
#
# THE SHAPE
#
#   merge to main  ->  gate  ->  build  ->  staging          (automatic)
#   push a v* tag  ->  gate  ->  build  ->  staging  ->  [approval]  ->  production
#
# Staging is not gated by a human because a gate a person clicks through fifty
# times a day is a gate nobody reads. Production is, and the approval lives in
# the `production` GitHub environment where the reviewer list is auditable
# rather than in an `if:` somebody can edit in the same pull request that
# deploys.
#
# WHY IT WAITS FOR CI RATHER THAN CHECKING ANYTHING ITSELF. CI already runs on
# this push and is the promise the repository makes about itself. Re-running the
# checks here would double the work and could disagree with the first run, and
# then nobody knows which verdict was real. So the gate job waits for CI's
# conclusion on this exact commit and refuses anything but success.
#
# The cost is real and was chosen deliberately: while main is red for a reason
# that has nothing to do with the control plane, staging does not move. Staging
# keeps serving the last green build, which is a working system, and the fix is
# to fix main.
#
# WHY OIDC. There is no Azure credential in this repository. The job exchanges a
# GitHub-signed token for an Azure one, scoped by the federated credential to
# `repo:antifailure/antifailure:environment:staging` (and :production), so a
# workflow running from a fork, a branch, or without the environment cannot get
# one at all. Nothing here has a lifetime longer than the job.
name: cd

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Where to deploy'
        required: true
        default: staging
        type: choice
        options: [staging, production]

# One deploy at a time, and never cancel one in flight.
#
# cancel-in-progress would be wrong here in a way it is not wrong for CI: a
# cancelled deploy is a half-applied one. It can be cancelled after the
# migration and before the traffic shift, which leaves the schema ahead of the
# running code with nothing left to finish the job.
#
# THE GROUP IS KEYED ON THE REF, AND A REF IS NOT A DEPLOYMENT TARGET. Two runs
# on different refs are in different groups and both deploy to the same app. On
# 2026-09-02 the v1.0.0 tag and the merge that produced the tagged commit were
# in flight together and both deployed staging. The per-environment guard that
# actually serializes a deploy is on the staging and production jobs below;
# this group keeps a single ref's runs in order.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/control-plane
  RESOURCE_GROUP: af-cp-centralus
  APP: afcp-app
  BOOTSTRAP_JOB: afcp-bootstrap
  MAINTENANCE_JOB: afcp-maintenance
  STAGING_URL: https://app.dev.antifailure.dev
  # Production, in its own resource group with its own everything. The names
  # come from `name = "afcpprod"` in production.tfvars, and the group is
  # separate on purpose: a blast radius that includes customers' control plane
  # is not worth what sharing one would save.
  PRODUCTION_RESOURCE_GROUP: af-cp-prod-centralus
  PRODUCTION_APP: afcpprod-app
  PRODUCTION_BOOTSTRAP_JOB: afcpprod-bootstrap
  PRODUCTION_MAINTENANCE_JOB: afcpprod-maintenance
  PRODUCTION_URL: https://app.antifailure.dev

jobs:
  # ---------------------------------------------------------------------------
  # Nothing deploys that would not have merged.
  # ---------------------------------------------------------------------------
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'antifailure/antifailure'
    permissions:
      contents: read
      actions: read
    steps:
      # WAIT FOR CI, DO NOT RE-RUN IT.
      #
      # The first version of this job ran `just gate` directly and failed with
      # exit 127 on half of it: `just gate` is a workstation command whose
      # recipes assume vale, lychee, cspell and an npm install in three
      # workspaces are already present. ci.yml does not use it for exactly that
      # reason -- it runs the underlying commands with per-job setup. Copying
      # the command without its prerequisites produced a gate that failed for
      # reasons unrelated to the commit, which is the least useful kind of red.
      #
      # Waiting is also the better design. CI already runs on this push. Running
      # it a second time here would double the work and, worse, could disagree
      # with the first run and leave nobody sure which verdict was real.
      #
      # The promise Vir chose holds either way: a red main does not reach
      # staging. It now holds by deferring to the check that already exists.
      - name: CI must be green on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # 115 attempts at 20s is about 38 minutes, sized against this job's
          # own timeout-minutes: 45 rather than picked. The previous 60 was 20
          # minutes, less than half that timeout, and CI on this repository does
          # not finish in 20 minutes when the queue is busy: the engine job alone
          # runs about 14 minutes and control plane is similar, and they queue
          # behind every other branch in flight.
          #
          # The failure that earned this: c5ae4385 merged, the marketing site
          # deployed, and this gate gave up at 05:28 while CI was still running
          # engine and control plane with every other job already green. CI then
          # concluded success. Nothing was wrong with the commit and nothing
          # reached staging, and the only way it moves after that is somebody
          # noticing a red check and re-running the workflow by hand.
          #
          # Timing out and being red are different states and only one of them
          # is a verdict about the commit. This keeps refusing a CI that
          # concluded anything but success, which is the deliberate part, and
          # stops calling a slow queue a failed one.
          echo "waiting for CI on $SHA"
          for attempt in $(seq 1 115); do
            runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.name=="CI")] | .[0] | "\(.status) \(.conclusion // "-") \(.html_url)"' 2>/dev/null || true)
            if [ -z "$runs" ] || [ "$runs" = "null" ]; then
              echo "attempt $attempt: no CI run for this commit yet"
              sleep 20
              continue
            fi
            status=$(cut -d' ' -f1 <<<"$runs")
            conclusion=$(cut -d' ' -f2 <<<"$runs")
            url=$(cut -d' ' -f3 <<<"$runs")
            echo "attempt $attempt: CI is $status ($conclusion) $url"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI is green on $SHA: $url" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              # Deliberately fatal. Staging keeps serving the last green build,
              # which is a working system, and the fix is to fix main.
              echo "::error title=CI is not green::CI concluded '$conclusion' on $SHA. Nothing is deployed. $url"
              exit 1
            fi
            sleep 20
          done
          echo "::error title=CI did not finish::No CI conclusion for $SHA within the budget. Nothing is deployed."
          exit 1

  # ---------------------------------------------------------------------------
  # One image, referenced everywhere afterwards by DIGEST.
  #
  # A tag can be moved between the build and the deploy, and between staging and
  # production. A digest cannot, so the thing production promotes is provably the
  # thing staging tested.
  # ---------------------------------------------------------------------------
  build:
    name: build
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        id: push
        run: |
          set -euo pipefail
          tag="cd-${GITHUB_SHA::12}"
          docker build \
            -f deploy/docker/control-plane.Dockerfile \
            -t "${IMAGE}:${tag}" \
            --build-arg AF_VERSION="${GITHUB_REF_NAME}" \
            --build-arg AF_COMMIT="${GITHUB_SHA}" \
            --build-arg AF_BUILD_DATE="$(git show -s --format=%cI HEAD)" \
            .
          docker push "${IMAGE}:${tag}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${tag}")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=${digest}" >> "$GITHUB_OUTPUT"
          echo "built ${digest}" >> "$GITHUB_STEP_SUMMARY"

      # The image has to be able to do what the deployment depends on before it
      # is allowed near a running system. Same two checks as
      # control-plane-image.yml, because a deploy that skipped them would be a
      # weaker check than a pull request.
      - name: The entrypoints exist and refuse cleanly
        run: |
          set -euo pipefail
          img="${IMAGE}:cd-${GITHUB_SHA::12}"
          test "$(docker run --rm --entrypoint sh "$img" -c 'ls bootstrap.mjs maintenance.mjs | wc -l')" = "2"
          out="$(docker run --rm "$img" node bootstrap.mjs 2>&1)" && { echo "FAIL: bootstrap exited 0 with no credential"; exit 1; }
          case "$out" in
            *AF_MIGRATION_DATABASE_URL*) echo "bootstrap refuses and names the variable" ;;
            *) echo "FAIL: bootstrap said: $out"; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # Staging. Automatic, on every merge to main.
  # ---------------------------------------------------------------------------
  staging:
    name: staging
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch' || inputs.environment == 'staging'
    # ONE DEPLOY AT A TIME TO THIS APP, WHATEVER REF ASKED FOR IT.
    #
    # The workflow group above cannot do this: it is keyed on github.ref, so a
    # tag run and a branch run are in different groups and deploy together. That
    # happened. Both created a revision on afcp-app within a minute, and the
    # first one to finish reaped the other one's live revision out from under it.
    #
    # Deliberately not keyed on anything: this is the name of the environment,
    # and the point is that every run that deploys staging queues on it.
    #
    # cancel-in-progress: false, for the reason the workflow group gives. A
    # cancelled deploy is a half-applied one, and this job migrates before it
    # moves traffic. The cost of queueing rather than cancelling is that a third
    # run arriving while one is queued replaces the queued one, so a commit can
    # be skipped over. That is the right trade for staging: the run that does
    # deploy carries the skipped commit as an ancestor, and gate has already
    # refused anything CI did not pass.
    concurrency:
      group: cd-deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://app.dev.antifailure.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The boundary, enforced rather than trusted. azguard refuses any command
      # whose resource group is not one this project owns, and it fails closed.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: The target group is ours
        run: GOTOOLCHAIN=local go run ./tools/azguard check --tags "${RESOURCE_GROUP}"

      # The digest goes through the environment rather than being interpolated
      # into the script text. It comes from `docker inspect` and is therefore
      # trustworthy today, but a template expansion inside `run:` is a shell
      # injection the moment the value's provenance changes, and the provenance
      # of a value is not visible at the place it is used.
      - name: Deploy
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          deploy/cd/deploy.sh \
            "${RESOURCE_GROUP}" "${APP}" "${BOOTSTRAP_JOB}" "${MAINTENANCE_JOB}" \
            "${IMAGE_DIGEST}" "${GITHUB_SHA}" "${STAGING_URL}"

      - name: What is serving
        if: always()
        run: |
          {
            echo "### staging"
            echo
            echo '```'
            curl -sS -m 10 "${STAGING_URL}/readyz" || echo "no answer from ${STAGING_URL}/readyz"
            echo
            echo '```'
            az containerapp ingress traffic show -n "${APP}" -g "${RESOURCE_GROUP}" -o table || true
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Production. Only on a version tag, and only after somebody approves it.
  #
  # The approval is a deployment protection rule on the `production` environment,
  # so this job does not start until a reviewer clicks it. It deploys the same
  # DIGEST staging tested, which is the entire reason build outputs a digest.
  #
  # WHY THE CONDITION NAMES EVERY DEPENDENCY'S RESULT INSTEAD OF SAYING WHEN.
  #
  # It used to say only when: a version tag, or a manual run asking for
  # production. That read correctly and gave this job two ways in, and one of
  # them could never be taken. A job with `needs` and no status function in its
  # `if` gets an implicit success(), and GitHub skips a job whose needed job was
  # skipped, not only one whose needed job failed. `staging` skips itself on a
  # manual run asking for production, which is right, so `production` was
  # skipped with it. Nobody had noticed because no manual run has ever been
  # started: the only escape hatch for shipping production without cutting a tag
  # has never worked, and would have been reached for on a day somebody needed
  # it and could not wait.
  #
  # So the guard is spelled out. `build` still has to have succeeded. `staging`
  # has to have succeeded OR to have been deliberately skipped, which is the one
  # case above and not a case where staging failed. The tag path is unchanged:
  # staging runs on a tag push, so `success` is the only result that lets
  # production through.
  # ---------------------------------------------------------------------------
  production:
    name: production
    runs-on: ubuntu-latest
    needs: [build, staging]
    timeout-minutes: 30
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (needs.staging.result == 'success' || needs.staging.result == 'skipped')
      && (startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    # The same guard as staging, on its own environment. Production deploys are
    # rare enough that this has never collided, which is not a reason to leave
    # the one place it would matter most without it.
    concurrency:
      group: cd-deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://app.antifailure.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # REFUSES UNTIL PRODUCTION EXISTS, BY ASKING RATHER THAN BY ASSERTING.
      #
      # This step used to be an unconditional `exit 1` saying production
      # infrastructure did not exist. That was true and it was also a thing
      # somebody would have to remember to delete, under pressure, on the day of
      # the first release. Asking Azure instead means the refusal stops the
      # moment the apply has happened and no workflow edit is needed to make it
      # stop.
      #
      # infra/terraform/stacks/control-plane/production.tfvars is the apply.
      # docs/src/content/docs/self-hosting/production.md is the order it and the
      # things Terraform cannot do have to happen in.
      - name: Production infrastructure exists
        run: |
          if ! az containerapp show \
                -n "${PRODUCTION_APP}" -g "${PRODUCTION_RESOURCE_GROUP}" \
                --query id -o tsv >/dev/null 2>&1; then
            echo "::error title=No production environment::${PRODUCTION_APP} does not exist in ${PRODUCTION_RESOURCE_GROUP}. The deploy path is wired end to end, approval, OIDC and the digest staging tested, and the infrastructure has not been applied. See docs/src/content/docs/self-hosting/production.md."
            exit 1
          fi

      # The boundary, enforced rather than trusted, exactly as staging does it.
      # azguard refuses any command whose resource group is not one this project
      # owns, offline, and it fails closed.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: The target group is ours
        run: GOTOOLCHAIN=local go run ./tools/azguard check --tags "${PRODUCTION_RESOURCE_GROUP}"

      # The same digest staging tested, which is the entire reason build outputs
      # one. A tag can be moved between the two deploys and a digest cannot.
      - name: Deploy
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          deploy/cd/deploy.sh \
            "${PRODUCTION_RESOURCE_GROUP}" "${PRODUCTION_APP}" \
            "${PRODUCTION_BOOTSTRAP_JOB}" "${PRODUCTION_MAINTENANCE_JOB}" \
            "${IMAGE_DIGEST}" "${GITHUB_SHA}" "${PRODUCTION_URL}"

      - name: What is serving
        if: always()
        run: |
          {
            echo "### production"
            echo
            echo '```'
            curl -sS -m 10 "${PRODUCTION_URL}/readyz" || echo "no answer from ${PRODUCTION_URL}/readyz"
            echo
            echo '```'
            az containerapp ingress traffic show -n "${PRODUCTION_APP}" -g "${PRODUCTION_RESOURCE_GROUP}" -o table || true
          } >> "$GITHUB_STEP_SUMMARY"
