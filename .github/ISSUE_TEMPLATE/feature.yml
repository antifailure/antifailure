name: Feature request
description: Something Antifailure should do and does not.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does Antifailure stop you? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have checked the roadmap in docs/plan/STATUS.md and the open issues.
          required: true
