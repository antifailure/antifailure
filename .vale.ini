; Prose style for the documentation.
;
; The Google developer documentation style is the base: it is opinionated
; about the things that make technical writing hard to read, and it is a
; published standard rather than one person's taste.
;
; Run with: just vale

StylesPath = tools/docs/styles
MinAlertLevel = error
Packages = Google

; Only the pages a reader sees. docs/plan is the build log for this
; repository, and THIRD_PARTY_NOTICES is generated from package metadata.
[*.md]
BasedOnStyles = Vale, Google, Antifailure

; Spelling is cspell's job, with the project dictionary in
; tools/docs/dictionary.txt. Two spell checkers means two word lists, and the
; day they disagree somebody adds a word to the wrong one and the build stays
; red for a reason nobody can find.
Vale.Spelling = NO

; Google's style is American and puts commas and periods inside quotation
; marks. This documentation quotes exactly what was said and puts the sentence's
; own punctuation outside, which is what makes 'an explicit "none, and here is
; why".' mean the thing it means. Moving the period inside would change what is
; being quoted.
Google.Quotes = NO

; The generated reference pages are rendered from the schemas and the command
; tree. A style rule there would be answered by rewriting a machine's output,
; which is not writing.
[docs/src/content/docs/reference/{cli,errors,schemas/*}.md]
BasedOnStyles = Antifailure
