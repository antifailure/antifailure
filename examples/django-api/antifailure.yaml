version: 1
name: django-orders

# The third example, and the third shape. examples/go-api is a compiled binary,
# examples/next-app is a framework with a build step and server rendered pages,
# and this is a framework whose own migration system owns the schema. That is
# the part worth watching here: `manage.py migrate` runs against the branch,
# so a pull request that adds a field gets the column and nobody else's
# environment does.

services:
  - name: web
    kind: web
    path: .
    port: 8000
    health_path: /health
    # Django's own migrations, run by Django's own command. There is no psql in
    # this image and no SQL file to point one at, which is the whole point: the
    # engine runs whatever the framework already uses.
    migrate: "python manage.py migrate --noinput"
    build:
      strategy: dockerfile
      dockerfile: Dockerfile
      # What this build reaches, written down. Declared rather than enforced in
      # this release: the engine validates the list and shows it in af explain,
      # and the local builder does not yet seal a build. It is the record of
      # what the build needs, not a control you can rely on.
      allow_hosts:
        - pypi.org
        - files.pythonhosted.org
        - deb.debian.org
    env:
      # DATABASE_URL is not declared here on purpose. The database block below
      # injects it, and declaring it as well makes the secret resolver demand a
      # value nobody has to supply.
      - name: PORT
        value: "8000"

database:
  provider: docker
  version: 17
  masking_rules: masking.yaml
  golden:
    schedule: "0 3 * * *"
    max_age: 168h
    retain: 3

egress:
  # This application calls nothing, and the policy says so rather than leaving
  # a door open in case it one day does. For a rule that is used, read
  # ../go-api, which takes a payment through api.stripe.com answered by the
  # pack that ships with the engine.
  default: block

personas:
  # One, and it never signs in. Django's own admin is not installed here and
  # this service has no sign in of its own: every route is public, which is the
  # whole of its access model. `login: none` is how a manifest says so, and it
  # is what sends the agent straight to the workflow's start path instead of
  # hunting for a form that does not exist.
  - name: analyst
    email: analyst@example.test
    role: customer
    login: none

# What the agent does here, and what a browser can honestly do to an API.
#
# This service answers JSON and serves no HTML, so there is no form to fill and
# no button to press. The browser renders the response as text and the agent
# reads it, which makes a workflow here a read and a judgement rather than a
# drive. Writing one that claimed to place an order through a page that does
# not exist would be a test of nothing: it would come back blocked forever
# while looking like a feature.
#
# The expectations name words that are in the response rather than sentences
# about the product. Without a model key the runner checks them against the
# text on the page, and a sentence like "the totals are right" shares no word
# with a JSON body, so it can be neither confirmed nor contradicted and the run
# comes back unverified: honest, and useless.
workflows:
  - name: read-what-each-customer-has-spent
    description: >-
      As the analyst, open the customer list and check that it carries the
      customer who has ordered nothing and the amount that only exists once
      the aggregate has crossed the foreign key.
    persona: analyst
    start_path: /customers
    expect:
      # A customer with no orders at all, which is the row that exercises the
      # branch where Sum returns null and the view has to answer 0 rather than
      # nothing.
      - "Alan Turing"
      # Katherine's one order is 47500 cents, and that number reaches the page
      # only when the aggregate crossed customers.id to orders.customer_id.
      # Masking rewrites both sides and `link: customer` in masking.yaml is
      # what keeps them together; break that and every customer reports zero
      # spent, the expectation stops matching, and the run stops passing. That
      # is the failure this example exists to make visible.
      #
      # Written as words rather than as the JSON: the checker takes the
      # meaningful words out of an expectation and looks for each of them in
      # the page's text, so this asks for "spent" and for "47500", both of
      # which `"spent_cents": 47500` contains. An expectation is a sentence for
      # a person, and a model key reads it as one.
      - "spent 47500"
    tags: [smoke]
