version: 1
name: orders-api

# The whole configuration surface for this example, with nothing configured
# anywhere else. Read it top to bottom: what runs, where the data comes from,
# what it may reach, who the agents are, and what they do.

services:
  - name: api
    kind: web
    path: .
    port: 3000
    health_path: /health
    # Migrations run before the service starts, against the branch rather than
    # the golden, so a pull request that adds a column gets it and nobody
    # else's environment does.
    migrate: "psql $DATABASE_URL -v ON_ERROR_STOP=1 -f migrations/0001_init.sql"
    build:
      strategy: dockerfile
      dockerfile: Dockerfile
      # What this build reaches, written down. Declared rather than enforced in
      # this release: the engine validates the list and shows it in af explain,
      # and the local builder does not yet seal a build. It is the record of
      # what the build needs, not a control you can rely on.
      allow_hosts:
        - proxy.golang.org
        - sum.golang.org
        - dl-cdn.alpinelinux.org
    env:
      # DATABASE_URL is not declared here on purpose. The database block below
      # injects it, and declaring it as well makes the secret resolver demand
      # a value nobody has to supply. A real run refuses with AF-SEC-001, which
      # is how this example was found to be wrong.
      - name: PORT
        value: "3000"

database:
  provider: docker
  version: 17
  masking_rules: masking.yaml
  golden:
    # Refreshed nightly and never used past a week. A golden older than that
    # is a copy of a schema that has moved on, and branching from it produces
    # migration failures that look like application bugs.
    schedule: "0 3 * * *"
    max_age: 168h
    retain: 3

egress:
  # Nothing reaches the internet unless it is named here.
  #
  # mock, so that this example runs with nothing configured: the Stripe pack
  # ships with the engine and answers from recorded responses. One line turns
  # it into the stronger thing, once you have a test key to put in the store:
  #
  #     mode: sandbox
  #     credential: STRIPE_SECRET_KEY
  #
  # Sandbox mode gives the container a placeholder and has the proxy substitute
  # the real key on the way out, so the payment path runs and the key is never
  # inside the environment.
  default: block
  rules:
    - host: api.stripe.com
      mode: mock
      note: "payment intents, answered from the pack that ships with the engine"

personas:
  - name: returning-customer
    email: ada@example.test
    role: customer
    # none, because this service is an API and has no sign in page. It said
    # `password` until `af ci` was actually run against it, and every run came
    # back blocked with "locator.fill: Timeout 10000ms exceeded, waiting for
    # getByLabel(/^(email|email address|e-mail|username or email)$/i)": the
    # agent was looking for a login form on a service that serves JSON. A
    # persona that cannot sign in blocks its workflow forever, and blocked does
    # not count against a change, so it would have sat there looking like a
    # feature.
    #
    # `none` then had a second cost, found the same way. The engine provisioned
    # every persona before the agents ran, and provisioning insisted on
    # somewhere to write the account, so this example refused with "no users
    # table could be found" against a schema of customers and orders. A persona
    # that never signs in has no account to create, and the engine knows that
    # now, so nothing here has to invent a users table to satisfy it.
    login: none

# What the agents do, and what they deliberately do not do here.
#
# This service answers JSON and serves no HTML at all, so there is no form for
# an agent to fill and no button for it to press. The browser renders the
# response as text and the agent reads it, which makes a workflow here a read
# and a judgement rather than a drive. That is the honest shape for an API, and
# writing a workflow that claimed to place an order through a page that does
# not exist would be a test of nothing: the run would come back blocked forever
# while looking like a feature. The write path is covered below by the oracle
# probe named place-an-order, which sends the POST, and by the invariants,
# which then ask the data whether it survived.
#
# The expectations name words that are actually in the response. Without a
# model key the runner checks them against the text on the page, and a sentence
# about the product ("the customer list is not empty") shares no word with a
# JSON body, so it can be neither confirmed nor contradicted and the run comes
# back unverified. That is the honest answer and not a useful one. This example
# said exactly that until somebody ran it.
workflows:
  - name: read-the-customer-list
    description: >-
      As the returning customer, open the customer list and check that both
      seeded customers are in it, each with the name the branch holds.
    persona: returning-customer
    start_path: /customers
    expect:
      - "Ada Lovelace"
      - "Grace Hopper"
    tags: [smoke]

# Run this change beside the version it replaces, on the same data, and report
# what the two did differently.
#
# The probes are written down rather than discovered because both versions have
# to receive the same bytes in the same order: the agents above decide their
# next step from what is on the screen, so two runs of one workflow send two
# different request sequences and a comparison of those compares the agent with
# itself.
oracle:
  # The merge base, so the comparison does not change when somebody else lands a
  # commit on main halfway through a review.
  baseline: merge_base
  probes:
    - name: health
      path: /health
    - name: list-customers
      path: /customers
    - name: place-an-order
      method: POST
      path: /orders
      headers:
        content-type: application/json
      body: '{"customer_id": 1, "total_cents": 2599}'
    # The refusal is compared too. A change that starts accepting an order with
    # no total is a change worth seeing, and it is invisible to a probe plan
    # that only sends requests it expects to succeed.
    - name: refuse-an-order-with-no-total
      method: POST
      path: /orders
      headers:
        content-type: application/json
      body: '{"customer_id": 1, "total_cents": 0}'

# Asked of the branch after the workflows run, inside a READ ONLY transaction.
# An invariant holds when its statement returns NO ROWS, so these select the
# violating rows rather than counting them: count(*) returns one row saying
# zero, which is a row, which is a violation. Both of these said count(*) until
# something actually ran them.
invariants:
  - name: no-orphaned-orders
    description: >-
      Every order belongs to a customer that exists. This is the assertion the
      API cannot make from the outside, and the one a masking run that broke
      the join would fail.
    sql: |
      SELECT o.id AS order_id, o.customer_id
      FROM orders o
      LEFT JOIN customers c ON c.id = o.customer_id
      WHERE c.id IS NULL
      ORDER BY o.id

  - name: no-negative-totals
    description: An order's total is always positive, whatever the masking did to it.
    sql: |
      SELECT id AS order_id, total_cents FROM orders WHERE total_cents <= 0
