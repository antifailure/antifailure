# Copy this to .github/workflows/antifailure.yml.
#
# Two commands. af change reads the diff and says which checks will exercise
# what it touched, and af ci does the rest: it brings the environment up, runs
# the agents, writes the report, and tears down whatever happens, including on
# a failure and including on a cancelled job.
#
# The first exists so the second does not run on a change to a README. It says
# what it cannot see as well as what it can, and a path it does not recognise
# selects every check rather than none.
name: Antifailure

on:
  pull_request:
    # The default is opened, synchronize and reopened. ready_for_review is added
    # because a draft is not checked, so the moment it stops being one is the
    # moment the check should start, and without this line the workflow does not
    # run then. With a control plane that gap is visible rather than silent: it
    # opens a check on that commit and the check sits waiting for a run that is
    # never going to start, until it times out.
    types: [opened, synchronize, reopened, ready_for_review]

  # The hosted control plane's verbs. `environments.create`, `agents.run` and
  # `load.run` in the console do not run anything themselves: they ask GitHub to
  # run THIS workflow, on the branch the environment is on, with these inputs.
  # That is the only way a hosted button can start work without a masked copy of
  # your database and your credentials leaving your own cloud.
  #
  # Two things about this that are easy to get wrong and cost an afternoon.
  # Without this block a dispatch answers 404, indistinguishable from the App
  # not being installed. And GitHub reads the trigger list from the DEFAULT
  # branch, so adding this on a feature branch alone does nothing at all.
  #
  # Delete it if you do not use the hosted control plane. `af ci` on a pull
  # request needs none of it.
  workflow_dispatch:
    inputs:
      command:
        description: Which part to run
        required: true
        default: up
        type: choice
        # Verbs rather than the control plane's kind names, and the reason is
        # not aesthetic. GitHub reads this trigger definition from YOUR
        # DEFAULT BRANCH, and refuses a dispatch carrying a value the file does
        # not declare with a 422, which is indistinguishable from the file
        # being missing. Renaming these would make every copy of this file
        # already in the wild start failing on the two values that work today.
        #
        # So the verbs stay and the list grows. `scenario` and `explore` need
        # this newer file; `up`, `down`, `agents` and `load` work on the older
        # one too. af workload run accepts both spellings and its result says
        # which kind a verb resolved to.
        options:
          - up
          - down
          - agents
          - load
          - scenario
          - explore
      workflows:
        description: Comma separated names this workload selects. Empty means all of them.
        required: false
        default: ''
      duration:
        description: How long to send load for, as a Go duration such as 60s. observed_load only.
        required: false
        default: ''
      scale:
        description: Multiplier on production's rate. observed_load only.
        required: false
        default: ''
      seed:
        description: Makes two runs do the same thing. A number for load, free text for exploration.
        required: false
        default: ''
      concurrency:
        description: Ceiling on requests in flight. http_scenario only.
        required: false
        default: ''
      run_id:
        description: The control plane's identifier for this run, echoed back in the result.
        required: false
        default: ''

# One environment per branch. A second push replaces the first rather than
# running beside it and fighting it for container names.
concurrency:
  # github.head_ref is empty on anything that is not a pull request, so a
  # dispatch would otherwise share one group called `antifailure-` with every
  # other dispatch and cancel it.
  group: antifailure-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  # Only to leave the report. Nothing here needs write access to the code.
  pull-requests: write
  # The workflow's own identity, so this job can prove to the hosted control
  # plane which repository, run and commit it is, and get a credential scoped to
  # exactly that. There is no repository secret to paste and nothing here holds
  # a long lived token.
  #
  # GitHub does NOT grant this to a pull request job running on a fork, which is
  # what keeps a fork away from every secret: the exchange below simply fails
  # there, and the control plane says the commit needs a maintainer's approval.
  # Delete this line if you do not use the hosted control plane; nothing else
  # needs it.
  id-token: write

# The hosted control plane's address, as a repository variable rather than a
# secret, because it is a URL and not a credential. Unset means this repository
# does not use one: the two steps that talk to it are skipped and the job
# comments for itself, which is the self-hosted and no-account path.
#
# At the job level rather than on the step, because a step's own `env` block is
# not readable from that step's own `if`, so a step that both defines the
# variable and gates on it gates on an empty string forever.
env:
  AF_CONTROL_PLANE: ${{ vars.AF_CONTROL_PLANE }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # af change diffs against the merge base, and the default one commit
          # deep clone shares no history with the base branch, so there is no
          # merge base to find. Without this the analysis fails with AF-DET-010.
          fetch-depth: 0

      - name: Install Antifailure
        # Every step gets a fresh process and a fresh PATH, so the step that
        # runs af is not the one that installed it. The installer writes its
        # bin directory to GITHUB_PATH, which is the mechanism the runner reads
        # between steps, so `af` below resolves without a path or a flag.
        run: curl -fsSL https://antifailure.dev/install.sh | sh

      # Written to report.md so that a change needing no environment still
      # leaves a comment saying why. af ci overwrites the file when it runs.
      - name: Work out what this change touches
        id: change
        run: af change --write report.md

      - name: Run the check
        # A pull request that touches nothing any check exercises does not get
        # an environment. The output is the check being both selected by the
        # change and configured in the manifest.
        #
        # The condition is scoped to pull requests on purpose. A dispatch never
        # ran the analysis, so its outputs are empty, and gating on them alone
        # would silently skip the one job somebody pressed a button to get.
        if: github.event_name != 'pull_request' || steps.change.outputs.environment == 'true'
        # A pull request runs the whole check. A dispatch runs the part of it
        # the console asked for, because `af ci` would bring up an environment,
        # run the agents and tear it down again, which is not what somebody
        # pressing a button against a running environment asked for.
        #
        # The inputs go through the environment rather than into the script
        # text. A `${{ inputs.workflows }}` interpolated into a run block is a
        # shell injection from anybody who can dispatch this workflow, and a
        # YAML comment inside a run block is not a safe place to write one
        # either: the runner substitutes the expression before bash sees the
        # `#`, so an input carrying a newline escapes the comment.
        env:
          AF_COMMAND: ${{ inputs.command || 'ci' }}
          AF_WORKFLOWS: ${{ inputs.workflows }}
          AF_DURATION: ${{ inputs.duration }}
          AF_SCALE: ${{ inputs.scale }}
          AF_SEED: ${{ inputs.seed }}
          AF_CONCURRENCY: ${{ inputs.concurrency }}
          AF_RUN_ID: ${{ inputs.run_id }}
          # Bring your own key. Without one the agents still run; workflows
          # that need a page read come back unverified rather than guessed at.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only needed if the manifest sets a host to sandbox mode. It must be
          # a test credential; a live one is refused before anything starts.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          # Set this so every runner produces the same masking, and two
          # goldens can be compared. Left unset, each machine generates its own.
          AF_MASKING_KEY: ${{ secrets.AF_MASKING_KEY }}
        run: |
          set -euo pipefail
          case "$AF_COMMAND" in
            up)
              # No branch flag: the dispatch ran on the branch the environment
              # belongs to, so the checked out one is already right.
              af up
              ;;
            ci)
              af ci --report report.md --report-json report.json
              ;;
            down)
              # The real teardown, with an acknowledgement saying what was
              # removed and what is still standing. A row marked torn down
              # while the containers keep running is worse than a failure.
              af workload teardown --result teardown-result.json
              ;;
            *)
              # Everything else is a workload, and one command runs all four
              # kinds. This used to be a case arm per kind assembling its own
              # flags, and the three things wrong with that are the three
              # things this command adds.
              #
              # It dropped an input silently. A seed passed to a browser
              # workflow went nowhere, because af test has no --seed flag, and
              # nothing said so. af workload run refuses it by name instead.
              #
              # It produced no result. An exit code was everything anybody
              # learned, and an exit code cannot tell a run that failed from a
              # run that never measured anything. The document written below
              # carries what was measured, route by route, with the verdict of
              # every threshold.
              #
              # And it left nothing to reproduce. The result names the plain af
              # command that produces the same run on a laptop, which is the
              # only thing that makes a hosted number checkable.
              #
              # Values reach the script through the env block above rather
              # than through the script text, exactly as they did before. An
              # expression interpolated into a run block is substituted by the
              # runner before bash ever sees it, so a dispatch input carrying a
              # newline and a command would execute here.
              af workload run \
                --kind "$AF_COMMAND" \
                --select "$AF_WORKFLOWS" \
                --duration "$AF_DURATION" \
                --scale "$AF_SCALE" \
                --seed "$AF_SEED" \
                --concurrency "$AF_CONCURRENCY" \
                --run-id "$AF_RUN_ID" \
                --result workload-result.json
              ;;
          esac

      # The hosted control plane, if there is one.
      #
      # Two calls and no secret. The first proves this job's identity to the
      # control plane and gets back a credential good for THIS commit and
      # nothing else; the second posts the report. The control plane then
      # publishes one check run and maintains one comment, both fenced on the
      # commit, so a push that lands while this is running cannot end up
      # reporting the old commit's result under the new one.
      #
      # AF_CONTROL_PLANE unset skips both steps, and the job comments for itself
      # below. That is the self-hosted and no-account path and it stays working.
      - name: Tell the control plane what this commit did
        id: publish
        if: always() && env.AF_CONTROL_PLANE != '' && hashFiles('report.json') != ''
        env:
          # ACTIONS_ID_TOKEN_REQUEST_URL and _TOKEN are put in the environment by
          # the runner itself for any job with id-token: write, so they are used
          # below without being declared here. Declaring them would read them at
          # expression time, which is before the runner sets them.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # The identity token, asked for with the audience the control plane
          # expects. Without an audience GitHub mints one for the repository
          # owner's URL, which every workflow in the organization can get, and a
          # credential that any workflow can obtain is not a credential.
          identity=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=antifailure-control-plane" |
            sed -n 's/.*"value":"\([^"]*\)".*/\1/p')
          if [ -z "$identity" ]; then
            echo "GitHub would not mint a workflow identity token."
            echo "On a pull request from a fork it never will, which is deliberate."
            exit 0
          fi

          token=$(curl -sS -X POST "${AF_CONTROL_PLANE}/v1/pr/callback-token" \
            -H "Authorization: Bearer ${identity}" \
            -H 'content-type: application/json' \
            -d "{\"head_sha\":\"${HEAD_SHA}\"}" |
            sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$token" ]; then
            echo "The control plane did not issue a callback credential for ${HEAD_SHA}."
            exit 0
          fi

          # jq is on every GitHub-hosted runner. The report and the Markdown go
          # in as JSON values rather than being pasted into a string, because a
          # report contains quotes, newlines and backslashes and a hand built
          # body would be malformed on the first interesting run.
          jq -n --arg sha "$HEAD_SHA" \
                --rawfile markdown report.md \
                --slurpfile report report.json \
                '{head_sha: $sha, markdown: $markdown, report: $report[0]}' > payload.json

          curl -sS -X POST "${AF_CONTROL_PLANE}/v1/pr/report" \
            -H "Authorization: Bearer ${token}" \
            -H 'content-type: application/json' \
            --data-binary @payload.json
          echo "handled=true" >> "$GITHUB_OUTPUT"
      # Always, because the result of a failing workload is the one worth
      # reading, and because a cancelled or timed out run still writes one.
      - name: Keep the workload result
        if: always() && hashFiles('workload-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: workload-result
          path: workload-result.json
          retention-days: 30

      - name: Leave the report on the pull request
        # Always, because the report of a failing run is the one worth reading.
        #
        # Skipped when the control plane took the report, because it maintains a
        # comment of its own with the commit fenced into it, and two writers
        # sharing one pull request is two comments or one that flaps between two
        # commits' results.
        if: always() && hashFiles('report.md') != '' && steps.publish.outputs.handled != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = '<!-- antifailure:report -->';

            // Updated rather than added, or a pull request with twelve pushes
            // gets twelve comments and the twelfth is the only one that is true.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
