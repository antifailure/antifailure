version: 1
name: antifailure-control-plane

# This repository's own manifest.
#
# Every pull request against antifailure/antifailure gets a preview of the
# control plane built from this file: the API with its console, and a Postgres
# branched from a masked copy of the staging control plane. The agents
# then use it the way a customer does, and whatever that surfaces is a bug we
# fix rather than a report we file about somebody else.
#
# It is deliberately an ordinary manifest. There is no private syntax here, no
# flag that only works for us, and nothing configured outside this file. If a
# thing is awkward to express here, that is the product being awkward, and the
# fix is in the product.

services:
  # One service, and that is the point rather than a simplification.
  #
  # The control plane image serves its own console: the pages are a static
  # export copied into the image beside the API, handed out by the same
  # process on the same origin. A session is a SameSite=Lax cookie on that
  # origin, so splitting the console onto a second host would mean
  # SameSite=None and credentialed CORS on every endpoint, which is a wider
  # cross-site surface bought to move a dashboard.
  #
  # A second application was built here and then taken out. It worked, and
  # dogfooding it would still have been wrong: a preview that exercises a
  # console the product does not ship proves nothing about the console it
  # does. The environment runs the artifact a customer gets.
  - name: api
    kind: web
    path: web/apps/api
    port: 8080
    health_path: /health
    health_timeout: 180s
    # Migrations run against the branch rather than the golden, so a pull
    # request that adds a column gets it and nobody else's environment does.
    #
    # The personas that used to be created here have moved to `auth.adapter:
    # seed` below. Masking replaces every address with a synthetic one at
    # example.test, which is correct and leaves nobody to sign in as, so known
    # identities are added afterwards. The seed adapter is the right place for
    # that rather than this step, because it is the only place the password
    # the engine derived for a persona reaches the process that writes the
    # hash: the runner types that password, and the two agree only when one
    # process hands both out. This step went back to migrating and nothing
    # else once the operator persona needed a password.
    migrate: node bootstrap.mjs
    build:
      strategy: dockerfile
      dockerfile: deploy/docker/control-plane.Dockerfile
      allow_hosts:
        - registry.npmjs.org
    env:
      # AF_DATABASE_URL is not declared here on purpose. The database block
      # below injects it, and declaring it as well makes the secret resolver
      # demand a value nobody has to supply.
      - name: AF_PORT
        value: "8080"
      # Plain HTTP inside the environment, so a Secure cookie would never come
      # back. There is nothing to protect here that is not already inside a
      # network with no route out.
      - name: AF_INSECURE_COOKIES
        value: "1"
      # AF_APP_BASE_URL is not set here, and that is the point.
      #
      # The address this environment answers on is allocated at run time, so no
      # value written in a manifest can be right. The engine injects AF_ENV_URL
      # with the address of the first web service it declares, and the API
      # falls back to it. Hardcoding localhost:3100 here is what made an agent
      # read a sign in link out of the inbox and navigate to a port nothing
      # was listening on.
      # Signing in with a link, which is the only way in that works here:
      # github.com is not reachable from inside this environment, by design.
      # The mail is not delivered either. api.resend.com is captured below, so
      # the message lands in the inbox and the agent reads the link out of it.
      # AF_PUBLIC_URL is likewise left to the engine, for the same reason.
      - name: AF_MAIL_FROM
        value: Antifailure <sign-in@antifailure.test>
      - name: AF_RESEND_API_KEY
        # A placeholder, and it is enough. The request never leaves: the
        # sidecar answers api.resend.com with the provider's own success shape
        # and records the message. A real key here would buy nothing and would
        # be a real key inside a preview environment.
        value: capture-mode-needs-no-key
      # GitHub sign-in is configured so the process starts and the button
      # renders. Pressing it inside a preview reaches a host the policy blocks,
      # which is the correct behaviour and is what the workflow below asserts
      # by not using it.
      - name: AF_GITHUB_CLIENT_ID
        value: preview-has-no-github
      - name: AF_GITHUB_CLIENT_SECRET
        value: preview-has-no-github
      - name: AF_GITHUB_REDIRECT_URI
        value: http://localhost:3100/auth/github/callback
      # Billing is ON here, with three values that are plainly not credentials.
      #
      # This is what lets the launch-night workflow below press the button the
      # founder pressed. "Subscribe to team" renders only when billing is
      # configured: subscriptions.current returns configured=true from a
      # non-null Stripe config, and the Plan page shows the checkout button
      # only in that branch. stripeConfigFrom needs exactly these three set and
      # non-empty, and it never checks their shape, so strings that could not
      # be a real key are enough to turn the button on. None of these is a
      # Stripe credential.
      #
      # api.stripe.com is BLOCKED in the egress policy below, so the moment
      # the button is pressed the checkout mutation reaches a host the
      # sidecar refuses and fails inside the handler. That is the point of the
      # arrangement: the request gets PAST the /trpc transport gate and dies at
      # Stripe, which the control plane reports as an internal error. The 403
      # the transport gate returns when the operator cookie wrongly makes it
      # refuse a customer mutation is a different sentence, and the workflow's
      # expectation is the internal-error one, which the 403 path can never
      # produce. The rule exists for its webhook_path, not to open anything.
      # The operator portal's own database credential, so the portal WORKS in
      # a preview rather than answering "did not answer" after a sign-in.
      # Without it admin.* procedures refuse with PRECONDITION_FAILED, the
      # shell shows an error screen, and the runner never sees "Sign out"
      # after the operator signs in. bootstrap.mjs gives antifailure_admin the
      # password the URL carries at migrate time; the migrations created the
      # role with BYPASSRLS and its grants.
      #
      # No value here, on purpose, and not only because the validator refuses
      # a committed URL with a password in it. The value knows how the
      # database provider names things (the branch answers as `db`, the
      # database is `antifailure`), which is the run's business rather than the
      # manifest's, so the secrets subsystem supplies it: dogfood.yml sets it
      # for CI and a laptop exports it or puts it in .env. A run without it
      # fails at start rather than quietly bringing up a portal that cannot
      # sign anybody in:
      #   postgres://antifailure_admin:<any preview password>@db:5432/antifailure?sslmode=disable
      - name: AF_ADMIN_DATABASE_URL
      # The three Stripe variables, and why one of them is not a literal.
      #
      # They were three typed placeholders, and the webhook secret among them
      # could verify nothing: every event send_webhook_event delivers is
      # signed with the secret the engine derives for this environment, and a
      # placeholder typed here is by definition not that secret. So the api
      # registered /webhooks/stripe and refused every simulated delivery as
      # unsigned, and the billing orderings the product exists to rehearse, a
      # checkout completed before the organization existed, the same event
      # delivered twice, an updated subscription arriving after its deleted,
      # were rehearsed nowhere. A double purchase on the checkout return page
      # was found by reading code rather than by the product.
      #
      # The key is never presented to Stripe, because api.stripe.com is
      # blocked, and its value is a label. It is deliberately NOT in the
      # sk_test_ shape: a manifest is committed, and the validator refuses a
      # literal that looks like a credential, which is the right reflex even
      # when the value is made up.
      - name: AF_STRIPE_SECRET_KEY
        value: preview-billing-is-on-and-stripe-is-unreachable
      # The one value that has to be right. Every event send_webhook_event
      # delivers is signed with the secret the engine derives for this
      # environment, and the engine hands that secret to every service as
      # STRIPE_WEBHOOK_SECRET. The api reads it under its own name, so this is
      # a rename of the engine's value and not a value of its own: the two
      # sides agree by construction, and a secret typed here twice would be
      # the first thing to drift.
      - name: AF_STRIPE_WEBHOOK_SECRET
        from: STRIPE_WEBHOOK_SECRET
      # The price id the Team plan is sold under. Any string: the api
      # compares a subscription's price against this to decide which plan it
      # grants, so a simulated subscription event names it to be granted Team.
      - name: AF_STRIPE_PRICE_TEAM
        value: preview-team-price-with-no-stripe-behind-it

      # The GitHub App is configured for the same reason, so /webhooks/github
      # exists and an installation can be rehearsed. Nothing here can reach
      # GitHub: api.github.com is blocked below, and the App id was never
      # registered with GitHub.
      #
      # The key is supplied rather than written down, and it used to be written
      # down. This file carried a real 2048 bit RSA private key as a literal,
      # 2272 characters of it, base64 encoded rather than PEM because the
      # validator refuses a literal beginning with BEGIN and base64 walked past
      # it. The comment beside it said the key was a throwaway and that was
      # true; it was still a private key committed to a public repository, in
      # the one file this product holds up as an ordinary manifest. The
      # published schema says what a manifest is in as many words: it declares
      # the name and where the value comes from, and never the value itself,
      # which is why the file is safe to commit.
      #
      # So the engine makes one. A manifest declaring a webhook path for GitHub
      # is rehearsing a GitHub App, and GITHUB_APP_PRIVATE_KEY is generated for
      # the life of the environment and offered under the same condition as the
      # signing secret below. Nothing is configured outside this file, nothing
      # is committed, and af up on a laptop needs no setup it did not need
      # before.
      - name: AF_GITHUB_APP_ID
        value: "1"
      - name: AF_GITHUB_APP_PRIVATE_KEY
        from: GITHUB_APP_PRIVATE_KEY
      - name: AF_GITHUB_APP_WEBHOOK_SECRET
        from: GITHUB_WEBHOOK_SECRET

database:
  provider: docker
  version: 17
  url_env: AF_DATABASE_URL
  masking_rules: masking.yaml
  # Where the golden is copied from. Unset on a laptop, where `af golden
  # refresh` is run against a database somebody stood up locally; set in CI to
  # the staging control plane.
  source_url_env: AF_STAGING_DATABASE_URL
  # The api's migrate step is our own runner, web/packages/db/src/migrate.ts,
  # which applies these files in name order and records each one's filename in
  # schema_migrations. No marker file says so, and the rehearsal answered
  # INCONCLUSIVE for this very repository, "no migration tool was recognised",
  # while policy.migration_lock below declared thresholds that could never
  # fire. Declared, the rehearsal replays exactly these files and reads the
  # same ledger the runner does to decide what is pending.
  migrations:
    dir: web/packages/db/migrations
    format: sql
    table: schema_migrations
  golden:
    # Refreshed nightly and never used past a week. A golden older than that is
    # a copy of a schema that has moved on, and branching from it produces
    # migration failures that look like application bugs.
    schedule: "0 3 * * *"
    max_age: 168h
    retain: 3

egress:
  # Nothing reaches the internet unless it is named here. That includes
  # github.com, which is the point: the control plane's own sign-in path has to
  # work without it, and this is what proves it does rather than asserting it.
  default: block
  rules:
    - host: api.resend.com
      mode: capture
      note: "the sign-in link, recorded into the inbox instead of being sent to anybody"
    # Blocked, as the default already says, and present for its webhook_path:
    # the callbacks Stripe would send are delivered to the api's own handler,
    # signed the way Stripe signs them. Without this line the sender refused
    # every event with AF-NET-012 before the api saw it. The checkout workflow
    # below depends on Stripe staying unreachable, so this is not mock, which
    # the engine's own Stripe pack would allow; that is a separate decision.
    - host: api.stripe.com
      mode: block
      webhook_path: /webhooks/stripe
      note: "Stripe stays unreachable; the callbacks it would send go to the api"
    # Still blocked, which is the point of this environment. The rule exists
    # for its webhook_path: an installation or a pull request can be delivered
    # to the api and handled, while anything the api then tries to ask GitHub
    # is refused with a readable decision rather than reaching it.
    - host: api.github.com
      mode: block
      webhook_path: /webhooks/github
      note: "the GitHub App's callbacks go to the api; GitHub itself stays unreachable"

personas:
  - name: owner
    # An address that belongs to a member of the seeded organization. The link
    # is sent to it, captured, and read back; nothing is delivered.
    email: owner@antifailure.test
    role: owner
    login: magic_link
    # The console's sign-in screen, which every console route shows when
    # signed out. Named so that a workflow starting inside the operator portal
    # still signs the owner in at the console: the search for a form begins at
    # the workflow's start path, and the portal's form has an email field too,
    # so the runner typed the owner's address there and then waited for a
    # "Send a sign-in link" button the portal does not have.
    sign_in_path: /environments

  - name: viewer
    email: viewer@antifailure.test
    role: viewer
    login: magic_link

  # Somebody who has never signed in and is not going to. The launch reader
  # arriving from the announcement is this person for the whole of their first
  # minute: the front door, the sign-in form, the operator portal's door if
  # they guess at /admin. Nothing above could stand there, because every other
  # persona is signed in before its first step, so the one screen every new
  # customer sees first was the one screen no workflow and no exploration ever
  # looked at. `login: none` creates no account and types nothing.
  - name: visitor
    login: none

  # The operator who is also a customer, which is everybody on this team and
  # was the person who hit the launch-night bug. It is a SEPARATE account in a
  # separate table from `owner` above: the console's sessions live in `users`
  # and the operator portal's in `admin_users`, two id spaces on purpose, so
  # the one human holds two logins. This one is the operator half, with the
  # `owner` role the portal itself uses, signed in with a password because the
  # portal is the only password form on this origin.
  #
  # sign_in_path is /admin because that is where the portal's form is, and the
  # console answers every other route with the console's own sign-in screen.
  # Without it the runner would find the console's email field at the workflow
  # start path and type an operator address into the wrong form.
  - name: operator-owner
    email: operator@antifailure.test
    role: owner
    login: password
    sign_in_path: /admin

# The command that creates the personas above, run once per persona against the
# branch with the persona in its environment. It writes a magic_link persona
# into `users` with a membership, and a password persona into `admin_users`
# with the hash the operator portal verifies against. See deploy/docker/
# personas.mjs for why the operator's password can only be written here.
auth:
  adapter: seed
  seed: node deploy/docker/personas.mjs

workflows:
  # The expectations below name words that actually appear on the page.
  #
  # That is not a stylistic choice. Without a model key the runner reads the
  # accessibility tree and checks it against these strings, and an expectation
  # written as a sentence about the product ("the audit log shows entries") can
  # be neither confirmed nor contradicted by anything on screen. The runner
  # says so and returns `unverified`, which is the honest answer and not a
  # useful one. Naming the page's own labels makes the same check verifiable at
  # zero cost, and a model key still improves on it rather than being required.
  #
  # Each string below was taken from the console's own source rather than
  # remembered, because the last set was written against a different
  # application and every workflow that used it came back unverified.
  #
  # Two rules that only a real run teaches, both of which were being broken
  # here. An expectation describes the page the workflow ENDS on, so naming the
  # signed out button beside a signed in one asks for a page that cannot exist.
  # And it is checked against the page's visible text, which does not include a
  # placeholder: `filter by action` is what that input says until somebody
  # types in it, and it is not text on the page by any reading a browser gives.
  - name: sign-in-with-a-link
    description: >-
      As the owner, ask for a sign-in link with the email address, read the
      link out of the captured message, follow it, and confirm you land on a
      signed in page.
    persona: owner
    # Signed out, every path shows the sign-in screen, so this is the
    # environment's front door rather than a route of its own.
    start_path: /environments
    expect:
      # Where this ends, not where it starts. It said "Send a sign-in link"
      # here, which is the button on the page the workflow leaves behind: once
      # the link has been followed that string is gone, so the workflow could
      # never pass however well it worked, and it never did.
      - "Sign out"
      # Signed in as somebody in particular, which is the half of this that a
      # session cookie alone would not prove.
      - "Preview Owner"
    tags: [smoke, auth]

  - name: view-the-environment-matrix
    description: >-
      As the owner, look at the list of environments and check that it shows
      environments with their repository, branch, and state.
    persona: owner
    start_path: /environments
    expect:
      - "Repository"
      - "Branch"
      - "State"
      # The one word on this page that exists only when the table rendered, and
      # the reason this workflow now means anything. The three above are all
      # chrome: "Repository" and "Branch" label the fields of the "Ask for an
      # environment" form and "State" heads a column of the runtimes table, so
      # renaming the `environments` table out from under the page left every
      # one of them on screen and the workflow passed over a card reading
      # "That did not load".
      #
      # On its own rather than in a phrase, and that is forced. The checker
      # takes the meaningful words of an expectation and needs two thirds of
      # them, so "Branch State Created" scores two out of three on the broken
      # page and passes. One word that is absent scores zero.
      - "Created"
    tags: [smoke]

  - name: open-a-run
    description: >-
      As the owner, open the runs list and check that a run shows which
      environment it belongs to and what the agents concluded.
    persona: owner
    start_path: /runs
    expect:
      - "Recent runs"
      - "Environment"
      - "Verdicts"
      # Two column headings the runs table alone carries, for the reason given
      # on `Created` above. "Recent runs" is a card title, "Environment" labels
      # a field of the "Start a run" form, and "Verdicts" is in this page's own
      # lede, "A run with failing verdicts is one that found something", so all
      # three survived the table being renamed away and the workflow passed
      # over a card reading "That did not load".
      - "Kind Started"
    tags: [smoke]

  - name: edit-a-network-policy
    description: >-
      As the owner, go to the network policy page and check that it offers a
      way to explain a decision and shows the approval queue as somebody who
      can approve from it.
    persona: owner
    start_path: /network
    expect:
      - "Effective policy"
      - "Explain a request"
      # The sentence the approval queue carries only for a role that can
      # approve, which is what makes this an assertion about the owner rather
      # than about the page. It said "Host" here, and "Host" is a column
      # heading in three separate tables and a field label in the explain form,
      # so it was satisfied by any of them and distinguished nothing. It also
      # went with a description saying the page lists the hosts the policy
      # names, which this environment's page does not: every rule in the
      # branched golden is proposed and none is approved, so the effective
      # policy is empty and says so.
      - "None of these is being enforced anywhere until it is approved"
      # A column heading the approval queue alone carries, so that the workflow
      # breaks when the queue does. Everything else it names is chrome: two
      # card titles and a card note, all of which render whether or not the
      # rules loaded, so renaming `network_rules` away left the page showing
      # "That did not load" twice and the workflow still passed.
      #
      # This does tie the workflow to the golden holding at least one proposed
      # rule. That is the right dependency rather than a fragile one: an empty
      # queue means the page cannot show what this workflow says it shows, and
      # saying so is better than passing over it.
      - "Scope"
    tags: [policy]

  - name: read-the-audit-log
    description: >-
      As the owner, open the audit log and check that it shows entries and can
      be filtered by action.
    persona: owner
    start_path: /audit
    expect:
      - "Every action this organization has taken"
      - "Actor"
    tags: [smoke, audit]

  - name: a-viewer-cannot-edit-policy
    description: >-
      As the viewer, open the network policy page and check that it says
      approving an egress change is somebody else's job.
    persona: viewer
    start_path: /network
    expect:
      - "Effective policy"
      # The only string on this page that an owner does not also see, and the
      # reason this workflow now proves anything. It expected "Effective
      # policy" and "Host", both of which the owner's page shows too, so a
      # viewer who could propose and approve every rule would have passed a
      # workflow named for not being able to. An expectation cannot assert an
      # absence, because the checker matches words that are present, so the
      # role is asserted through the sentence the console shows exactly when
      # the propose form and the approve column are withheld.
      - "Approving an egress change needs owner or admin"
      # The queue's own heading, for the reason on the owner's workflow above.
      # The viewer sees the same table without its Approve column.
      - "Scope"
    tags: [policy, rbac]

  # The launch-night failure, rehearsed. THE FIRST WORKFLOW HERE THAT HOLDS TWO
  # SESSIONS AT ONCE, because the bug it exists to catch could only appear when
  # a browser did.
  #
  # An operator who is also a customer, which is everybody on this team, is
  # signed into the operator portal (a __Host- cookie in admin_users) AND into
  # the console (the product cookie in users) in one browser. The /trpc
  # transport check for the operator cookie used to run whenever that cookie
  # was PRESENT, whatever the request named, so it refused every customer
  # mutation the browser made with its customer session. The first one it
  # refused in production was Subscribe to team, with a 403 naming a header the
  # Plan page has no reason to know about. Every persona this manifest had
  # signed in as one identity, so no workflow could hold both cookies and the
  # rehearsal could not have found it however the expectations were written.
  #
  # personas: the two sessions, in the order they are established, in one
  # browser. The operator signs in first at /admin with a password; the owner
  # signs in second in the console by magic link. The workflow acts as the last
  # one named, the owner, whose product session sends the mutation while the
  # operator cookie sits beside it in the same request.
  - name: an-operator-who-is-also-a-customer-can-start-checkout
    description: >-
      Sign in to the operator portal with a password, then sign in to the
      console as the owner in the same browser, open the plan page, and press
      Subscribe to team. Confirm the checkout reaches the control plane rather
      than being refused by the operator transport check, which has no business
      running on a customer request the console authenticated with its own
      session.
    personas: [operator-owner, owner]
    start_path: /plan
    expect:
      # The sentence the Plan page shows when Subscribe to team was pressed and
      # the checkout mutation REACHED THE HANDLER. Billing is configured in
      # this environment, so the mutation gets past the precondition, tries to
      # create a Stripe customer, and fails at api.stripe.com, which the egress
      # policy does not allow. The Stripe client reports a connection that got
      # no answer as a StripeError, and the checkout route turns that into this
      # gateway refusal, which tells the buyer nothing was charged. It can only
      # appear once the request is past the transport gate.
      #
      # It used to be the fixed internal error sentence, because the dropped
      # connection reached the route as a bare TypeError. The first dogfood run
      # after that changed failed here, which is this expectation doing its job.
      #
      # THE 403 PATH CANNOT PRODUCE IT. When the operator CSRF check wrongly
      # runs on this customer mutation, the gate refuses the request before the
      # handler with 403 "This operator request needs the
      # x-antifailure-admin-csrf header from the operator session endpoint",
      # and that is what the page shows instead. So this expectation passes on
      # the fixed tree and fails on the reverted one, which is the proof the
      # workflow exists to give. That negative half, that the header is NOT
      # named, cannot be written as an expectation because the checker asserts
      # presence and not absence, so it is carried entirely by this positive
      # sentence, which the 403 path can never show.
      #
      # Quoted, so it is required character for character rather than by its
      # scattered words, and so its absence is a FAILURE rather than an
      # unverified result that would exit zero.
      - '"Stripe would not create a customer for this organization. Nothing was charged and nothing was changed."'
    tags: [billing, rbac, csrf]

  # The same failure in the other direction, which the founder hit next. An
  # operator whose browser also held the console cookie pressed Mark reviewed
  # in the portal and the CUSTOMER gate refused it, 403 "needs the
  # x-antifailure-csrf header from GET /auth/session", for a session the
  # request was not using. Same two cookies, same browser, the mutation now an
  # operator one, so the workflow acts as the operator (named last).
  #
  # personas.mjs seeds one application, "Preview Applicant", waiting to be
  # reviewed, and resets it to waiting on every provisioning run so this
  # presses the mutation rather than finding the work done. The description
  # names the two controls by their visible labels, which is how the planner
  # without a model knows what to press on a page whose shape it does not
  # share with every application.
  - name: an-operator-who-is-also-a-customer-marks-an-application-reviewed
    description: >-
      Sign in to the console as the owner, then sign in to the operator portal
      in the same browser, open the applications queue, open the application
      from Preview Applicant, press Mark reviewed, and confirm the waiting queue
      says nothing is left in it rather than refusing the review for want of a
      header the portal has no reason to send.
    personas: [owner, operator-owner]
    start_path: /admin/administration/applications
    expect:
      # The waiting queue's own empty state, which the page shows only once the
      # one seeded application has left it, which only a review that reached
      # the handler does. Under the bug the drawer stays open showing the 403
      # sentence and the row stays in the queue, so this is absent and the
      # quoted form makes that a failure. A seed that wrote no row cannot pass
      # this vacuously: personas.mjs exits non zero when the application is not
      # waiting, and provisioning failing stops the run before any workflow.
      - '"Nothing has come in through the careers page since the last one was reviewed or removed."'
    tags: [rbac, csrf, operator]

  # The launch day surfaces, which nothing above visited.
  #
  # Every workflow so far started signed in and went to one of four pages. The
  # pages a new customer actually crosses on the first day, the sign-in screen,
  # the getting started steps, the plan, the terminal sign-in, the members
  # list, settings and the operator portal's home, had no workflow at all, so
  # a launch morning defect on any of them would have been found by a customer
  # rather than by the rehearsal. The readiness evaluation found exactly that:
  # the console's own start page was configured as not existing in production
  # and nothing here could have said so.
  #
  # Each of these is read only and names the page's own labels, for the reason
  # given at the top of this block: without a model key the runner verifies
  # words that are on the page and nothing else. Six journeys that needed a
  # model to press the right control (create and revoke a token, invite a
  # member, sign out, complete onboarding as a stranger) were written for the
  # evaluation and came back blocked or unverified, and a workflow that cannot
  # pass without a key nobody sets in CI is a workflow that will be muted. The
  # two that could be made to pass by naming the right page are here; the rest
  # are covered as explorations below, which need no key.
  #
  # Every one sets start_path. Three of the evaluation's workflows left it
  # unset and all three hung on a disabled Continue button: the root of the
  # console sends a first-time browser to the getting started question, whose
  # Continue is disabled until an answer is ticked, and a workflow that did not
  # say where it was going was standing on the one page whose only button
  # needs a decision first.
  - name: a-visitor-is-asked-to-sign-in
    description: >-
      As a visitor who has never signed in, open the console and check that it
      offers GitHub and an email link, and nothing else.
    persona: visitor
    start_path: /environments
    expect:
      # The two ways in, and the field the second one needs. All three are on
      # the signed out screen and none of them survives a sign-in, so a
      # visitor who was somehow shown the environments list would fail this.
      - "Continue with GitHub"
      - "Send a sign-in link"
      - "Email address"
    tags: [smoke, auth, visitor]

  - name: a-visitor-finds-the-operator-door
    description: >-
      As a visitor who has never signed in, open the operator portal and check
      that it asks for an operator's email and password rather than showing
      anything an operator would see.
    persona: visitor
    start_path: /admin
    expect:
      # The portal's own sign-in title and the one field the console's sign-in
      # screen never shows. "What needs an operator" is what the signed in
      # home says, so an anonymous visitor seeing it would be the finding.
      - "Operator sign-in"
      - "Password"
    tags: [auth, operator, visitor]

  - name: get-started-as-the-owner
    description: >-
      As the owner, open the getting started steps and check that the first
      question asks where Antifailure will be used.
    persona: owner
    start_path: /start
    expect:
      # The first step's heading and its lede, from console/lib/onboarding.ts.
      # A fresh browser always lands on the first step, because the answer is
      # remembered in the browser rather than in the organization.
      - "Where will you use Antifailure?"
      - "Tick every one that applies"
    tags: [onboarding, smoke]

  - name: open-the-plan-page
    description: >-
      As the owner, open the plan page and check that it shows the current
      subscription, what each plan allows, and the invoices.
    persona: owner
    start_path: /plan
    expect:
      - "Plan and billing"
      # These two cards render only when billing is configured, which the
      # Stripe placeholders above make true. A control plane that lost its
      # billing configuration would show the "takes no payment" note instead
      # and lose both of these, which is the failure this is for.
      - "Subscription"
      - "What each plan allows"
      - "Invoices"
    tags: [billing]

  - name: read-the-command-line-page
    description: >-
      As the owner, open the command line page and check that it says how to
      install the engine, how to sign a terminal in, and which terminals are
      signed in now.
    persona: owner
    start_path: /cli
    expect:
      - "Install the engine"
      - "Sign this terminal in"
      - "Terminals and tokens"
    tags: [onboarding, tokens]

  - name: see-who-is-in-the-organization
    description: >-
      As the owner, open the members page and check that it lists the people
      and the invitations, and says role changes take effect on the next
      request.
    persona: owner
    start_path: /members
    expect:
      - "People"
      - "Invitations"
      # The lede the page shows only to somebody who may manage members. The
      # viewer's workflow below expects the other sentence.
      - "Changing a role takes effect on their next request"
    tags: [team]

  - name: a-viewer-cannot-change-a-role
    description: >-
      As the viewer, open the members page and check that it says changing a
      role is somebody else's job.
    persona: viewer
    start_path: /members
    expect:
      - "People"
      # The one sentence on this page an owner does not see, for the reason on
      # a-viewer-cannot-edit-policy: the checker asserts presence, so the role
      # is proven through the sentence the console shows exactly when the
      # invite form and the role menus are withheld.
      - "Changing a role needs owner or admin"
    tags: [team, rbac]

  - name: open-the-settings-page
    description: >-
      As the owner, open settings and check that it shows the organization,
      how they said they wanted to get started, and the billing contact.
    persona: owner
    start_path: /settings
    expect:
      - "Organization"
      - "Getting started"
      - "Billing contact"
    tags: [settings]

  - name: the-operator-sees-what-needs-an-operator
    description: >-
      As the operator, sign in to the operator portal and check that its home
      says what needs an operator, describes the installation, and lists
      recent operator actions.
    persona: operator-owner
    start_path: /admin
    expect:
      # The three cards on the portal's home, which render only behind a
      # working operator session and a working AF_ADMIN_DATABASE_URL. The
      # evaluation's operator workflow never got here because it looked for a
      # magic link on a page that has a password form.
      - "What needs an operator"
      - "The installation"
      - "Recent operator actions"
    tags: [operator, smoke]

explore:
  enabled: true
  # One goal per persona per launch day surface. There was one goal here, a
  # viewer looking for a run from the environments list, so the getting
  # started steps, the plan, settings, the terminal sign-in, the members list,
  # the sign-in screen and the operator portal were explored by nobody, and
  # the readiness evaluation's "exploration cannot be pointed at a persona or
  # a page beyond what the manifest declares" was a true statement about this
  # file rather than about the product. Each goal below is what one kind of
  # person is trying to do on the first day, started on the page they would
  # start on, with its own seed so two goals never walk the same tie breaks.
  #
  # There is no viewport here because the goal schema has none: an
  # exploration drives one desktop sized page. A narrow viewport is a product
  # gap and is said so in the report, not papered over with a key the
  # validator would refuse.
  goals:
    - name: find-a-run-as-a-viewer
      goal: Find a run and read its verdict and evidence.
      persona: viewer
      seed: viewer-run-evidence
      start_path: /environments
      slow_ms: 3000
      budget:
        steps: 12

    - name: ask-for-a-link-as-a-visitor
      # The front door as a stranger sees it. The address the exploration
      # types comes from the seed and is a reserved example.test one, so the
      # form's answer is the same "check your mail" every stranger gets and no
      # message is sent to anybody.
      # The goal does not name GitHub, and it used to. Without a model key the
      # planner scores controls by the words they share with the goal, so
      # "without using a GitHub account" made Continue with GitHub the best
      # match on the page, and pressing it starts a navigation to github.com
      # that this environment will never let finish.
      goal: Ask for a sign-in link to be sent by email.
      persona: visitor
      seed: visitor-front-door
      start_path: /environments
      slow_ms: 3000
      budget:
        steps: 10

    - name: find-the-operator-door-as-a-visitor
      goal: Find where an operator signs in and what it asks for.
      persona: visitor
      seed: visitor-operator-door
      start_path: /admin
      slow_ms: 3000
      budget:
        steps: 8

    - name: answer-the-getting-started-questions
      goal: Answer the getting started questions and open the environments list.
      persona: owner
      seed: owner-getting-started
      start_path: /start
      slow_ms: 3000
      budget:
        steps: 20

    - name: move-to-the-team-plan-as-the-owner
      # Stops short of paying by construction: api.stripe.com is blocked, so
      # the checkout the console starts fails inside the control plane and the
      # exploration records how that failure reads to a customer.
      goal: Find what the organization pays for and how to move to the Team plan.
      persona: owner
      seed: owner-team-plan
      start_path: /plan
      slow_ms: 3000
      budget:
        steps: 16

    - name: change-the-billing-contact-as-the-owner
      goal: Find where the billing contact is set and what the organization is called.
      persona: owner
      seed: owner-billing-contact
      start_path: /settings
      slow_ms: 3000
      budget:
        steps: 16

    - name: sign-a-terminal-in-as-the-owner
      goal: Find how to install the engine and sign a terminal in with a token.
      persona: owner
      seed: owner-terminal-token
      start_path: /cli
      slow_ms: 3000
      budget:
        steps: 16

    - name: look-at-load-and-masking-as-the-owner
      goal: Find the last load run and what masking does to the data.
      persona: owner
      seed: owner-load-masking
      start_path: /load
      slow_ms: 3000
      budget:
        steps: 16

    - name: invite-somebody-as-the-viewer
      # A viewer may not invite, so the interesting output is how the console
      # says so, not whether an invitation is sent.
      goal: Find who is in the organization and how to invite somebody new.
      persona: viewer
      seed: viewer-invite
      start_path: /members
      slow_ms: 3000
      budget:
        steps: 12

    - name: review-the-queue-as-the-operator
      goal: Find what needs an operator and the applications waiting for review.
      persona: operator-owner
      seed: operator-queue
      start_path: /admin
      slow_ms: 3000
      budget:
        steps: 16

oracle:
  # The other half of a release gate. `af test` says whether the console does
  # what the workflows above ask; this says what a change did that the version
  # it replaces did not, on the same data. It was absent, so
  # `compare_with_previous_release` refused to run against this repository on
  # the morning it was tagged: "This project declares no oracle probes, so
  # there is nothing to send to either side and no comparison to make."
  #
  # The probes are the requests a launch reader's browser makes in its first
  # minute, signed out, plus the three endpoints whose answer to a stranger is
  # the whole of their contract. They are sent with no session, because a
  # probe is bytes written down in advance and a session cookie is not.
  # Everything behind a sign-in is judged by the workflows and the explorations.
  #
  # What each probe can show is a status that changed class, a header that
  # appeared or went, a JSON body that lost a field, and a table whose rows the
  # two versions left different. The console pages are static HTML, which the
  # comparison reads as bytes rather than structure, so on a pull request that
  # rebuilds the console those probes report one minor "bodies differ" each and
  # nothing more. That is the truth about such a change and it does not fail
  # anything: `fail_on: critical` is a page that vanished, a request the last
  # version served and this one refuses, or a row it stopped writing.
  enabled: true
  baseline: merge_base
  base_ref: origin/main
  fail_on: critical
  # Four fields that differ on every build, measured rather than expected.
  #
  # With personas matched by who they are, a fresh af oracle against an
  # identical build of this repository still reported two major differences,
  # and neither was the change:
  #
  #   admin_users password_hash and password_salt. personas.mjs hashes the
  #   operator's password under a random 32 byte salt, and each side derives
  #   its own password from its own environment, so the two rows can never
  #   agree however identical the builds are.
  #
  #   admin_audit_entries entry_hash, and prev_hash after it. The chain hash
  #   covers occurred_at. The timestamp normaliser already treats the two
  #   occurred_at values as equal, but the hash of each still differs, and
  #   every later entry's prev_hash carries that on.
  #
  # With these four ignored, the same identical build read zero differences
  # across all 18 probes, 84 tables and 1438 rows. Chain integrity is the audit
  # verifier's job (packages/db/src/admin-audit.ts), and it recomputes every
  # hash; a cross build diff of two chains with different clocks cannot do it.
  # A pattern here is ignored in every table and every response body, and no
  # other column or field in this product carries these four names.
  ignore:
    fields: [$.password_hash, $.password_salt, $.entry_hash, $.prev_hash]
  probes:
    - name: readiness
      # JSON, and the one answer a deploy gate acts on. `ready` is compared
      # by value; `version` and `commit` are whatever the build stamped, which
      # a preview does not, so both read "dev" and "unknown" on both sides.
      path: /readyz
    - name: liveness
      path: /health
    - name: the-front-door
      # The console's shell, which is the sign-in screen to a stranger.
      path: /
    - name: no-session-for-a-stranger
      # {"signedIn": false} with the sign-in methods and whether signups are
      # open. A change that closed email sign-in or opened signups shows up
      # here as a field that changed value, before anybody's browser sees it.
      path: /auth/session
    - name: the-environments-page
      path: /environments
    - name: the-runs-page
      path: /runs
    - name: the-getting-started-page
      # The page the launch found configured as not existing in production.
      # 200 on both sides is the expectation; a 404 on one is critical.
      path: /start
    - name: the-plan-page
      path: /plan
    - name: the-settings-page
      path: /settings
    - name: the-command-line-page
      path: /cli
    - name: the-operator-door
      path: /admin
    - name: a-page-that-does-not-exist
      # The negative control. The static export answers an unknown path with
      # its own 404 page and status 404, and a change that made every path
      # answer 200 would make the pages above meaningless as probes.
      path: /a-page-that-does-not-exist
    - name: the-api-refuses-a-stranger
      # The session gate on the application's own API, as JSON. A change that
      # let this through would be the worst thing a diff could find.
      path: /trpc/environments.list
    - name: the-published-contract
      # The OpenAPI document, which is a structural description of every
      # endpoint. A route added, removed or retyped is a JSON path here, which
      # is exactly the kind of difference somebody did not mean to make.
      path: /openapi.json
    - name: a-magic-link-for-a-stranger
      # The sign-in request itself, with an address that has no account. The
      # control plane answers {"sent": true} for every input by design, writes
      # no token and sends no mail for an unknown address, so both sides do
      # nothing and must say the same thing about it. This is the one write
      # path on the sign-in journey a probe can exercise without creating a
      # message somebody's workflow then reads.
      method: POST
      path: /auth/email
      headers:
        content-type: application/json
      body: '{"email": "stranger@example.test"}'
    - name: an-operator-sign-in-with-a-wrong-password
      # 401 with one fixed sentence for every refusal, and one audit row on
      # each side recording the refusal. The row is written identically on
      # both, so it is a comparison of the audit path rather than noise.
      method: POST
      path: /v1/admin/signin
      headers:
        content-type: application/json
      body: '{"email": "nobody@example.test", "password": "not-the-password"}'
    - name: an-unsigned-stripe-delivery
      # Billing is configured above, so this is refused as unverifiable with
      # 401. A version that answered 200 to an unsigned delivery would be a
      # webhook anybody on the internet could send, and 401 to 2xx is minor
      # in the ranking, so read this probe's line rather than only the verdict.
      method: POST
      path: /webhooks/stripe
      headers:
        content-type: application/json
      body: '{"id": "evt_oracle_probe", "type": "ping"}'
    - name: the-analytics-proxy
      # The PostHog forwarder at /ph is mounted only when a region is
      # configured, which a preview does not, so both sides answer 404. A
      # change that mounted it unconditionally, or moved it, shows here.
      method: POST
      path: /ph/e/
      headers:
        content-type: application/json
      body: '{"event": "oracle-probe"}'
  # What the database half says on every run, measured rather than expected.
  # A fresh run against origin/main answered all eighteen probes with zero
  # differences and reported eleven database differences, six of them major,
  # every one of them the personas above. Both sides provision owner, viewer
  # and operator-owner, and each side's rows carry their own generated primary
  # keys, so the comparison pairs nothing: users, members and admin_users read
  # as a row missing and a row extra, and the operator audit chain's first
  # hash differs because it covers the operator's id. They are attributed to
  # the migration phase, which is not where they came from, and ranked major,
  # so `fail_on: critical` passes over them. A JSON path in `ignore` cannot
  # pair two rows whose keys differ, so they are read past here rather than
  # hidden, and a difference in any of those tables beyond one row missing and
  # one extra per persona is a real one.
  database:
    enabled: true
    max_rows: 10000

invariants:
  # Each of these returns the rows that break it rather than a count of them.
  #
  # All four were written as SELECT count(*) first, and `af explain` refused
  # them: an invariant holds when its statement returns no rows, so a bare
  # count returns one row saying zero and the check can never fail. Four
  # invariants that looked like evidence and were not. Finding that in this
  # repository's own manifest, with the product's own validator, is the reason
  # this file exists.
  - name: every-environment-belongs-to-a-repository
    description: >-
      The join the matrix is built on. A masking run that remapped one side of
      it and not the other would empty the page while every table still had
      rows in it, which is the failure that looks like an application bug.
    sql: |
      SELECT e.id, e.repository_id
      FROM environments e
      LEFT JOIN repositories r ON r.id = e.repository_id
      WHERE r.id IS NULL

  - name: every-member-belongs-to-a-user
    description: Masking remaps user identifiers, and membership has to follow them.
    sql: |
      SELECT m.org_id, m.user_id
      FROM members m
      LEFT JOIN users u ON u.id = m.user_id
      WHERE u.id IS NULL

  - name: the-audit-chain-is-linked
    description: >-
      Every entry after the first points at the entry before it. Masking must
      not touch the hash columns, and this is what says so: a rule that
      nullified them would leave a log that fails its own verification.
    sql: |
      SELECT a.org_id, a.seq
      FROM audit_entries a
      WHERE a.prev_hash IS NULL
        AND a.seq > (SELECT min(seq) FROM audit_entries b WHERE b.org_id = a.org_id)

  - name: no-session-outlives-its-user
    description: A session pointing at a user that masking removed is a session nothing can resolve.
    sql: |
      SELECT s.id, s.user_id
      FROM sessions s
      LEFT JOIN users u ON u.id = s.user_id
      WHERE u.id IS NULL

insights:
  enabled: true
  migration_rehearsal: true
  query_regression: true
  plan_diff: true

policy:
  # This is an availability smoke with no timing baseline. An observed error
  # rate breach must fail dogfood rather than leave a warning beside success.
  load_regression: fail

load:
  enabled: true
  source: none
  # A smoke, not a benchmark. The question is whether the control plane answers
  # under any load at all, on a shared CI runner where a number would mean
  # nothing anyway.
  #
  # scale was 0.05 and it was a fraction of a rate that does not exist. It
  # means a multiplier on PRODUCTION'S arrival rate, and `source: none` has no
  # production to take one from, so the number it multiplied was the default
  # shape's 5 requests a second. A quarter of a request a second for a minute
  # is fifteen requests, which is not a smoke of anything. 1 against a
  # synthesised 5 is the honest reading of "as fast as the default sends", and
  # thirty seconds of it is 150 requests across the pages below.
  scale: 1
  duration: 30s
  # Every literal GET here is also a step a scenario below may send: a
  # scenario is checked against this list before anything goes out, and one
  # that names a route not on it does not run at all. So the list is the
  # signed out journey a launch reader makes plus the console's pages, not only
  # the four signed in pages it used to be.
  safe_routes:
    - GET /
    - GET /readyz
    - GET /health
    - GET /auth/session
    - GET /environments
    - GET /runs
    - GET /audit
    - GET /network
    - GET /start
    - GET /plan
    - GET /cli
    - GET /members
    - GET /settings
    - GET /admin
  # POST /auth/email stays out, and that is a decision rather than a gap.
  #
  # It is the sign-in request, and the readiness evaluation was right that
  # nothing here could ever put a request against it. It still cannot, for
  # two reasons a load run cannot get around. The route answers in constant
  # time by design, before the mail is sent and whether or not the address has
  # an account, so its latency under load says nothing a load run would want to
  # know. And every request with a known address writes a token row and lands
  # a message in the inbox that the workflows above then read the newest link
  # out of, while the route shares a per client limiter of one request a second
  # with the callback and the operator sign-in: fifty sessions here would spend
  # the budget the workflows need a minute later and turn their sign-ins into
  # 429s. A load run that breaks the checks that follow it is not a
  # measurement. The sign-in journey under load is the page the form is on, the
  # session read the console makes before it renders it, and readiness, which
  # the scenarios below send; the request itself is covered once, by the
  # oracle probe above, where a single send is what is wanted.
  unsafe_routes:
    - POST /auth/email
    - POST /trpc/*
  # Two journeys with an order to them, which the weighted mix above has
  # none of. There were no scenarios, so `af load scenario` and the MCP
  # `run_load_test` scenarios profile failed with AF-LOD-010 on this very
  # repository. Each document is under scenarios/ and says what it measures.
  scenarios:
    # A reader arrives from the announcement, signed out, and reloads once
    # when the first paint feels slow. Twenty at a time, three times each.
    - path: scenarios/a-reader-arrives-signed-out.yaml
      sessions: 20
      iterations: 3
    # Ten seconds in, a team opens every console page in a row while the
    # readers above are still arriving.
    #
    # Twelve sessions once through, not forty twice, and the smaller number is
    # the measurement rather than a retreat from one. Every session a scenario
    # sends comes from the one address the load generator has, and the control
    # plane allows one address twenty page loads a second with a burst of 120
    # (`GET /console/app/*` in web/apps/api/src/limits.ts). Forty sessions
    # twice through is 640 page loads in about seven seconds, and the first
    # run of it had 392 of them refused with 429: it measured the rate
    # limiter doing its job and said nothing about whether the console
    # serves. Ninety six loads sit inside the burst beside the readers'
    # hundred and twenty, so a refusal here means the limit changed or the
    # process fell over, and both are worth a red.
    - path: scenarios/the-console-under-a-launch-burst.yaml
      sessions: 12
      iterations: 1
      start_after: 10s
  thresholds:
    # No p95_increase, because the source is none. A default shape carries no
    # production baseline, so the threshold would have been listed in the
    # report and evaluated against nothing. It was set to 0.5 here and had
    # never once been able to fire.
    error_rate: 0.02

runtime:
  provider: local
  ttl: 24h
  idle_sleep: 30m

github:
  mode: actions
  comment: true
  fork_policy: label
  teardown_on: [close, merge, ttl]
