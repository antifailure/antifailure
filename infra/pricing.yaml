# Unit prices for every Azure SKU this project uses.
#
# Every number here was read from the Azure retail prices API
# (https://prices.azure.com/api/retail/prices) on the date below, for the region
# below, in USD, at pay-as-you-go rates. None of it is from memory and none of
# it is an estimate. `tools/cost estimate` reads a Terraform plan against this
# file and prints a projected monthly bill.
#
# Two things this file is NOT:
#
#   It is not a quote. Retail prices ignore reservations, savings plans,
#   Microsoft customer agreements, and free grants beyond the ones named here.
#   Spec 1.8 sets the bar as "within 10 percent of the Azure cost analysis after
#   one week", which is a comparison against reality rather than a promise.
#
#   It is not automatically current. Azure moves prices. The `checked` date is
#   how you know whether to distrust it, which is why it is a field rather than
#   a comment.
#
# THE REGION IS centralus AND IT IS THE THIRD ONE THIS PROJECT HAS TRIED.
# southcentralus, because that is what the spec named, until
# bonfire-allowed-locations denied it. Then eastus, which the policy allows and
# which is cheaper, until an apply came back
#
#   ParameterOutOfRange: The value of 'Version' should be in: []
#
# and `az postgres flexible-server list-skus -l eastus` explained the empty
# list: "Provisioning is restricted in this region", with supportedServerVersions
# literally []. So THREE independent gates decide whether a region works, and
# they are checked at three different times by three different systems: quota
# (which was never the constraint, both regions have 65 cores), Azure Policy
# (evaluated at write time, invisible to a plan), and regional service
# availability for the subscription (invisible to both). centralus is the only
# region that passes all three here, and it is dearer than eastus for compute
# and storage, which is why these numbers moved.

# WHAT WAS RE-READ ON 2026-08-30 AND WHAT WAS NOT, because one date on a file
# that is edited in parts is a claim about lines nobody looked at.
#
# Re-read and unchanged on 2026-08-30: every PostgreSQL compute and storage
# number, Container Apps, Key Vault, Log Analytics. Added on that date:
# GP_Standard_D2ds_v4 and the whole azure_monitor block.
#
# NOT re-read on 2026-08-30: the blob storage rates, which are still the
# 2026-08-28 figures. Nothing in either stack creates a storage account
# (goldens_enabled is false and the reason is in the module), so no estimate
# this repository produces depends on them.
meta:
  currency: USD
  region: centralus
  checked: 2026-08-30
  source: https://prices.azure.com/api/retail/prices
  hours_per_month: 730

# --- Azure Database for PostgreSQL, flexible server ------------------------
# Burstable B1ms and B2s carry a flat per-instance meter. From B2ms upward the
# meter is per vCore and the listed price is already the whole instance.
postgres_flexible:
  compute_per_hour:
    # Only the first two, plus GP_Standard_D2ds_v4, are permitted by this
    # subscription's bonfire-sku-allowlist. The rest are here so that a plan
    # naming one is priced rather than reported UNKNOWN, and so the cost of
    # asking for an exemption is visible.
    B_Standard_B1ms: 0.01921
    B_Standard_B2s: 0.07684
    B_Standard_B2ms: 0.15368
    B_Standard_B4ms: 0.30736
    B_Standard_B8ms: 0.61472
    # THE LARGEST SINGLE LINE IN THE PRODUCTION BILL, AND IT HAD NO PRICE HERE
    # UNTIL NOW, so `tools/cost estimate` reported UNKNOWN for it and suppressed
    # the total for the only stack whose total anybody needed.
    #
    # high_availability forces a General Purpose SKU, and this is the only one
    # bonfire-sku-allowlist permits. Its meter is per vCore:
    #
    #   Azure Database for PostgreSQL Flexible Server General Purpose Ddsv4
    #   Series Compute, "vCore", 0.1005 per hour, centralus, read 2026-08-30
    #
    # D2ds_v4 is 2 vCores, so the whole instance is 0.2010 an hour and 146.73 a
    # month. With high_availability that is billed twice.
    GP_Standard_D2ds_v4: 0.2010
  storage_per_gb_month: 0.13
  # Backup up to the size of provisioned storage is included. This is the rate
  # beyond it, which is what a long retention actually costs.
  backup_lrs_per_gb_month: 0.108
  # Zone redundant HA runs a second server. It is not a surcharge, it is a
  # second bill, and burstable SKUs cannot do it at all.
  #
  # It multiplies COMPUTE AND STORAGE, because the standby is a whole server
  # with its own disk. The estimator applied it to compute only until this note
  # was written, which understated a production plan by the price of 64 GB.
  high_availability_multiplier: 2.0

# --- Container Apps, consumption -------------------------------------------
# A replica that is up but serving nothing is billed at the idle rate. The free
# grant is per subscription per month and is applied once across every app.
container_apps:
  vcpu_second_active: 0.000024
  vcpu_second_idle: 0.000003
  memory_gib_second_active: 0.000003
  memory_gib_second_idle: 0.000003
  requests_per_million: 0.40
  free_grant:
    vcpu_seconds: 180000
    memory_gib_seconds: 360000
    requests: 2000000

# --- Key Vault --------------------------------------------------------------
key_vault:
  operations_per_10k: 0.03

# --- Storage, general purpose v2, hot -------------------------------------
storage:
  hot_lrs_per_gb_month: 0.018
  hot_grs_per_gb_month: 0.0368
  write_operations_per_10k: 0.065
  read_operations_per_10k: 0.005

# --- Log Analytics ----------------------------------------------------------
# The first 5 GB per billing account per month is free; beyond that this is what
# a chatty diagnostic setting costs, which is the usual reason a small
# deployment's bill is not small.
log_analytics:
  ingestion_per_gb: 2.76
  retention_per_gb_month: 0.12
  free_ingestion_gb: 5

# --- Azure Monitor ----------------------------------------------------------
# What alerting costs, which is small and is not zero. The action group itself
# is free and so are its first 1000 emails and 100 SMS a month; a rule and a
# probe are not.
azure_monitor:
  # Per metric alert rule per month, for a rule watching one time series. Meter
  # "Alerts Metric Monitored", 0.10, and the free tier appears as a second entry
  # of the same meter at 0.0 which this file does not model: assuming a free
  # grant is how an estimate comes out confidently low.
  metric_alert_per_month: 0.10
  # Per availability test execution, meter "Standard Web Test Execution".
  # One execution is one location running once, so the cost of a test is this
  # times the number of locations times how often it runs.
  web_test_execution: 0.00056

# --- Not priced here, on purpose -------------------------------------------
# Geo-redundant backup storage for a flexible server. The retail prices API
# exposes "Backup Storage LRS" for this service in centralus and no
# geo-redundant equivalent under any product name found, so there is no number
# to put here. It costs nothing at this size in any case: backup storage up to
# the provisioned server storage is free, the production server provisions
# 64 GB, and the control plane's database is a few hundred megabytes. If that
# stops being true, this is the line that has to be filled in first.
# azurerm_private_endpoint. The retail prices API does not expose a Private
# Link meter for this region under any service name I could find, and this file
# only carries numbers that came from it. So the estimator reports a private
# endpoint as UNKNOWN and suppresses the total, which is the correct behaviour:
# it is a real recurring cost and pretending it is zero would understate a
# stack that used one. If a plan needs one, get the number from the pricing
# calculator and add it here with its own `checked` note.

# --- Assumptions the estimate needs and a plan cannot tell it ---------------
# Stated here rather than buried in the tool, because they are the numbers most
# likely to be wrong and they should be easy to argue with.
assumptions:
  log_analytics_gb_per_month: 2
  key_vault_operations_per_month: 50000
  golden_storage_gb: 50
  container_apps_requests_per_month: 1000000
  # A replica with min_replicas >= 1 is up all month. Whether it is billed at
  # the active or the idle rate depends on traffic; the estimate uses idle,
  # and says so, because a control plane serving a handful of teams is idle
  # almost all of the time.
  container_apps_duty_cycle: 0.05
