# The linter set CONTRIBUTING promises, with every rule an error.
#
# Chosen for signal rather than for length. A linter that reports style
# opinions teaches people to run it with their eyes closed, and a rule everyone
# has learned to ignore is worse than one that was never enabled: it makes the
# green run mean less without anybody deciding that it should.
#
# Every linter below catches a bug that has actually shipped somewhere, and
# several of them catch the exact classes this repository keeps producing.
version: "2"

linters:
  default: none
  enable:
    # The compiler's own suspicions.
    - govet
    # Unchecked errors. The single highest yield rule in Go: an ignored error
    # is how a failed write becomes a silent success.
    - errcheck
    # Obvious mistakes: impossible conditions, self-assignment, bad printf.
    - staticcheck
    # Unused declarations. This repository has found six cases of something
    # declared, documented, and never called, each of which read as a working
    # feature. This is the rule that would have caught them.
    - unused
    # Ineffectual assignments, which usually mean a shadowed error.
    - ineffassign
    # Misspellings in comments and strings, including user-facing ones.
    - misspell
    # Context passed but never used, and contexts stored in structs.
    - containedctx
    # A loop variable captured by a goroutine. Fixed by the language in 1.22,
    # still worth refusing in code that may be read as an example.
    - bodyclose
    # errors.Is and errors.As rather than == and type assertions, so that a
    # wrapped error still matches.
    - errorlint

  settings:
    errcheck:
      # Deferred Close on a read-only handle is the one place ignoring an
      # error is conventional and correct.
      exclude-functions:
        - (io.Closer).Close
    # misspell has no settings block on purpose, and the key is absent rather
    # than empty because an empty key parses as null and `golangci-lint config
    # verify` rejects it. `run` does not verify, so the invalid config passed
    # locally for days and failed the moment CI ran the linter.
    #
    # No locale, deliberately. misspell's locale option is a dialect converter
    # rather than a spell checker: set it to US and it reports fifty British
    # spellings, set it to UK and it reports fifty American ones, and this
    # repository contains both. Neither list is a list of mistakes, and a rule
    # whose output is entirely correct English is one people learn to run with
    # their eyes closed. Unset, it catches the thing it is good at, which is a
    # genuine typo like recieve or occured.

  exclusions:
    rules:
      # Test files may ignore errors in setup that a failure would surface
      # anyway, and they legitimately declare helpers used by one test.
      - path: _test\.go
        linters:
          - errcheck
      # bodyclose cannot see a body that a test helper closes. Every response
      # in the proxy's adversarial suite goes through `through`, which
      # registers Body.Close on the test's own cleanup stack, so the bodies are
      # closed -- the linter only ever sees the call site and reports each one.
      # Scoped to the single file that has the helper rather than to _test.go,
      # so a real unclosed body anywhere else is still an error.
      - path: cmd/af-proxy/adversarial_test\.go
        linters:
          - bodyclose

# Report every finding, not a sample of them.
#
# golangci-lint caps output by default: max-same-issues is 3 and
# max-issues-per-linter is 50. A run that says "27 issues" when there are 122
# is not a smaller version of the truth, it is a number that cannot be used.
# The tools module was measured at 27 with the defaults and at 122 without
# them, and the plan built on the first number was wrong about how much work
# there was and about which packages carried it.
#
# The engine has been at zero since this file existed, so this changes nothing
# there today. It changes what the first regression looks like, which is the
# only moment the cap could ever matter.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
