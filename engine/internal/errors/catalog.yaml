# The single source of truth for every user facing error.
#
# Go constants in codes.gen.go and the documentation pages under
# reference/errors are generated from this file. A code returned anywhere in
# the code with no entry here fails the build, and so does an entry that
# nothing returns, so the catalog can neither drift nor rot.
#
# Fields:
#   code       AF-<AREA>-<NNN>. Stable forever once released.
#   area       MAN manifest, DET detection, SEC secrets, DB database,
#              MSK masking, BLD build, RUN runtime, NET egress, AGT agent,
#              LOD load, ORC differential oracle, GH GitHub, CP control plane,
#              INF infrastructure, EE enterprise, SCH scheduling.
#   message    One sentence naming what failed. Second person. {placeholders}
#              are filled at the call site.
#   next_step  One sentence saying what to do. Never "contact support".
#   docs       Slug under the documentation site, without a leading slash.
#   retryable  Whether retrying the same operation unchanged could succeed.
#   exit_code  Process exit code when this error reaches the command boundary.
#
# Exit codes: 0 success, 1 generic, 2 usage, 3 configuration, 4 auth,
# 5 provider (retryable), 6 policy denial, 7 verification failure,
# 8 test failure, 9 interrupted with clean teardown, 10 interrupted with
# resources pending cleanup.

errors:
  # Manifest
  - code: AF-MAN-001
    area: MAN
    message: "No antifailure.yaml was found in {path} or any parent directory."
    next_step: "Run 'af init' in the repository root to create one."
    docs: reference/manifest
    retryable: false
    exit_code: 3
  - code: AF-MAN-002
    area: MAN
    message: "The manifest at {path} is not valid: {detail}"
    next_step: "Fix the reported line, then run 'af doctor' to revalidate."
    docs: reference/manifest
    retryable: false
    exit_code: 3
  - code: AF-MAN-003
    area: MAN
    message: "The manifest at {path} declares schema version {found}, which this build does not understand."
    next_step: "Upgrade with 'af version -check' and install the release that supports version {found}."
    docs: reference/manifest
    retryable: false
    exit_code: 3
  - code: AF-MAN-004
    area: MAN
    message: "'af init' has questions to ask and this session has no terminal to ask them on."
    next_step: "Pass --non-interactive to accept every default, and --answer id=value for anything that has no default."
    docs: reference/cli#af-init
    retryable: false
    exit_code: 2
  - code: AF-MAN-005
    area: MAN
    message: "The manifest at {path} is larger than the {limit} limit."
    next_step: "Split the configuration or remove generated content; a manifest describes services, it does not contain them."
    docs: reference/manifest
    retryable: false
    exit_code: 3
  - code: AF-MAN-006
    planned: true
    area: MAN
    message: "The path {path} in the manifest resolves outside the repository."
    next_step: "Use a path relative to the repository root, with no leading slash and no parent directory segments."
    docs: reference/manifest
    retryable: false
    exit_code: 3

  # Detection
  - code: AF-DET-001
    area: DET
    message: "No application could be detected in {path}."
    next_step: "Declare your services by hand in antifailure.yaml; the manifest reference lists the minimum fields."
    docs: concepts/detection
    retryable: false
    exit_code: 3
  - code: AF-DET-002
    planned: true
    area: DET
    message: "Detection stopped after {budget} with partial results."
    next_step: "Add large directories to .gitignore or .dockerignore, or pass --detect-timeout to raise the budget."
    docs: concepts/detection
    retryable: true
    exit_code: 3
  - code: AF-DET-004
    area: DET
    message: "Detection could not decide {question}, and there is no default to fall back on."
    next_step: "Answer it with --answer {id}=<value>, or run 'af init' from a terminal so it can ask."
    docs: concepts/detection
    retryable: false
    exit_code: 3
  - code: AF-DET-005
    area: DET
    message: "Detection produced a draft that is not a valid manifest, so nothing was written and {path} does not exist: {detail}"
    next_step: "Re-run with --answer to override what detection read, for example --answer service.<name>.port=<port>. If nothing in the repository is wrong, this is a defect in Antifailure and worth reporting with the detail above."
    docs: concepts/detection
    retryable: false
    exit_code: 3
  - code: AF-DET-006
    area: DET
    message: "--answer {id}=... does not name anything in this repository."
    next_step: "Use one of: {known}"
    docs: concepts/detection
    retryable: false
    exit_code: 2
  - code: AF-DET-010
    area: DET
    message: "The changed files between {base} and {head} could not be read: {detail}"
    next_step: "Fetch the base branch before running 'af change'. A checkout cloned one commit deep shares no history with it, which is what 'fetch-depth: 0' fixes in a GitHub Actions job."
    docs: concepts/change-analysis
    retryable: false
    exit_code: 3
  - code: AF-DET-011
    area: DET
    message: "The diff at {path} could not be read: {detail}"
    next_step: "Produce it with 'git diff --unified=0 base...head'; this reads git's own unified format and nothing else."
    docs: concepts/change-analysis
    retryable: false
    exit_code: 3

  # Secrets
  - code: AF-SEC-001
    area: SEC
    message: "The variables {names} are declared in the manifest but were not found in any configured source."
    next_step: "Add them to one of the searched sources: {sources}."
    docs: guides/secrets
    retryable: false
    exit_code: 3
  - code: AF-SEC-002
    area: SEC
    message: "The credential for {source} was rejected after one refresh: {detail}"
    next_step: "Rotate the credential and store the new value where {source} reads it. A rejection that survives a refresh is a credential that was revoked or was never right, so retrying will not help."
    docs: guides/secrets
    retryable: false
    exit_code: 4
  - code: AF-SEC-003
    area: SEC
    message: "The value supplied for {name} carries a live credential prefix, and {name} is configured for sandbox use."
    next_step: "Point {name} at a sandbox credential; the environment must never hold a live key."
    docs: guides/secrets
    retryable: false
    exit_code: 6
  - code: AF-SEC-010
    area: SEC
    message: "The environment certificate could not be created: {detail}"
    next_step: "Run 'af doctor' to check the runtime, then bring the environment up again."
    docs: concepts/egress
    retryable: true
    exit_code: 1
  - code: AF-SEC-004
    area: SEC
    message: "The encrypted local store has no passphrase: no system keyring answered and AF_SECRET_PASSPHRASE is not set."
    next_step: "Set AF_SECRET_PASSPHRASE, or store the passphrase in the system keyring on a platform that has one. There is deliberately no default: a store encrypted with a passphrase everybody knows only looks encrypted."
    docs: guides/secrets
    retryable: false
    exit_code: 3

  # Database
  - code: AF-DB-001
    planned: true
    area: DB
    message: "The database provider {provider} is not registered in this build."
    next_step: "Set database.provider to one of: {available}."
    docs: providers/overview
    retryable: false
    exit_code: 3
  - code: AF-DB-002
    area: DB
    message: "The source database at {host} could not be reached."
    next_step: "Check that the host is reachable from this machine and that the connection string names the right port."
    docs: providers/overview
    retryable: true
    exit_code: 5
  - code: AF-DB-003
    area: DB
    message: "The source database is Postgres {found}, and this provider supports {supported}."
    next_step: "Use a provider that supports Postgres {found}, or upgrade the source."
    docs: providers/overview
    retryable: false
    exit_code: 3
  - code: AF-DB-004
    area: DB
    message: "The golden version {version} no longer exists."
    next_step: "Run 'af golden list' to see the available versions, then 'af up --golden <version>'."
    docs: concepts/goldens
    retryable: false
    exit_code: 5
  - code: AF-DB-005
    area: DB
    message: "The golden version {version} is still referenced by {count} environments and cannot be collected."
    next_step: "Run 'af down' on those environments first, or leave the version in place."
    docs: concepts/goldens
    retryable: false
    exit_code: 6
  - code: AF-DB-006
    area: DB
    message: "The provider's concurrent branch limit ({limit}) is reached."
    next_step: "Run 'af down' on unused environments or raise the limit in the provider settings."
    docs: providers/limits
    retryable: false
    exit_code: 5
  - code: AF-DB-014
    area: DB
    message: "No database branch exists for {env}."
    next_step: "Run 'af up' to create one. This is not a missing golden: nothing has been branched for this environment yet."
    docs: concepts/goldens
    retryable: false
    exit_code: 5
  - code: AF-DB-013
    area: DB
    message: "The database seed command failed: {detail}"
    next_step: "Run the command yourself against an empty database of the same version. It is: {command}"
    docs: concepts/goldens
    retryable: false
    exit_code: 5
  - code: AF-DB-012
    area: DB
    message: "No golden matches this manifest's masking rules, and {count} were made under different ones."
    next_step: "Run 'af golden refresh' to make one from the source this manifest names."
    docs: concepts/goldens
    retryable: false
    exit_code: 5
  - code: AF-DB-007
    planned: true
    area: DB
    message: "Extension {extension} is required by the golden and is not available on the target."
    next_step: "Install {extension} on the target, or remove its use from the schema before refreshing."
    docs: providers/overview
    retryable: false
    exit_code: 5
  - code: AF-DB-008
    area: DB
    message: "The database provider {provider} at {endpoint} rejected the configured credential."
    next_step: "Check the value of the variable named by database.api_key_env; the provider answered 401, so the credential reached it and was refused rather than being missing."
    docs: providers/overview
    retryable: false
    exit_code: 4
  - code: AF-DB-009
    area: DB
    message: "The Database Lab Engine at {endpoint} has no snapshot to build a golden from: {detail}"
    next_step: "Wait for the engine's own data retrieval to finish, then refresh again; its progress is at GET /instance/retrieval."
    docs: providers/dblab
    retryable: true
    exit_code: 5
  - code: AF-DB-010
    planned: true
    area: DB
    message: "The storage pool has {available} free and the operation needs {needed}."
    next_step: "Run 'af golden gc' to reclaim unreferenced versions, or grow the pool."
    docs: concepts/goldens
    retryable: false
    exit_code: 5
  - code: AF-DB-011
    area: DB
    message: "The subset could not be taken: {detail}"
    next_step: "Run 'af explain' to see the effective subset block, and check that the seed table and its predicate name columns this database has."
    docs: concepts/subsetting
    retryable: false
    exit_code: 4
  - code: AF-DB-020
    area: DB
    message: "Personas cannot be provisioned because {provider} creates users only through its own API, and no sandbox tenant is configured."
    next_step: "Point auth.url or auth.domain at a sandbox, development or staging tenant and set auth.sandbox: true, so that personas are never created in production."
    docs: guides/personas
    retryable: false
    exit_code: 3
  - code: AF-DB-021
    area: DB
    message: "{provider} rejected the admin token used to create personas."
    next_step: "Check that the variable named by auth.token_env holds a key for the sandbox tenant with permission to create users."
    docs: guides/personas
    retryable: false
    exit_code: 4
  - code: AF-DB-031
    area: DB
    message: "The migration finding {rule} fails this project's policy: {detail}"
    next_step: "The report above names the table and the statement. Fix the migration, or lower the rule to 'warn' in the manifest's policy block."
    docs: concepts/verdicts
    retryable: false
    exit_code: 8
  - code: AF-DB-030
    area: DB
    message: "Migrations failed on the branch: {detail}"
    next_step: "The rehearsal names the statement that failed and times the ones before it. Fix the migration and push again: a migration that fails on a branch with production's shape is one that would have failed in production."
    docs: concepts/insights
    retryable: false
    exit_code: 5
  - code: AF-DB-032
    area: DB
    message: "The previous release does not survive this migration: {detail}"
    next_step: "A rolling deploy runs both releases at once, so make the change backward compatible: add the new column and write to both, migrate the readers, and drop the old one in a later deploy."
    docs: concepts/insights
    retryable: false
    exit_code: 8

  # Masking
  - code: AF-MSK-001
    area: MSK
    message: "The golden {version} has no valid verification attestation and cannot be branched."
    next_step: "Run 'af golden verify {version}'; a golden is branchable only once verification has passed."
    docs: concepts/verification
    retryable: false
    exit_code: 7
  - code: AF-MSK-002
    area: MSK
    message: "Verification found data matching {detector} in {table}.{column}."
    next_step: "Add a masking rule for {table}.{column} and refresh the golden. The value itself is never printed."
    docs: concepts/verification
    retryable: false
    exit_code: 7
  - code: AF-MSK-003
    planned: true
    area: MSK
    message: "The masking rule for {table}.{column} names a column that does not exist in the schema."
    next_step: "Remove the rule or correct the name; 'af mask plan' lists the columns it found."
    docs: concepts/masking
    retryable: false
    exit_code: 3
  - code: AF-MSK-004
    planned: true
    area: MSK
    message: "Masking would violate the check constraint {constraint} on {table}.{column}."
    next_step: "Choose a format preserving transform for {table}.{column} that satisfies {constraint}."
    docs: reference/transforms
    retryable: false
    exit_code: 7
  - code: AF-MSK-005
    planned: true
    area: MSK
    message: "Masking is only permitted on a golden candidate, and {target} is a source database."
    next_step: "Run masking against a golden candidate; the engine never rewrites a source."
    docs: concepts/masking
    retryable: false
    exit_code: 6
  - code: AF-MSK-007
    planned: true
    area: MSK
    message: "The transform on {table}.{column} produced duplicate values under the unique constraint {constraint}."
    next_step: "Use a transform that preserves uniqueness, such as email or uuid_remap, for {table}.{column}."
    docs: reference/transforms
    retryable: false
    exit_code: 7
  - code: AF-MSK-008
    planned: true
    area: MSK
    message: "The columns {columns} hold free text and have no masking rule."
    next_step: "Give each column a rule, or allowlist it explicitly if it is known to hold no personal data."
    docs: concepts/masking
    retryable: false
    exit_code: 7

  # Build
  - code: AF-BLD-001
    area: BLD
    message: "The build for service {service} failed after {duration}."
    next_step: "Read the build log above; the first error line names the step that failed."
    docs: guides/build
    retryable: false
    exit_code: 1
  - code: AF-BLD-002
    area: BLD
    message: "The Dockerfile for {service} is not valid at line {line}: {detail}"
    next_step: "Fix the line and run 'af up' again."
    docs: guides/build
    retryable: false
    exit_code: 3
  - code: AF-BLD-003
    area: BLD
    message: "The build context for {service} is {size}, above the {limit} limit."
    next_step: "Add large directories to .dockerignore; the build does not need them."
    docs: guides/build
    retryable: false
    exit_code: 3
  - code: AF-BLD-004
    area: BLD
    message: "The build context for {service} holds more than {count} files; {path} is where the count was reached."
    next_step: "Add the generated directories to .dockerignore; a build context should hold source, not output."
    docs: guides/build
    retryable: false
    exit_code: 3
  - code: AF-BLD-010
    area: BLD
    message: "No build strategy could be detected for {service}."
    next_step: "Add a Dockerfile to {path}, or set services.{service}.build to a strategy the reference lists."
    docs: guides/build
    retryable: false
    exit_code: 3

  - code: AF-BLD-011
    area: BLD
    message: "The Dockerfile {dockerfile} for {service} is excluded from the build context by .dockerignore."
    next_step: "Add '!{dockerfile}' to .dockerignore. The file exists, and the build sends a filtered copy of the tree to the daemon, so a path the ignore file excludes is not there to build from."
    docs: guides/build
    retryable: false
    exit_code: 3

  # Runtime
  - code: AF-BLD-012
    area: BLD
    message: "The Dockerfile {dockerfile} for {service} is outside the build context {context}."
    next_step: "Widen build.context, or move the Dockerfile inside it. A build cannot read a file the context does not carry."
    docs: guides/build
    retryable: false
    exit_code: 4
  - code: AF-RUN-001
    area: RUN
    message: "The command '{command}' is not available in this version."
    next_step: "See the roadmap for when it lands; 'af version' reports the version you are running."
    docs: reference/cli
    retryable: false
    exit_code: 2
  - code: AF-RUN-002
    area: RUN
    message: "The Docker daemon at {endpoint} could not be reached."
    next_step: "Start Docker and run 'af doctor' to confirm; on macOS that is Docker Desktop."
    docs: guides/local-runtime
    retryable: true
    exit_code: 5
  - code: AF-RUN-003
    area: RUN
    message: "Another Antifailure process holds the lock for this branch (process {pid}, since {since})."
    next_step: "Wait for it to finish, or stop it and run 'af down' to clean up."
    docs: concepts/journal
    retryable: true
    exit_code: 1
  - code: AF-RUN-040
    area: RUN
    message: "The environment could not be placed: {detail}"
    next_step: "Run 'af doctor' to check the runtime, then 'af down' to clear anything left behind."
    docs: guides/local-runtime
    retryable: true
    exit_code: 1
  - code: AF-RUN-041
    area: RUN
    message: "The services depend on each other in a cycle: {cycle}"
    next_step: "Remove one of the depends_on entries; a cycle has no order that can start."
    docs: reference/manifest
    retryable: false
    exit_code: 3
  - code: AF-RUN-042
    area: RUN
    message: "Service {service} depends on {missing}, which the manifest does not declare."
    next_step: "Add a service called {missing}, or correct the depends_on entry."
    docs: reference/manifest
    retryable: false
    exit_code: 3
  - code: AF-RUN-043
    area: RUN
    message: "This cluster is not containing the environment: {detail}"
    next_step: "Use a cluster whose CNI enforces NetworkPolicy rather than only accepting it, then run 'af up' again."
    docs: guides/kubernetes-runtime
    retryable: false
    exit_code: 3
  - code: AF-RUN-044
    area: RUN
    message: "This runtime cannot do that: {detail}"
    next_step: "Use the runtime that supports it, or run the command against an environment placed by one that does."
    docs: guides/kubernetes-runtime
    retryable: false
    exit_code: 3
  - code: AF-RUN-045
    area: RUN
    message: "{kind} {name} was not created by this runtime, so it was not removed."
    next_step: "Remove it yourself if you meant to, or use an environment id this runtime placed. 'af env list' shows the ones it owns."
    docs: guides/kubernetes-runtime
    retryable: false
    exit_code: 3
  - code: AF-RUN-009
    area: RUN
    message: "No free port was found in the range {range} to publish the environment on."
    next_step: "Free a port in that range, or set runtime.port_from in the manifest to a range that is clear."
    docs: guides/local-runtime
    retryable: true
    exit_code: 1
  - code: AF-RUN-004
    area: RUN
    message: "Service {service} did not become ready within {timeout}."
    next_step: "The last log lines are above. Check the health path {health} and the port the service binds."
    docs: guides/local-runtime
    retryable: true
    exit_code: 1
  - code: AF-RUN-005
    area: RUN
    message: "Service {service} exited with code {code} during startup."
    next_step: "The last log lines are above. Run 'af logs {service}' for the full output."
    docs: guides/local-runtime
    retryable: false
    exit_code: 1
  - code: AF-RUN-010
    area: RUN
    message: "Writing to {path} failed because the disk is full; {needed} is required."
    next_step: "Free space on the volume holding {path}, then run the command again."
    docs: guides/local-runtime
    retryable: true
    exit_code: 1
  - code: AF-RUN-011
    planned: true
    area: RUN
    message: "The local state database at {path} is corrupt."
    next_step: "A backup was written to {backup}. The database was rebuilt, so it now tracks nothing: run 'af env list' to see what is still running and 'af env prune --older-than 0' to remove all of it."
    docs: concepts/journal
    retryable: false
    exit_code: 1
  - code: AF-RUN-020
    area: RUN
    message: "Docker has no room left for the environment: {detail}"
    next_step: "Run 'docker system prune' or raise the disk limit in Docker's settings."
    docs: guides/local-runtime
    retryable: true
    exit_code: 5
  - code: AF-RUN-030
    area: RUN
    message: "The environment could not be torn down completely; {count} resources are still recorded."
    next_step: "Run 'af down' again once the provider is reachable; the journal remembers what is left."
    docs: concepts/journal
    retryable: true
    exit_code: 10

  # Egress
  - code: AF-MSK-010
    area: MSK
    message: "Masking could not run: {detail}"
    next_step: "Run 'af mask plan' to see what was decided for each column."
    docs: concepts/masking
    retryable: false
    exit_code: 3
  - code: AF-NET-001
    area: NET
    message: "The request to {host} was blocked by rule {rule}."
    next_step: "Add an egress rule for {host} with the mode you intend, or leave it blocked."
    docs: concepts/egress
    retryable: false
    exit_code: 6
  - code: AF-NET-002
    area: NET
    message: "{request} is not a request that can be explained: {detail}"
    next_step: "Pass a method and a URL, as in 'af net explain GET https://api.stripe.com/v1/charges'."
    docs: reference/cli#af-net-explain
    retryable: false
    exit_code: 2
  - code: AF-NET-004
    planned: true
    area: NET
    message: "A request to {host} carried a live credential in the {header} header and was blocked."
    next_step: "Replace the credential with a sandbox key; an environment must never hold a live one."
    docs: concepts/egress
    retryable: false
    exit_code: 6
  - code: AF-NET-005
    planned: true
    area: NET
    message: "The sandbox credential for {host} was rejected: {detail}"
    next_step: "Check the sandbox key's permissions at the provider."
    docs: guides/sandbox
    retryable: false
    exit_code: 4
  - code: AF-NET-010
    area: NET
    message: "No mock matched {method} {path} on {host}."
    next_step: "A fixture skeleton was written to {suggestion}. Fill it in and run again."
    docs: guides/mocking
    retryable: false
    exit_code: 6
  - code: AF-NET-020
    planned: true
    area: NET
    message: "{host} rejected the environment certificate, which usually means the client pins its own."
    next_step: "Set the host to ALLOW so that its traffic is not intercepted, or disable pinning in the client for previews."
    docs: concepts/egress
    retryable: false
    exit_code: 6
  - code: AF-NET-021
    planned: true
    area: NET
    message: "{host} resolves only to IPv6 and the environment has IPv6 disabled."
    next_step: "Set egress.allow_ipv6 for this environment, or use a host with an IPv4 address."
    docs: concepts/egress
    retryable: false
    exit_code: 6
  - code: AF-NET-030
    planned: true
    area: NET
    message: "The synthesis model returned no usable response for {method} {path}."
    next_step: "SYNTH is an escape hatch, not a pass. Write a fixture for this endpoint instead."
    docs: guides/synth
    retryable: true
    exit_code: 5

  # Agent
  - code: AF-AGT-001
    area: AGT
    message: "The agent runner could not be started: {detail}"
    next_step: "Run 'af doctor' to check that the runner and its browsers are installed."
    docs: concepts/agents
    retryable: true
    exit_code: 1
  - code: AF-AGT-003
    area: AGT
    message: "The agent runner produced no readable output: {detail}"
    next_step: "This is the runner's own failure and not the application's; the output above is what it printed."
    docs: concepts/agents
    retryable: true
    exit_code: 1
  - code: AF-AGT-004
    area: AGT
    message: "The agent runner could not be found: {detail}"
    next_step: "Install it with 'af runner install', or point at a checkout with --runner."
    docs: concepts/agents
    retryable: false
    exit_code: 3
  - code: AF-AGT-002
    area: AGT
    message: "Workflow {workflow} exhausted its budget of {budget} before completing."
    next_step: "Raise the budget for {workflow} in the manifest, or split it into smaller workflows."
    docs: guides/workflows
    retryable: false
    exit_code: 8
  - code: AF-NET-011
    area: NET
    message: "No message matching {match} arrived within {timeout}."
    next_step: "Check 'af net log' to see whether the request was refused, and 'af inbox list' for what did arrive."
    docs: guides/inbox
    retryable: true
    exit_code: 8
  - code: AF-NET-013
    area: NET
