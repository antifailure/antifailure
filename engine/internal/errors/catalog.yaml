  # Differential oracle
  - code: AF-ORC-001
    area: ORC
    message: "The manifest declares no oracle block, so there is nothing to compare."
    next_step: "Add an oracle block with at least one probe; the manifest reference has the shape."
    docs: concepts/oracle
    retryable: false
    exit_code: 3
  - code: AF-ORC-002
    area: ORC
    message: "The oracle is on and declares no requests to send."
    next_step: "Add at least one entry under oracle.probes. Both versions have to receive the same requests in the same order, so the plan is written down rather than discovered."
    docs: concepts/oracle
    retryable: false
    exit_code: 3
  - code: AF-ORC-003
    area: ORC
    message: "The baseline revision could not be resolved: {detail}"
    next_step: "Set oracle.base_ref to a branch, tag, or commit this checkout can see, and fetch it if it is a remote ref."
    docs: concepts/oracle
    retryable: false
    exit_code: 3
  - code: AF-ORC-004
    area: ORC
    message: "The baseline and the candidate are both {commit}, so there is nothing to compare."
    next_step: "Commit the change, or point oracle.base_ref at the revision you meant to compare against."
    docs: concepts/oracle
    retryable: false
    exit_code: 3
  - code: AF-ORC-005
    area: ORC
    message: "The baseline revision {commit} could not be checked out: {detail}"
    next_step: "Check that the commit is present in this clone; a shallow clone often is not deep enough to reach it."
    docs: concepts/oracle
    retryable: true
    exit_code: 5
  - code: AF-ORC-006
    area: ORC
    message: "There is no web service to send requests to in the {side} environment."
    next_step: "Declare a service of kind web in the manifest; the oracle compares HTTP responses and needs somewhere to send them."
    docs: concepts/oracle
    retryable: false
    exit_code: 3
  - code: AF-ORC-007
    area: ORC
    message: "The baseline environment did not come up: {detail}"
    next_step: "Bring the baseline revision up on its own with 'af up' from a checkout of it to see the build or migration failure in full."
    docs: concepts/oracle
    retryable: true
    exit_code: 5
  - code: AF-ORC-008
    area: ORC
    message: "The {side} branch could not be read for comparison: {detail}"
    next_step: "Check the branch is reachable, or turn the contents comparison off with oracle.database.enabled: false to compare responses alone."
    docs: concepts/oracle
    retryable: true
    exit_code: 5
  - code: AF-ORC-009
    area: ORC
    message: "The golden version {version} the comparison pinned is no longer present or no longer verified."
    next_step: "Run the comparison again; both sides branch one golden and the one the candidate used has gone."
    docs: concepts/oracle
    retryable: true
    exit_code: 5
  - code: AF-ORC-010
    area: ORC
    message: "The candidate behaves differently from the baseline: {detail}"
    next_step: "Read the differences above. Each one is either the change you meant to make or a regression; raise oracle.fail_on if this class of difference is expected."
    docs: concepts/oracle
    retryable: false
    exit_code: 8

