# The single source of truth for every lint finding a user can see.
#
# A finding needs an identifier that does not move, because the rule name has
# to be free to. Rules are renamed as they get sharper: "index_not_concurrent"
# became clearer when the drop and the rebuild grew rules of their own, and a
# name that cannot be improved is a rule that cannot be improved. So the name
# is prose, the identifier is not, and anything filtering or suppressing a
# finding matches on the identifier.
#
# Go code in findings.gen.go, the reference page under reference/lint-findings
# and the published catalogue at https://antifailure.dev/lint-findings.v1.json
# are generated from this file by tools/lintgen. A rule constant with no entry
# here fails the build, and an entry naming no rule fails it too, so the
# catalogue can neither drift nor rot.
#
# Fields:
#   id       LINT-NNN. Assigned once, never reused, never reassigned. It is
#            deliberately not shaped like an error code: a finding is not a
#            refusal, and somebody searching the error reference for LINT-004
#            should not find a page about a different thing.
#   rule     The rule name the finding carries today. Free to change.
#   title    One line, lower case, naming what the rule found. Free to change.
#   retired  Why the rule is gone. An entry keeps its identifier forever once
#            it has one, so that a filter written against it never silently
#            starts matching something else. Nothing is retired today.
#
# Adding a rule: take the next unused number, never one freed by a retirement.
# tools/lintgen refuses a duplicate and tools/lintcheck refuses an identifier
# that has gone missing since it was registered.

findings:
  - id: LINT-001
    rule: no_lock_timeout
    title: "no lock_timeout, so a lock wait becomes an outage"
  - id: LINT-002
    rule: not_null_without_default
    title: "NOT NULL column added with no default"
  - id: LINT-003
    rule: set_not_null_existing_column
    title: "NOT NULL set on a column that already exists"
  - id: LINT-004
    rule: alter_column_type
    title: "column type change that rewrites the table"
  - id: LINT-005
    rule: index_not_concurrent
    title: "index built without CONCURRENTLY"
  - id: LINT-006
    rule: drop_index_not_concurrent
    title: "index dropped without CONCURRENTLY"
  - id: LINT-007
    rule: reindex_not_concurrent
    title: "index rebuilt without CONCURRENTLY"
  - id: LINT-008
    rule: foreign_key_not_valid
    title: "foreign key added without NOT VALID"
  - id: LINT-009
    rule: check_constraint_not_valid
    title: "CHECK constraint added without NOT VALID"
  - id: LINT-010
    rule: unique_constraint_builds_index
    title: "unique constraint that builds its index in place"
  - id: LINT-011
    rule: backfill_in_ddl_transaction
    title: "rows changed in the same transaction as the schema"
  - id: LINT-012
    rule: rename_column_in_use
    title: "column renamed while something still reads it"
  - id: LINT-013
    rule: drop_column_in_view
    title: "column dropped while a view still selects it"
  - id: LINT-014
    rule: vacuum_full
    title: "VACUUM FULL, which rewrites the table offline"
  - id: LINT-015
    rule: cluster
    title: "CLUSTER, which rewrites the table offline"
  - id: LINT-016
    rule: drop_table
    title: "table dropped"
  - id: LINT-017
    rule: truncate
    title: "table truncated"
