# The Antifailure GitHub Action.
#
#   - uses: antifailure/antifailure@v1
#
# Installs `af`, works out what the change touches, runs the check on a
# disposable copy of production, and leaves one comment on the pull request
# that it edits in place. Most repositories never write this line themselves:
# `.github/workflows/check.yml` in this repository calls it, and
# `examples/github-workflow.yml` calls that. Use the action directly when the
# job needs something of its own, such as a service container or a runner
# with a particular label.
#
# Every input reaches a script through `env:`, never through `${{ }}` inside
# a `run:` block, because the runner substitutes the expression before bash
# sees it and an input carrying a quote would become a command.
name: Antifailure
description: Check a pull request on a disposable copy of production, with masked data and a sealed network.
author: Antifailure
branding:
  icon: shield
  color: gray-dark

inputs:
  version:
    description: The Antifailure release to install, such as v1.2.1. Empty installs the latest release.
    required: false
    default: ''
  command:
    description: >-
      What to run. `ci` on a pull request. The hosted control plane sends
      `up`, `down`, `agents`, `load`, `scenario` or `explore` through the
      `dispatch` input instead, and that wins when both are set.
    required: false
    default: 'ci'
  dispatch:
    description: >-
      The caller's workflow_dispatch inputs as JSON, `toJSON(inputs)`. Empty
      or `{}` means this is a pull request and the command is `ci`.
    required: false
    default: '{}'
  control-plane:
    description: >-
      Address of a hosted control plane. Empty skips both calls to it and the
      job comments for itself, which is the self-hosted and no-account path.
    required: false
    default: ''
  report:
    description: Where to write the report that becomes the comment.
    required: false
    default: 'report.md'
  runner:
    description: >-
      Whether to install the agent runner, which drives a real browser and
      needs node. `auto` installs it for the commands that run agents.
      `always` and `never` do what they say.
    required: false
    default: 'auto'

outputs:
  command:
    description: The command that ran.
    value: ${{ steps.plan.outputs.command }}
  environment:
    description: Whether `af change` selected an environment for this change.
    value: ${{ steps.change.outputs.environment }}
  selected:
    description: The checks `af change` selected, comma separated.
    value: ${{ steps.change.outputs.selected }}
  handled:
    description: Whether a control plane took the report.
    value: ${{ steps.publish.outputs.handled }}

runs:
  using: composite
  steps:
    # Which command, from the dispatch JSON when there is one.
    - id: plan
      shell: bash
      env:
        AF_DISPATCH: ${{ inputs.dispatch }}
        AF_COMMAND_INPUT: ${{ inputs.command }}
        AF_RUNNER_INPUT: ${{ inputs.runner }}
      run: |
        set -euo pipefail
        dispatch="${AF_DISPATCH:-{}}"
        if [ "$dispatch" = "null" ] || [ -z "$dispatch" ]; then dispatch='{}'; fi
        pick() { printf '%s' "$dispatch" | jq -r --arg k "$1" '.[$k] // empty'; }
        command=$(pick command)
        command="${command:-${AF_COMMAND_INPUT:-ci}}"
        case "$command" in
          ci|up|down|agents|load|scenario|explore) ;;
          *) echo "::error::unknown command $command"; exit 2 ;;
        esac
        {
          echo "command=$command"
          echo "workflows=$(pick workflows)"
          echo "duration=$(pick duration)"
          echo "scale=$(pick scale)"
          echo "seed=$(pick seed)"
          echo "concurrency=$(pick concurrency)"
          echo "run_id=$(pick run_id)"
        } >> "$GITHUB_OUTPUT"
        runner=no
        case "$AF_RUNNER_INPUT" in
          always) runner=yes ;;
          never) runner=no ;;
          *) case "$command" in ci|agents|explore) runner=yes ;; esac ;;
        esac
        echo "runner=$runner" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: steps.plan.outputs.runner == 'yes'
      with:
        node-version: 22

    - name: Install Antifailure
      shell: bash
      env:
        AF_VERSION_INPUT: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$AF_VERSION_INPUT" ]; then export AF_VERSION="$AF_VERSION_INPUT"; fi
        curl -fsSL https://antifailure.dev/install.sh | sh
        # The installer writes GITHUB_PATH, which reaches later steps only.
        echo "$HOME/.antifailure/bin" >> "$GITHUB_PATH"

    - name: Install the agent runner
      if: steps.plan.outputs.runner == 'yes'
      shell: bash
      run: af runner install

    # Introduce this job to the control plane, if there is one.
    #
    # Every failure here is survived. A run that cannot say what it did is
    # still a run, and the comment below reports it either way. The two
    # ACTIONS_ID_TOKEN_REQUEST variables are set by the runner after
    # expressions are evaluated, so they are read from the environment with
    # a default rather than declared under env, and a fork sets neither.
    - id: claim
      if: inputs.control-plane != ''
      shell: bash
      env:
        AF_CONTROL_PLANE: ${{ inputs.control-plane }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        request_token="${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
        request_url="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
        if [ -z "$request_token" ] || [ -z "$request_url" ]; then
          echo "This job was granted no workflow identity, so it cannot introduce itself."
          echo "On a pull request from a fork GitHub withholds one, which is deliberate."
          echo "outcome=no-identity" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        identity=$(curl -sS -H "Authorization: Bearer $request_token" \
          "${request_url}&audience=antifailure-control-plane" |
          jq -r '.value // empty' || true)
        if [ -z "$identity" ]; then
          echo "GitHub would not mint a workflow identity for this job."
          echo "outcome=no-identity" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # THE STATUS AND THE REASON, NOT JUST WHETHER A TOKEN CAME BACK.
        #
        # This read `.token` and kept only whether one arrived, so every answer
        # the control plane can give collapsed into one empty string and one
        # sentence: a repository nobody connected, an organization whose billing
        # is stopped, a commit with no check waiting on it, a fork, and a re-run
        # the control plane turned away. The step said the same thing and exited
        # zero for all of them, and the publish step below is guarded on the
        # empty token, so it skipped and this job was green having told the check
        # on the commit nothing at all.
        #
        # The answer is kept in RUNNER_TEMP rather than the workspace, because
        # the credential is in that body and the workspace is what an upload step
        # publishes. `|| true` keeps a curl that could not connect from ending
        # the step; it writes `000` as the code, which is why the code is read.
        answer="${RUNNER_TEMP:-.}/af-claim.json"
        code=$(curl -sS -o "$answer" -w '%{http_code}' \
          -X POST "${AF_CONTROL_PLANE}/v1/pr/callback-token" \
          -H "Authorization: Bearer ${identity}" \
          -H 'content-type: application/json' \
          -d "{\"head_sha\":\"${HEAD_SHA}\"}" || true)
        token=$(jq -r '.token // empty' "$answer" 2>/dev/null || true)
        if [ -n "$token" ]; then
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "outcome=claimed" >> "$GITHUB_OUTPUT"
          echo "The control plane is expecting a report from this run."
          exit 0
        fi
        # One line, because a step output carrying a newline needs a delimiter
        # and a value that can carry the delimiter can write its own lines into
        # $GITHUB_OUTPUT.
        reason=$(jq -r '.error // empty' "$answer" 2>/dev/null | tr '\n\r' '  ' || true)
        if [ -z "$reason" ]; then
          reason="the control plane answered HTTP ${code} and gave no reason"
        fi
        # AN ANSWER AND AN ABSENCE OF ONE ARE DIFFERENT FACTS, and this workflow
        # runs in somebody else's repository, so the difference decides what it
        # is fair to do about it. A 4xx is the control plane saying no, with a
        # sentence naming something in this repository or its account. Anything
        # else, a 5xx or the `000` curl writes when it could not connect at all,
        # is a service that did not answer, which nobody reading this build can
        # fix. The last step of this action acts on that difference.
        case "$code" in
          4??) echo "outcome=refused" >> "$GITHUB_OUTPUT" ;;
          *) echo "outcome=unreachable" >> "$GITHUB_OUTPUT" ;;
        esac
        echo "reason=$reason" >> "$GITHUB_OUTPUT"
        echo "The control plane issued no callback credential for ${HEAD_SHA}."
        echo "HTTP ${code}: ${reason}"
        echo "This run therefore has no verdict to report, which the last step reads."

    # What this change touches, and which variables the manifest reads.
    #
    # With no manifest in the repository `af change` drafts one from the
    # repository and says so in the report, so a repository that has only
    # this workflow still gets a check. The `secrets` output it writes is
    # the list of variable names the manifest reads; check.yml runs the
    # same command before this action to select those out of the caller's
    # secrets, and a job that uses the action directly reads it to know
    # what to pass under env:.
    - id: change
      name: Work out what this change touches
      shell: bash
      env:
        AF_REPORT: ${{ inputs.report }}
      run: af change --write "$AF_REPORT"

    - name: Run the check
      if: steps.plan.outputs.command != 'ci' || github.event_name != 'pull_request' || steps.change.outputs.environment == 'true'
      shell: bash
      env:
        AF_COMMAND: ${{ steps.plan.outputs.command }}
        AF_WORKFLOWS: ${{ steps.plan.outputs.workflows }}
        AF_DURATION: ${{ steps.plan.outputs.duration }}
        AF_SCALE: ${{ steps.plan.outputs.scale }}
        AF_SEED: ${{ steps.plan.outputs.seed }}
        AF_CONCURRENCY: ${{ steps.plan.outputs.concurrency }}
        AF_RUN_ID: ${{ steps.plan.outputs.run_id }}
        AF_REPORT: ${{ inputs.report }}
        # Where the engine reports its own event stream. Unset, it attaches
        # no control plane sink and the run is unaffected. No token: the
        # engine trades this job's identity for a short lived credential the
        # same way the claim step did.
        AF_CONTROL_PLANE_URL: ${{ inputs.control-plane }}
      run: |
        set -euo pipefail
        # Secrets a reusable workflow selected by name arrive as pairs,
        # AF_SECRET_<n>_NAME and AF_SECRET_<n>, because a composite action
        # cannot read the caller's secrets and a workflow can look one up by
        # name in an expression but cannot name the variable it lands in.
        # Each pair whose name and value are both set is exported under the
        # name. Anything the caller set through env: directly is left alone.
        for i in $(seq 1 12); do
          name_var="AF_SECRET_${i}_NAME"
          value_var="AF_SECRET_${i}"
          name="${!name_var:-}"
          value="${!value_var:-}"
          unset "$name_var" "$value_var"
          [ -n "$name" ] && [ -n "$value" ] || continue
          if [ -n "${!name:-}" ]; then continue; fi
          export "$name=$value"
        done
        # The four the workflow has always mapped, under the names the
        # engine reads, when the caller's secrets carry them.
        if [ -z "${STRIPE_SECRET_KEY:-}" ] && [ -n "${STRIPE_TEST_SECRET_KEY:-}" ]; then
          export STRIPE_SECRET_KEY="$STRIPE_TEST_SECRET_KEY"
        fi
        case "$AF_COMMAND" in
          ci)
            af ci --report "$AF_REPORT" --report-json report.json
            ;;
          up)
            af up
            ;;
          down)
            af workload teardown --result teardown-result.json
            ;;
          scenario)
            args=()
            IFS=',' read -ra names <<< "$AF_WORKFLOWS" || true
            for name in "${names[@]:-}"; do
              if [ -n "$name" ]; then args+=(--only "$name"); fi
            done
            if [ -n "$AF_SEED" ]; then args+=(--seed "$AF_SEED"); fi
            if [ -n "$AF_CONCURRENCY" ]; then args+=(--concurrency "$AF_CONCURRENCY"); fi
            af load scenario ${args[@]+"${args[@]}"}
            ;;
          explore)
            args=()
            IFS=',' read -ra names <<< "$AF_WORKFLOWS" || true
            for name in "${names[@]:-}"; do
              if [ -n "$name" ]; then args+=(--only "$name"); fi
            done
            if [ -n "$AF_SEED" ]; then args+=(--seed "$AF_SEED"); fi
            af explore ${args[@]+"${args[@]}"}
            ;;
          *)
            af workload run \
              --kind "$AF_COMMAND" \
              --select "$AF_WORKFLOWS" \
              --duration "$AF_DURATION" \
              --scale "$AF_SCALE" \
              --seed "$AF_SEED" \
              --concurrency "$AF_CONCURRENCY" \
              --run-id "$AF_RUN_ID" \
              --result workload-result.json
            ;;
        esac

    # Tell the control plane what this commit did, with the credential the
    # claim step already holds. The control plane then publishes one check
    # run and maintains one comment, both fenced on the commit.
    - id: publish
      if: always() && steps.claim.outputs.token != '' && hashFiles('report.json') != ''
      shell: bash
      env:
        AF_CONTROL_PLANE: ${{ inputs.control-plane }}
        AF_REPORT: ${{ inputs.report }}
        TOKEN: ${{ steps.claim.outputs.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        jq -n --arg sha "$HEAD_SHA" \
              --rawfile markdown "$AF_REPORT" \
              --slurpfile report report.json \
              '{head_sha: $sha, markdown: $markdown, report: $report[0]}' > payload.json
        # THE ANSWER IS READ, AND UNTIL IT WAS THIS STEP COULD NOT FAIL.
        #
        # `handled=true` was written whatever came back, and curl without -f
        # exits zero on a 409. So a refused report produced a green step, a check
        # on the commit that never heard this run's verdict, AND no comment
        # either, because the fallback comment below is skipped when this step
        # says it handled the report. A run whose verdict reached nobody looked
        # exactly like one whose verdict landed.
        #
        # handled stays unset on anything but a 200, so the comment below carries
        # the report the check did not get.
        answer="${RUNNER_TEMP:-.}/af-report.json"
        code=$(curl -sS -o "$answer" -w '%{http_code}' \
          -X POST "${AF_CONTROL_PLANE}/v1/pr/report" \
          -H "Authorization: Bearer ${TOKEN}" \
          -H 'content-type: application/json' \
          --data-binary @payload.json || true)
        cat "$answer" 2>/dev/null || true
        echo
        if [ "$code" = "200" ]; then
          echo "handled=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        reason=$(jq -r '.error // empty' "$answer" 2>/dev/null | tr '\n\r' '  ' || true)
        if [ -z "$reason" ]; then
          reason="the control plane answered HTTP ${code} and gave no reason"
        fi
        # The same line as the claim step draws, for the same reason. A 4xx is
        # the control plane refusing THIS run's verdict while a check waits for
        # it, which is the failure this product exists to make visible, and this
        # run is the only party that can see it. A 5xx or a connection that never
        # opened is somebody else's outage, and a build in this repository is not
        # the place to learn about it.
        case "$code" in
          4??)
            echo "::error::this run checked ${HEAD_SHA} and the control plane refused its report:" \
              "${reason}. The check on the commit therefore says nothing about this run, so this" \
              "job is red rather than green and silent"
            exit 1
            ;;
          *)
            echo "::warning::this run could not deliver its report for ${HEAD_SHA}: ${reason}." \
              "The check on the commit will say nothing came back. The report is on the pull" \
              "request as a comment instead"
            exit 0
            ;;
        esac

    - name: Keep the workload result
      if: always() && hashFiles('workload-result.json') != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: workload-result
        path: workload-result.json
        retention-days: 30

    # One comment, edited in place. Always, because the report of a failing
    # run is the one worth reading. Not when the manifest says no comment,
    # and not when a control plane took the report and maintains its own.
    - name: Leave the report on the pull request
      if: >-
        always() && github.event_name == 'pull_request'
        && hashFiles(inputs.report) != ''
        && steps.change.outputs.comment != 'false'
        && steps.publish.outputs.handled != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        AF_REPORT: ${{ inputs.report }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        marker='<!-- antifailure:report -->'
        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" \
          --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")
        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
            -F body=@"$AF_REPORT" > /dev/null
        else
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -F body=@"$AF_REPORT" > /dev/null
        fi

    # WHAT THE CHECK ON THIS COMMIT WILL AND WILL NOT HEAR FROM THIS RUN.
    #
    # The claim step records which silence it hit and this is what reads it.
    # Without a step reading it, the outcome it writes would be a value nothing
    # consumes, and the whole defect here was a signal nothing consumed.
    #
    # This one only SAYS. The step that fails a build is the publish step above,
    # and it fails on one thing: a 4xx to a report this run held a credential to
    # send, which is a verdict the check was waiting for and did not get. Not
    # failing here is deliberate and it is the difference between this file and
    # .github/workflows/dogfood.yml, which runs this product against its own
    # control plane and fails on every silence: two of the ways a claim comes
    # back empty are things nobody reading a build in this repository can fix,
    # GitHub withholding a fork's identity and a control plane that did not
    # answer, and a run that was never issued a credential leaves the check
    # honest anyway, saying nothing came back once its deadline passes.
    - name: What the control plane knows about this run
      if: always() && !cancelled() && inputs.control-plane != ''
      shell: bash
      env:
        OUTCOME: ${{ steps.claim.outputs.outcome }}
        REASON: ${{ steps.claim.outputs.reason }}
        DELIVERED: ${{ steps.publish.outputs.handled }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        ON_A_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
      run: |
        set -euo pipefail
        case "$OUTCOME" in
          claimed)
            if [ "$DELIVERED" = "true" ]; then
              echo "The control plane has this run's verdict on ${HEAD_SHA}."
              exit 0
            fi
            # Two innocent ways to get here and one that is not, and this step
            # cannot tell them apart: a command other than `af ci`, which owes no
            # verdict, a change the manifest says needs no environment, so the
            # check never ran, or a report that was never produced. Said as a
            # warning rather than guessed at, because whether a verdict was owed
            # is the manifest's business and not this file's. The check on the
            # commit says nothing came back either way, which is true.
            echo "::warning::this run was issued a credential for ${HEAD_SHA} and delivered no" \
              "report, so the check on the commit will say nothing came back. That is expected" \
              "for a run that was not checking a change, and a defect for one that was"
            ;;
          no-identity)
            echo "GitHub granted this job no workflow identity, so it could not introduce itself."
            echo "On a pull request from a fork that is deliberate and nothing here is wrong."
            ;;
          refused)
            echo "::warning::the control plane issued no credential for ${HEAD_SHA}: ${REASON}." \
              "Nothing this run did will reach the check on the commit. Connect the repository," \
              "or take the control-plane input out of this workflow if it should not report"
            ;;
          unreachable)
            echo "::warning::the control plane could not be reached about ${HEAD_SHA}: ${REASON}." \
              "This build is not failed for it. The check on the commit will say nothing came back"
            ;;
          *)
            if [ "$ON_A_PULL_REQUEST" = "true" ]; then
              echo "::warning::the step that introduces this run to the control plane recorded no" \
                "outcome, so whether the check on ${HEAD_SHA} heard anything is unknown"
            fi
            ;;
        esac
