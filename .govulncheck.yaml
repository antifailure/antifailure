# Vulnerabilities that govulncheck can reach from our code and that we have
# decided not to act on, with the reason and the date the decision expires.
#
# This file is enforced by tools/vulncheck, not merely consulted by a human.
# Anything reachable and absent from this file fails the build; so does an entry
# past its expiry, and so does an entry that no longer matches a real finding.
# That last rule is what keeps the file honest: an exception left behind after
# the finding moves reads like protection that is not there.
#
# Adding an entry is a security decision. The bar is "this vulnerability cannot
# be reached through the way we use this dependency, and here is why", not
# "upgrading is inconvenient". If the fix exists, take the fix.
#
# The file is empty, and that is the stronger state rather than the weaker one.
#
# It held GO-2026-4883 and GO-2026-4887, both against github.com/docker/docker,
# both arguing that the vulnerable code runs inside the Docker daemon and that an
# API client cannot reach it. Both were accurate. The first said to revisit once
# the client packages moved to a Moby module path of their own and to drop the
# entry then, and they have: the engine imports github.com/moby/moby/client and
# github.com/moby/moby/api, which neither advisory names. tools/vulncheck then
# reported both entries as matching nothing, and the third rule above fails an
# entry like that, so removing them was required rather than merely permitted.
#
# Read that as the module graph changing, not the daemon. Both advisories are
# bugs in dockerd, which whoever runs it installs and upgrades, and the exposure
# a daemon's operator still carries is written up per advisory in
# docs/security/pentest-readiness.md.

allow: []
