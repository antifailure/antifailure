{{- include "cp.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cp.fullname" . }}
  labels: {{- include "cp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{- include "cp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Rolls the pods when a credential changes. Without this a rotated
        # secret sits unread until something unrelated causes a restart, which
        # is the kind of gap that gets discovered during an incident.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "cp.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: control-plane
          image: {{ include "cp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          env:
            {{- include "cp.appEnv" . | nindent 12 }}
            - name: AF_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.githubSecretName" . }}
                  key: {{ .Values.github.secretKeys.clientId }}
            - name: AF_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.githubSecretName" . }}
                  key: {{ .Values.github.secretKeys.clientSecret }}
            - name: AF_GITHUB_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.githubSecretName" . }}
                  key: {{ .Values.github.secretKeys.redirectUri }}
            - name: AF_PORT
              value: {{ .Values.config.port | quote }}
            - name: AF_POOL_MAX
              value: {{ .Values.config.poolMax | quote }}
            {{- if .Values.config.appBaseUrl }}
            - name: AF_APP_BASE_URL
              value: {{ .Values.config.appBaseUrl | quote }}
            {{- end }}
            {{- if .Values.config.insecureCookies }}
            - name: AF_INSECURE_COOKIES
              value: "1"
            {{- end }}
            {{- if .Values.config.operatorSetsPlan }}
            - name: AF_OPERATOR_SETS_PLAN
              value: "1"
            {{- end }}
            {{- if not (kindIs "invalid" .Values.config.signinAllowlist) }}
            # Set whenever the operator said anything at all, INCLUDING an
            # empty list, because the application reads an unset variable as
            # open to every GitHub account and an empty one as nobody. A block
            # that disappeared when the list was empty would turn the most
            # restrictive intent into the least restrictive deployment.
            - name: AF_SIGNIN_ALLOWLIST
              value: {{ join "," .Values.config.signinAllowlist | quote }}
            {{- end }}
            # The other half of that sentence, and always set, both ways. The
            # allowlist decides who may sign in; this decides whether there is a
            # room on the other side of the door. Rendered as an explicit 0
            # rather than omitted, because the value a reader of the manifest
            # needs is the answer rather than the absence of a question.
            - name: AF_SELF_SERVE_SIGNUP
              value: {{ ternary "1" "0" .Values.config.selfServeSignup | quote }}
            {{- if .Values.config.eventRetentionMonths }}
            - name: AF_EVENT_RETENTION_MONTHS
              value: {{ .Values.config.eventRetentionMonths | quote }}
            {{- end }}
            {{- if .Values.config.eventArchiveDir }}
            - name: AF_EVENT_ARCHIVE_DIR
              value: {{ .Values.config.eventArchiveDir | quote }}
            {{- end }}
            {{- if eq .Values.maintenance.mode "inProcess" }}
            # Only in this mode. Partition maintenance is DDL, so this is the
            # privileged role, and putting it here means every replica exposed
            # to traffic can ALTER TABLE. The default mode is `cronjob`
            # precisely so that this block does not render.
            - name: AF_MAINTENANCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.databaseSecretName" . }}
                  key: {{ .Values.database.secretKeys.migrationUrl }}
            {{- end }}
            {{- if .Values.github.apiBase }}
            - name: AF_GITHUB_API_BASE
              value: {{ .Values.github.apiBase | quote }}
            {{- end }}
            {{- if .Values.github.appId }}
            - name: AF_GITHUB_APP_ID
              value: {{ .Values.github.appId | quote }}
            - name: AF_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.githubSecretName" . }}
                  key: {{ .Values.github.secretKeys.appPrivateKey }}
            - name: AF_GITHUB_APP_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.githubSecretName" . }}
                  key: {{ .Values.github.secretKeys.appWebhookSecret }}
            {{- end }}
            {{- if .Values.github.installUrl }}
            - name: AF_GITHUB_APP_INSTALL_URL
              value: {{ .Values.github.installUrl | quote }}
            {{- end }}
            {{- if or .Values.database.adminUrl .Values.database.existingSecret }}
            # The operator portal's credential, and the only one on this
            # installation that can read across tenants. Its role holds
            # BYPASSRLS; the role in AF_DATABASE_URL above must not.
            - name: AF_ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.databaseSecretName" . }}
                  key: {{ .Values.database.secretKeys.adminUrl }}
                  # Optional, and only here. An operator supplying their own
                  # Secret has one Secret for the database, and whether it
                  # carries an operator credential is their decision, not
                  # something this chart can read off a values file. Absent, the
                  # operator portal is simply off, which is a supported state
                  # and the default one. Everywhere else a missing key should
                  # stop the pod.
                  optional: true
            {{- end }}
            {{- if .Values.config.adminPoolMax }}
            - name: AF_ADMIN_POOL_MAX
              value: {{ .Values.config.adminPoolMax | quote }}
            {{- end }}
            {{- if .Values.config.publicUrl }}
            - name: AF_PUBLIC_URL
              value: {{ .Values.config.publicUrl | quote }}
            {{- end }}
            {{- if .Values.config.siteOrigin }}
            # The one route on this server that answers a cross-origin browser.
            # Unset, a contact form on a separate marketing host cannot submit
            # and the visitor is shown a network error for a refusal this
            # deployment made on purpose.
            - name: AF_SITE_ORIGIN
              value: {{ .Values.config.siteOrigin | quote }}
            {{- end }}
            {{- if .Values.config.signupUrl }}
            - name: AF_SIGNUP_URL
              value: {{ .Values.config.signupUrl | quote }}
            {{- end }}
            {{- if .Values.config.productName }}
            - name: AF_PRODUCT_NAME
              value: {{ .Values.config.productName | quote }}
            {{- end }}
            {{- if .Values.config.modelPrices }}
            - name: AF_MODEL_PRICES
              value: {{ .Values.config.modelPrices | quote }}
            {{- end }}
            {{- if .Values.config.hostedRequiredPlan }}
            - name: AF_HOSTED_REQUIRED_PLAN
              value: {{ .Values.config.hostedRequiredPlan | quote }}
            {{- end }}
            {{- if include "cp.hasSecret" (dict "value" .Values.providerKeys.secret "existing" .Values.providerKeys.existingSecret) }}
            - name: AF_PROVIDER_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.providerKeysSecretName" . }}
                  key: {{ .Values.providerKeys.secretKeys.secret }}
            {{- end }}
            {{- if include "cp.hasSecret" (dict "value" .Values.mail.resendApiKey "existing" .Values.mail.existingSecret) }}
            - name: AF_RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.mailSecretName" . }}
                  key: {{ .Values.mail.secretKeys.resendApiKey }}
            {{- end }}
            {{- if .Values.mail.from }}
            - name: AF_MAIL_FROM
              value: {{ .Values.mail.from | quote }}
            {{- end }}
            {{- if .Values.mail.leadNotifyEmail }}
            - name: AF_LEAD_NOTIFY_EMAIL
              value: {{ .Values.mail.leadNotifyEmail | quote }}
            {{- end }}
            {{- if include "cp.hasSecret" (dict "value" .Values.stripe.secretKey "existing" .Values.stripe.existingSecret) }}
            - name: AF_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.stripeSecretName" . }}
                  key: {{ .Values.stripe.secretKeys.secretKey }}
            - name: AF_STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.stripeSecretName" . }}
                  key: {{ .Values.stripe.secretKeys.webhookSecret }}
            {{- end }}
            {{- if .Values.stripe.priceTeam }}
            - name: AF_STRIPE_PRICE_TEAM
              value: {{ .Values.stripe.priceTeam | quote }}
            {{- end }}
            {{- if include "cp.hasSecret" (dict "value" .Values.analytics.surrogateSecret "existing" .Values.analytics.existingSecret) }}
            - name: AF_ANALYTICS_SURROGATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.analyticsSecretName" . }}
                  key: {{ .Values.analytics.secretKeys.surrogateSecret }}
            {{- end }}
            {{- if .Values.analytics.operatorOrg }}
            - name: AF_ANALYTICS_OPERATOR_ORG
              value: {{ .Values.analytics.operatorOrg | quote }}
            {{- end }}
            {{- if .Values.analytics.retentionDays }}
            - name: AF_ANALYTICS_RETENTION_DAYS
              value: {{ .Values.analytics.retentionDays | quote }}
            {{- end }}
            # AF_MIGRATE is deliberately absent. Migrations are the bootstrap
            # Job's work, once, and not something every replica races to do on
            # startup.
            {{- with .Values.extraEnv }}
            # Last, so an operator can override anything above it: Kubernetes
            # takes the final entry when a name appears twice. That is the point
            # of an escape hatch, and it is also why it is not a substitute for
            # a named value: it can only be aimed by somebody who already knows
            # the name.
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          # A TCP check and not /health, on purpose. /health is a static
          # literal in the application: it cannot tell a replica that has lost
          # its database from one that is serving. Gating readiness on it would
          # claim more than it knows, so readiness claims only that the port is
          # accepting connections until the application grows a /ready that
          # queries the pool.
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, and Node writes to /tmp.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.config.eventArchiveDir }}
            - name: archive
              mountPath: {{ .Values.config.eventArchiveDir }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.config.eventArchiveDir }}
        - name: archive
          emptyDir: {}
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
