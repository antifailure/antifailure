{{- include "cp.validate" . -}}
{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.fullname" . }}-database
  labels: {{- include "cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKeys.url }}: {{ .Values.database.url | quote }}
  {{- if .Values.database.migrationUrl }}
  {{ .Values.database.secretKeys.migrationUrl }}: {{ .Values.database.migrationUrl | quote }}
  {{- end }}
  {{- if .Values.database.adminUrl }}
  {{ .Values.database.secretKeys.adminUrl }}: {{ .Values.database.adminUrl | quote }}
  {{- end }}
{{- end }}
---
{{- if not .Values.github.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.fullname" . }}-github
  labels: {{- include "cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.github.secretKeys.clientId }}: {{ .Values.github.clientId | quote }}
  {{ .Values.github.secretKeys.clientSecret }}: {{ .Values.github.clientSecret | quote }}
  {{ .Values.github.secretKeys.redirectUri }}: {{ .Values.github.redirectUri | quote }}
  {{- if .Values.github.privateKey }}
  {{ .Values.github.secretKeys.appPrivateKey }}: {{ .Values.github.privateKey | quote }}
  {{- end }}
  {{- if .Values.github.webhookSecret }}
  {{ .Values.github.secretKeys.appWebhookSecret }}: {{ .Values.github.webhookSecret | quote }}
  {{- end }}
{{- end }}

{{/*
The optional credentials, one Secret per provider.

Per provider rather than one Secret for all of them, because existingSecret is
the setting that matters here and it is per provider in practice: an operator
wiring External Secrets or Vault has one source per provider, and rotating a
Stripe key should not require re-rendering the Resend one. Each renders only
when there is a literal to put in it; an operator using existingSecret gets none
of these objects at all.
*/}}
{{- if and .Values.providerKeys.secret (not .Values.providerKeys.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.fullname" . }}-provider-keys
  labels: {{- include "cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.providerKeys.secretKeys.secret }}: {{ .Values.providerKeys.secret | quote }}
{{- end }}

{{- if and .Values.mail.resendApiKey (not .Values.mail.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.fullname" . }}-mail
  labels: {{- include "cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mail.secretKeys.resendApiKey }}: {{ .Values.mail.resendApiKey | quote }}
{{- end }}

{{- if and .Values.stripe.secretKey (not .Values.stripe.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.fullname" . }}-stripe
  labels: {{- include "cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.stripe.secretKeys.secretKey }}: {{ .Values.stripe.secretKey | quote }}
  {{ .Values.stripe.secretKeys.webhookSecret }}: {{ .Values.stripe.webhookSecret | quote }}
{{- end }}

{{- if and .Values.analytics.surrogateSecret (not .Values.analytics.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.fullname" . }}-analytics
  labels: {{- include "cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.analytics.secretKeys.surrogateSecret }}: {{ .Values.analytics.surrogateSecret | quote }}
{{- end }}
