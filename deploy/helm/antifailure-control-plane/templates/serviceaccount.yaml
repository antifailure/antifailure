{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cp.serviceAccountName" . }}
  labels: {{- include "cp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The control plane calls out to GitHub and to its database. It never calls the
# Kubernetes API, so it is not given a token that would let it.
automountServiceAccountToken: false
{{- end }}
