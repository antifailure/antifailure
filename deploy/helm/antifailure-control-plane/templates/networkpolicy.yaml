{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cp.fullname" . }}
  labels: {{- include "cp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cp.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        []
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.port }}
{{- end }}
