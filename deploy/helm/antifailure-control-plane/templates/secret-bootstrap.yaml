{{- if and .Values.bootstrap.enabled (not .Values.database.existingSecret) }}
{{- include "cp.validate" . -}}
# The bootstrap Job's credentials, as a hook.
#
# WHY THIS IS A SECOND SECRET AND NOT THE ONE IN secret.yaml.
#
# The Job is a pre-install hook, so it runs before ANY of the release's normal
# resources exist, the release's own Secret included. A pod whose env refers to
# a Secret that is not there does not fail fast: it sits in
# CreateContainerConfigError, the kubelet retries it every twenty seconds, and
# eight minutes later `helm install` reports "timed out waiting for the
# condition". That is what happened the first two times this chart met a real
# cluster.
#
# Hook weights order hooks against each other, so this one is created first at
# -10 and the Job follows at -5.
#
# It is deleted once the hook succeeds, and kept when it fails, which is when
# somebody needs to look at it. So the migration credential is present in the
# cluster only while the work that needs it is running.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.fullname" . }}-bootstrap
  labels: {{- include "cp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{ .Values.database.secretKeys.url }}: {{ .Values.database.url | quote }}
  {{ .Values.database.secretKeys.migrationUrl }}: {{ .Values.database.migrationUrl | quote }}
{{- end }}
